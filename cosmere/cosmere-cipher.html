<style>
  :root{
    --ink: #07070c;
    --ink-deep: #030305;
    --panel: #12121c;
    --panel-line: #2a2a3a;
    --bronze: #b08a4e;
    --bronze-dim: #6e5a37;
    --starlight: #ece7da;
    --ember: #d4572e;
    --ok: #7fbf6a;
    --dim-text: #8d8878;
  }
  *{box-sizing:border-box;}
  html,body{
    min-height:100%; margin:0;
    background: var(--ink);
    color: var(--starlight);
    font-family: 'Crimson Text', serif;
  }
  body{
    position:relative;
    min-height:100vh;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(236,231,218,.5) 0, transparent 50%),
      radial-gradient(1px 1px at 78% 8%, rgba(236,231,218,.4) 0, transparent 50%),
      radial-gradient(1.5px 1.5px at 34% 62%, rgba(236,231,218,.5) 0, transparent 50%),
      radial-gradient(1px 1px at 91% 44%, rgba(236,231,218,.35) 0, transparent 50%),
      radial-gradient(1px 1px at 6% 82%, rgba(236,231,218,.4) 0, transparent 50%),
      radial-gradient(1.5px 1.5px at 58% 88%, rgba(236,231,218,.5) 0, transparent 50%),
      radial-gradient(1px 1px at 68% 30%, rgba(236,231,218,.3) 0, transparent 50%),
      radial-gradient(circle at 50% 25%, #0d0d16 0%, var(--ink-deep) 75%);
  }

  /* ---- floating key field ---- */
  #field{ position:absolute; inset:0; z-index:1; min-height: 100vh; pointer-events:none; }
  .floater{
    position:absolute;
    pointer-events:none;
    animation: driftKey var(--dur, 9s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes driftKey{
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(var(--dx1, 20px), var(--dy1, -25px)) rotate(var(--r1, 8deg)); }
    50%  { transform: translate(var(--dx2, -15px), var(--dy2, -10px)) rotate(var(--r2, -6deg)); }
    75%  { transform: translate(var(--dx3, -25px), var(--dy3, 18px)) rotate(var(--r3, 5deg)); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  .bob{
    display:inline-block;
    pointer-events:none;
    animation: bobKey var(--bobDur, 2.4s) ease-in-out infinite;
    animation-delay: var(--bobDelay, 0s);
  }
  @keyframes bobKey{
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }
  .key{
    display:block;
    font-size: 1.5rem;
    line-height:1;
    cursor:pointer;
    user-select:none;
    filter: drop-shadow(0 0 6px rgba(0,0,0,.6));
    transition: transform .3s ease, filter .3s ease, opacity .3s ease;
    opacity:.55;
    background:none; border:none; padding:0;
    pointer-events:auto;
  }
  .key:hover, .key:focus-visible{ transform: scale(1.4); opacity:1; filter: drop-shadow(0 0 10px var(--bronze)); }
  .key.found{ opacity: .8; }

  @media (prefers-reduced-motion: reduce){
    .floater, .bob{ animation:none!important; }
  }

  #cluePop .plain{
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 1.5rem;
    color: #3a2c1a;
    line-height: 1.1;

  /* ---- central puzzle card ---- */
  main{
    position:relative; z-index:2;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 2.5rem 1.5rem;
    pointer-events:none; /* let clicks fall through to the floating keys beneath */
  }
  #card{
    pointer-events:auto;
    width: min(520px, 94vw);
    background: linear-gradient(180deg, var(--panel), #0d0d15);
    border: 1px solid var(--panel-line);
    border-radius: 6px;
    padding: 2.1rem 2rem 1.8rem;
    text-align:center;
    box-shadow: 0 30px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(176,138,78,.08);
  }
  #card h1{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size: 1.15rem;
    letter-spacing:.04em;
    margin: 0 0 .3rem;
    color: var(--starlight);
  }
  #card p.sub{
    margin: 0 0 1.4rem;
    font-size: .98rem;
    font-style: italic;
    line-height:1.6;
    color: var(--dim-text);

  /* ---- ciphered target ---- */
  .tiles{ display:flex; gap:.4rem; justify-content:center; margin-bottom:1.6rem; flex-wrap:wrap; }

    width: 2.15rem; height: 2.55rem;
    border: 1px solid var(--bronze-dim);
    border-radius: 3px;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 1.15rem;
    color: var(--bronze);
    background: rgba(176,138,78,.05);
  }

  form{ display:flex; gap:.5rem; }
  #guess{
    flex:1;
    background: var(--ink-deep);
    border: 1px solid var(--panel-line);
    color: var(--starlight);
    font-family:'Crimson Text', serif;
    font-size: 1.05rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: .6rem .7rem;
    border-radius: 3px;
    text-align:center;
  }
  #guess:focus{ outline: 1px solid var(--bronze); border-color: var(--bronze); }
  button.submit{
    background: var(--bronze-dim);
    color: var(--starlight);
    border: none;
    border-radius: 3px;
    padding: 0 1.1rem;
    font-family:'Cinzel', serif;
    font-size: .85rem;
    cursor:pointer;
    transition: background .2s ease;
  }
  button.submit:hover{ background: var(--bronze); color:#1a1408; }

  #msg{ min-height: 1.4rem; margin-top: .9rem; font-size: .92rem; font-style: italic; }
  #msg.err{ color: var(--ember); }
  #msg.ok{ color: var(--ok); }

  #unlockBox{
    display:none;
    margin-top: 1.4rem;
    padding-top: 1.3rem;
    border-top: 1px solid var(--panel-line);
  }
  #unlockBox a{
    display:inline-block;
    color: #1a1408;
    background: var(--bronze);
    font-family:'Cinzel', serif;
    font-size: .88rem;
    text-decoration:none;
    padding: .65rem 1.3rem;
    border-radius: 3px;
    box-shadow: 0 0 22px rgba(176,138,78,.35);
  }

  @keyframes pulseUnlock{
    0%{ box-shadow: 0 30px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(176,138,78,.08); }
    40%{ box-shadow: 0 30px 70px rgba(0,0,0,.65), 0 0 45px 4px rgba(176,138,78,.5); }
    100%{ box-shadow: 0 30px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(176,138,78,.08); }
  }
  #card.unlocked{ animation: pulseUnlock 1.4s ease; }

<body>

<div id="field" aria-hidden="true"></div>
<div id="cluePop"></div>

<main>
  <div id="card">
    <h1>the cryptogram</h1>
    <p class="sub">Twenty-six letters, mingled — each one wearing another's face.<br>
    Somewhere in the dark, small keys drift and turn. Catch one, and it will trade you a word you know for the shape it's wearing now.</p>

    <div class="tiles" id="tiles"></div>

    <form id="guessForm" autocomplete="off">
      <input id="guess" maxlength="10" placeholder="your answer" aria-label="Decoded word">
      <button class="submit" type="submit">decode</button>
    </form>
    <div id="msg" role="status"></div>

    <div id="unlockBox">
      <a id="unlockLink" href="cosmere-podcast.html">enter the archive</a>
    </div>
  </div>
</main>

<script>
(function(){
  "use strict";

  var ANSWER = "COSMERE";
  var CIPHERED = "MBRVJXJ";

  // classic Sanderson-lore clue words, each paired with its ciphered form.
  // together they cover every letter needed to decode COSMERE.
  var CLUES = [
    { plain: "STORMLIGHT",   cipher: "RSBXVPNIFS"  },
    { plain: "ALLOMANCY",    cipher: "GPPBVGLMH"   },
    { plain: "SHARDBLADE",   cipher: "RFGXWQPGWJ"  },
    { plain: "HEMALURGY",    cipher: "FJVGPAXIH"   },
    { plain: "VOIDBRINGER",  cipher: "KBNWQXNLIJX" },
    { plain: "INVESTITURE",  cipher: "NLKJRSNSAXJ" },
    { plain: "KANDRA",       cipher: "ZGLWXG"      }
  ];

  var foundClues = [];
  try {
    var saved = JSON.parse(localStorage.getItem('cosmere_clues_found') || '[]');
    if (Array.isArray(saved)) foundClues = saved;
  } catch(e){}

  function markClueFound(idx){
    if (foundClues.indexOf(idx) === -1){
      foundClues.push(idx);
      try { localStorage.setItem('cosmere_clues_found', JSON.stringify(foundClues)); } catch(e){}
    }
  }

  // ---- ciphered target tiles ----
  var tiles = document.getElementById('tiles');
  CIPHERED.split('').forEach(function(ch){
    var d = document.createElement('div');
    d.className = 'tile';
    d.textContent = ch;
    tiles.appendChild(d);
  });

  // ---- floating keys ----
  var field = document.getElementById('field');
  var cluePop = document.getElementById('cluePop');

  function randomOuterPosition(){
    // keep clear of the central card (roughly the middle 60% x 55%)
    var x, y, tries = 0;
    do {
      x = 4 + Math.random() * 90;
      y = 5 + Math.random() * 86;
      tries++;
    } while (x > 18 && x < 82 && y > 20 && y < 80 && tries < 30);
    return { x: x, y: y };
  }

  CLUES.forEach(function(clue, idx){
    var pos = randomOuterPosition();

    var floater = document.createElement('div');
    floater.className = 'floater';
    floater.style.left = pos.x + '%';
    floater.style.top = pos.y + '%';
    floater.style.setProperty('--dur', (7 + Math.random() * 5).toFixed(2) + 's');
    floater.style.setProperty('--delay', (Math.random() * 4).toFixed(2) + 's');
    floater.style.setProperty('--dx1', (Math.random() * 50 - 25).toFixed(0) + 'px');
    floater.style.setProperty('--dy1', (Math.random() * 50 - 25).toFixed(0) + 'px');
    floater.style.setProperty('--dx2', (Math.random() * 50 - 25).toFixed(0) + 'px');
    floater.style.setProperty('--dy2', (Math.random() * 50 - 25).toFixed(0) + 'px');
    floater.style.setProperty('--dx3', (Math.random() * 50 - 25).toFixed(0) + 'px');
    floater.style.setProperty('--dy3', (Math.random() * 50 - 25).toFixed(0) + 'px');
    floater.style.setProperty('--r1', (Math.random() * 20 - 10).toFixed(0) + 'deg');
    floater.style.setProperty('--r2', (Math.random() * 20 - 10).toFixed(0) + 'deg');
    floater.style.setProperty('--r3', (Math.random() * 20 - 10).toFixed(0) + 'deg');

    var bob = document.createElement('div');
    bob.className = 'bob';
    bob.style.setProperty('--bobDur', (1.8 + Math.random() * 1.4).toFixed(2) + 's');
    bob.style.setProperty('--bobDelay', (Math.random() * 2).toFixed(2) + 's');

    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'key' + (foundClues.indexOf(idx) !== -1 ? ' found' : '');
    el.textContent = '🔑';
    el.setAttribute('aria-label', 'a drifting key');

    el.addEventListener('click', function(){
      el.classList.add('found');
      markClueFound(idx);

      cluePop.innerHTML = '';
      var p1 = document.createElement('div');
      p1.className = 'plain';
      p1.textContent = clue.plain;
      var p2 = document.createElement('div');
      p2.className = 'cipher';
      p2.textContent = clue.cipher;
      cluePop.appendChild(p1);
      cluePop.appendChild(p2);
      var tilt = (Math.random() * 8 - 4).toFixed(1);
      cluePop.style.transform = 'rotate(' + tilt + 'deg)';
      cluePop.style.left = Math.min(Math.max(pos.x - 8, 2), 62) + '%';
      cluePop.style.top = Math.max(pos.y - 10, 2) + '%';
      cluePop.style.display = 'block';
      setTimeout(function(){ cluePop.style.display = 'none'; }, 4500);
    });

    bob.appendChild(el);
    floater.appendChild(bob);
    field.appendChild(floater);
  });

  // ---- answer check ----
  var form = document.getElementById('guessForm');
  var input = document.getElementById('guess');
  var msg = document.getElementById('msg');
  var card = document.getElementById('card');
  var unlockBox = document.getElementById('unlockBox');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var val = (input.value || '').trim().toUpperCase();
    if (val === ANSWER){
      msg.textContent = 'The word holds.';
      msg.className = 'ok';
      card.classList.add('unlocked');
      unlockBox.style.display = 'block';
      try { localStorage.setItem('cosmere_unlocked', 'true'); } catch(e){}
      form.querySelector('input').disabled = true;
      form.querySelector('button').disabled = true;
    } else {
      msg.textContent = 'Not yet.';
      msg.className = 'err';
    }
  });

  try {
    if (localStorage.getItem('cosmere_unlocked') === 'true'){
      msg.textContent = 'Already decoded.';
      msg.className = 'ok';
      unlockBox.style.display = 'block';
    }
  } catch(e){}
})();
</script>
</body>
