<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#07070c; --ink-deep:#030305; --panel:#12121c; --panel-line:#2a2a3a;
    --bronze:#b08a4e; --bronze-dim:#6e5a37; --starlight:#ece7da; --ember:#d4572e;
    --dim-text:#8d8878;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; min-height:100%; background:var(--ink); color:var(--starlight);
    font-family:'Crimson Text', serif; }
  body{
    background-image:
      radial-gradient(1px 1px at 15% 20%, rgba(236,231,218,.35) 0, transparent 50%),
      radial-gradient(1px 1px at 80% 10%, rgba(236,231,218,.3) 0, transparent 50%),
      radial-gradient(1.5px 1.5px at 40% 70%, rgba(236,231,218,.4) 0, transparent 50%),
      radial-gradient(circle at 50% 0%, #0d0d16 0%, var(--ink-deep) 70%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{ text-align:center; padding: 3.2rem 1.5rem 1rem; }
  header h1{
    font-family:'Cinzel', serif; font-weight:700; letter-spacing:.03em;
    font-size: 1.4rem; line-height:1.4; margin:0 0 .5rem; color: var(--starlight);
    max-width: 560px; margin-left:auto; margin-right:auto;
  }
  header h1 .show-name{ color: var(--bronze); }
  header p{ margin:0; font-style:italic; color:var(--dim-text); }

  main{ flex:1; max-width: 480px; margin: 0 auto; padding: 1rem 1.5rem 3rem; width:100%; }

  /* ---- single episode slot: cover art, title underneath, player below ---- */
  .episode{ text-align:center; }
  .episode-art{
    width: 100%;
    max-width: 340px;
    aspect-ratio: 1 / 1;
    margin: 0 auto 1.1rem;
    border-radius: 8px;
    overflow:hidden;
    background: linear-gradient(155deg, #1c1420, #0d0a10);
    border: 1px solid var(--panel-line);
    box-shadow: 0 20px 45px rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
  }
  .episode-art img{ width:100%; height:100%; object-fit:cover; display:block; }
  .episode-art .placeholder{
    font-size: 2.6rem; opacity:.4;
  }
  .episode h2{
    font-family:'Cinzel', serif; font-size: 1.1rem; font-weight:700;
    margin: 0 0 .3rem; color: var(--bronze); line-height:1.4;
  }
  .episode .meta{ font-size:.85rem; color:var(--dim-text); margin-bottom:1.1rem; font-style:italic; }
  audio{ width:100%; }

  /* ---- links footer ---- */
  footer{
    border-top: 1px solid var(--panel-line);
    padding: 1.8rem 1.5rem 2.6rem;
    text-align:center;
  }
  footer .footer-label{
    font-family:'Cinzel', serif; font-size:.8rem; letter-spacing:.08em;
    color: var(--dim-text); margin-bottom: .9rem;
  }
  footer .links{
    display:flex; flex-direction:column; gap:.55rem;
    max-width: 340px; margin: 0 auto;
  }
  footer .links a{
    color: var(--starlight);
    text-decoration:none;
    font-size:.98rem;
    padding: .55rem .9rem;
    border: 1px solid var(--panel-line);
    border-radius: 5px;
    background: rgba(176,138,78,.04);
    transition: border-color .2s ease, background .2s ease;
  }
  footer .links a:hover{ border-color: var(--bronze-dim); background: rgba(176,138,78,.09); }

  #locked{
    max-width: 480px; margin: 4.5rem auto; text-align:center; padding: 0 1.5rem;
  }
  #locked p{ font-style:italic; color:var(--dim-text); }
  #locked a{ color: var(--bronze); }
</style>
</head>
<body>

<div id="locked" style="display:none;">
  <p>The archive is sealed. You'll need to find the key first.</p>
  <p><a href="cosmere-cipher.html">back to the cipher</a></p>
</div>

<div id="content" style="display:none;">
  <header>
    <h1>Welcome to the <span class="show-name">"Marine sings the wonders of BrandoSando"</span> podcast</h1>
    <p>Recordings, for those who found their way in.</p>
  </header>
  <main id="episodeList"></main>
  <footer>
    <div class="footer-label">elsewhere</div>
    <div class="links">
      <a href="https://www.brandonsanderson.com/" target="_blank" rel="noopener">Brandon Sanderson — official site</a>
      <a href="https://www.youtube.com/@BrandSanderson" target="_blank" rel="noopener">Brandon Sanderson on YouTube</a>
      <a href="https://www.youtube.com/watch?v=13coGQUp3ck" target="_blank" rel="noopener">Watch on YouTube</a>
    </div>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var unlocked = false;
  try { unlocked = localStorage.getItem('cosmere_unlocked') === 'true'; } catch(e){}

  if (!unlocked){
    document.getElementById('locked').style.display = 'block';
    return;
  }
  document.getElementById('content').style.display = 'block';

  // ---- edit this to update the episode ----
  // `art` is a path or URL to a cover image; leave it empty to show a placeholder icon.
  // `src` can be a relative path to a file you commit to the repo (e.g. "podcasts/ep01.mp3"),
  // or any publicly reachable audio URL — the <audio> tag just needs a direct link to the
  // file itself, not a page.
  var EPISODES = [
    {
      title: 'Episode 1',
      meta: 'placeholder — replace with date / guest / runtime',
      art: '',
      src: 'podcasts/episode-01.mp3'
    }
  ];

  var list = document.getElementById('episodeList');
  EPISODES.forEach(function(ep){
    var card = document.createElement('div');
    card.className = 'episode';

    var art = document.createElement('div');
    art.className = 'episode-art';
    if (ep.art){
      var img = document.createElement('img');
      img.src = ep.art;
      img.alt = ep.title;
      art.appendChild(img);
    } else {
      var ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.textContent = '🎙️';
      art.appendChild(ph);
    }
    card.appendChild(art);

    var h2 = document.createElement('h2');
    h2.textContent = ep.title;
    card.appendChild(h2);

    if (ep.meta){
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = ep.meta;
      card.appendChild(meta);
    }

    var audio = document.createElement('audio');
    audio.controls = true;
    audio.preload = 'none';
    var src = document.createElement('source');
    src.src = ep.src;
    audio.appendChild(src);
    audio.appendChild(document.createTextNode('Your browser does not support the audio element.'));
    card.appendChild(audio);

    list.appendChild(card);
  });
})();
</script>
</body>
</html>
