<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bibliothèque</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --kraft:#CDB592; --kraft-2:#BFA47D; --paper:#F0E6D2; --ink:#2A2238; --ink-soft:#5E5064;
  --new:#1F7A73; --reading:#C0262D; --line:rgba(42,34,56,.18); --readc:#A3919F;
  --black:'UnifrakturMaguntia','Old English Text MT',Georgia,serif;
  --body:'Spectral',Georgia,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --kraft:#2B251E; --kraft-2:#362E25; --paper:#40362B; --ink:#EDE0CA; --ink-soft:#C2B29A;
    --new:#3CA99F; --reading:#E2484F; --line:rgba(237,224,202,.16); --readc:#7A6A78;
  }
}
:root[data-theme="dark"]{
  --kraft:#2B251E; --kraft-2:#362E25; --paper:#40362B; --ink:#EDE0CA; --ink-soft:#C2B29A;
  --new:#3CA99F; --reading:#E2484F; --line:rgba(237,224,202,.16); --readc:#7A6A78;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55;
  background-color:var(--kraft);
  background-image:
    radial-gradient(ellipse at 18% 12%, rgba(255,255,255,.14), transparent 55%),
    radial-gradient(ellipse at 82% 68%, rgba(0,0,0,.10), transparent 60%),
    radial-gradient(ellipse at 45% 90%, rgba(255,255,255,.08), transparent 50%);
  background-attachment:fixed;
}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header h1{font-family:var(--black);font-weight:400;font-size:clamp(2.6rem,7vw,4.4rem);line-height:1;margin:0 0 10px;color:var(--ink)}
.ledger{margin:0;color:var(--ink-soft);max-width:62ch}
.ledger b{color:var(--ink);font-weight:600}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:26px 0 22px;border-bottom:1px solid var(--line)}
nav button{font:inherit;font-size:1rem;background:none;border:0;color:var(--ink-soft);padding:8px 14px 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--new);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{font:inherit;font-size:.92rem;border:0;background:none;color:var(--ink-soft);padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
select,input[type=search],input[type=text],input[type=number]{font:inherit;font-size:.95rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
input[type=search]{min-width:220px}
.legend{display:flex;gap:16px;font-size:.88rem;color:var(--ink-soft);margin-left:auto}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border:3px solid var(--c);margin-right:6px;vertical-align:-1px}

/* Wall */
.shelf{display:grid;grid-template-columns:70px 1fr;gap:6px 18px;margin-bottom:34px}
.shelf h2{grid-row:1 / span 2;font-family:var(--black);font-weight:400;font-size:2.4rem;line-height:1;margin:0;writing-mode:vertical-rl;transform:rotate(180deg);justify-self:center;align-self:start;color:var(--ink)}
.shelf .count{grid-column:2;grid-row:1;font-size:.85rem;color:var(--ink-soft);margin:-4px 0 4px}
.covers{grid-column:2;grid-row:2;display:flex;flex-wrap:wrap;gap:12px}
.cover{
  width:92px;height:136px;padding:9px 8px;border-radius:2px;cursor:pointer;border:0;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;color:#F6EEDD;
  font:inherit;box-shadow:2px 3px 0 rgba(0,0,0,.18);position:relative;overflow:hidden;
  outline:4px solid transparent;outline-offset:0;
}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.22) 0,rgba(0,0,0,0) 9px);pointer-events:none}
.cover .t{font-size:.78rem;line-height:1.2;font-weight:600;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cover .a{font-size:.66rem;font-style:italic;opacity:.85;line-height:1.2}
.cover.new{outline-color:var(--new)}
.cover.reading{outline-color:var(--reading)}
.cover.read{opacity:.55}
.cover:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:no-preference){.cover{transition:transform .15s}}
.empty{color:var(--ink-soft);font-style:italic}

/* Library table */
.tablewrap{overflow-x:auto;background:var(--paper);border-radius:4px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:760px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;cursor:pointer;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr{cursor:pointer}
tbody tr:hover{background:rgba(0,0,0,.04)}
.pill{display:inline-block;font-size:.8rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.pill.reading{border-color:var(--reading);color:var(--reading)}
.pill.read{opacity:.7}

/* Panels */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:22px 24px;margin-bottom:28px}
.panel h2{font-family:var(--black);font-weight:400;font-size:2.3rem;margin:0 0 2px;line-height:1.1}
.panel .sub{color:var(--ink-soft);margin:0 0 16px}
.room{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(150px,1.2fr) minmax(200px,2fr) auto;gap:8px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.room .name{font-weight:600}
.room .prompt{color:var(--ink-soft);font-style:italic}
.room input[type=text]{width:100%}
.room label{display:flex;gap:6px;align-items:center;font-size:.9rem;white-space:nowrap}
.room.done .name{text-decoration:line-through;text-decoration-color:var(--new);text-decoration-thickness:2px}
.addroom{margin-top:12px}
.btn{font:inherit;font-size:.92rem;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}

/* Goal */
.scale{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center;margin:18px 0 8px}
.bar{height:14px;background:rgba(0,0,0,.08);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.bar.b i{background:var(--ink-soft)}
.bar.r i{background:var(--new)}
.big{font-size:1.25rem;margin:10px 0 6px}
.big b{font-weight:600}
.plan{list-style:none;padding:0;margin:14px 0 0;columns:2 280px;column-gap:28px}
.plan li{break-inside:avoid;padding:5px 0;border-bottom:1px dashed var(--line)}
.plan label{display:flex;gap:10px;align-items:baseline;cursor:pointer}
.plan .note{font-size:.82rem;color:var(--ink-soft)}
.plan li.done span.title{text-decoration:line-through;text-decoration-color:var(--new)}
.nums{display:flex;flex-wrap:wrap;gap:18px;font-size:.92rem;color:var(--ink-soft)}
.nums input{width:80px}

/* Dialog */
dialog{border:0;border-radius:6px;padding:0;max-width:440px;width:calc(100% - 32px);background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,14,24,.45)}
.dlg{padding:24px 24px 20px}
.dlg h3{margin:0 0 2px;font-size:1.45rem;line-height:1.25}
.dlg .by{margin:0 0 16px;color:var(--ink-soft);font-style:italic}
.dlg dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0 0 18px;font-size:.95rem}
.dlg dt{color:var(--ink-soft)}
.dlg dd{margin:0}
.dlg .actions{display:flex;flex-wrap:wrap;gap:8px}
.foot{margin-top:40px;font-size:.85rem;color:var(--ink-soft);max-width:70ch}
.hidden{display:none!important}

@media (max-width:720px){
  .shelf{grid-template-columns:1fr}
  .shelf h2{grid-row:auto;writing-mode:horizontal-tb;transform:none;justify-self:start;font-size:2rem}
  .shelf .count,.covers{grid-column:1;grid-row:auto}
  .legend{margin-left:0}
  .room{grid-template-columns:1fr}
  .cover{width:84px;height:124px}
}

.chart{width:100%;max-width:720px;height:auto;display:block;margin:10px 0 4px}
.chart text{fill:var(--ink-soft);font-family:var(--body);font-size:12px}
.key{display:flex;gap:18px;font-size:.88rem;color:var(--ink-soft)}
.key span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:-1px}
.months{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px;margin-top:14px}
.months th,.months td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;cursor:default}
.months th:first-child,.months td:first-child{text-align:left}
.acq{columns:2 300px;column-gap:28px;padding:0;margin:8px 0 0;list-style:none;font-size:.93rem}
.acq li{break-inside:avoid;padding:3px 0}
.acq h4{margin:12px 0 4px;font-size:1rem}
.acq .src{font-size:.8rem;color:var(--ink-soft);font-style:italic}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.simple{list-style:none;padding:0;margin:8px 0 0}
.simple li{padding:5px 0;border-bottom:1px dashed var(--line)}
.simple small{color:var(--ink-soft)}

.manor{--m-bg:#1C1E19;--m-ink:#E8E1C8;--m-soft:#A9A58F;--m-line:rgba(232,225,200,.22);--m-red:#B8322F;--m-green:#6FA46A;
  background:var(--m-bg);color:var(--m-ink);border-radius:4px;padding:26px 24px 22px;margin-bottom:28px;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(120,140,110,.18),transparent 60%),radial-gradient(ellipse at 90% 100%,rgba(0,0,0,.4),transparent 60%)}
.manor h2{font-family:var(--black);font-weight:400;font-size:2.6rem;margin:0;line-height:1.05}
.manor h3{font-family:var(--black);font-weight:400;font-size:1.6rem;margin:22px 0 10px}
.manor .msub,.manor .vhint{color:var(--m-soft);margin:4px 0 0}
.manor .vhint{font-size:.85rem;margin-top:10px}
.vpile{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 14px}
.vcell{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.vslot{width:84px;height:122px;border-radius:5px;border:1px dashed var(--m-line);background:rgba(232,225,200,.05)}
.vslot.filled{border:0;padding:7px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#F6EEDD;box-shadow:2px 3px 0 rgba(0,0,0,.35)}
.vslot .t{font-size:.7rem;line-height:1.2;font-weight:600;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.vslot .a{font-size:.6rem;font-style:italic;opacity:.85}
.vcell.done .vslot{outline:3px solid var(--m-green)}
.vlabel{font-size:.8rem;color:var(--m-soft);line-height:1.2}
.vtable{background:none;border-color:var(--m-line)}
.vtable table{min-width:680px}
.vtable th{color:var(--m-ink);font-family:var(--black);font-weight:400;font-size:1.05rem;cursor:default}
.vtable th,.vtable td{border-bottom-color:var(--m-line);cursor:default}
.vtable tr{cursor:default}
.vtable tbody tr:hover{background:rgba(232,225,200,.04)}
.vtable input[type=text]{background:rgba(232,225,200,.07);color:var(--m-ink);border-color:var(--m-line);width:100%}
.vtable .vnum input{width:3.2em;text-align:center;font-style:italic}
.vname{font-weight:600}.vprompt{font-size:.85rem;color:var(--m-soft);font-style:italic}
.vtable tr.locked .vname{color:var(--m-soft)}
.vtable tr.done .vname{text-decoration:line-through;text-decoration-color:var(--m-green);text-decoration-thickness:2px}
.manor label{display:flex;gap:6px;align-items:center;font-size:.9rem;white-space:nowrap}
.manor .addroom input{background:rgba(232,225,200,.07);color:var(--m-ink);border-color:var(--m-line)}
.manor .vbtn{color:var(--m-ink);border-color:var(--m-line)}
.langseg button{display:inline-flex;align-items:center}
.langseg svg{width:24px;height:16px;display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.langseg:has([aria-pressed="true"]) button[aria-pressed="false"] svg{opacity:.55}
.formseg button{display:inline-flex;align-items:center;gap:6px}
.formseg svg{width:17px;height:17px}
.ledger{max-width:none}
.shelfbar{width:100%;height:64px;display:block;margin:14px 0 8px}
.shelfkey{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.95rem;color:var(--ink-soft)}
.shelfkey b{color:var(--ink);font-weight:600}
.shelfkey .k::before{content:"";display:inline-block;width:5px;height:14px;margin-right:7px;vertical-align:-2px;background:var(--c)}
.shelfkey .r{--c:var(--ink-soft)}.shelfkey .g{--c:var(--reading)}.shelfkey .t{--c:var(--ink)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px}
header h1{margin:0}
.ledger{display:flex;align-items:center;gap:20px;margin-right:clamp(0px,12vw,180px)}
.pie{width:120px;height:120px;flex:none}
.piekey{display:flex;flex-direction:column;gap:3px;font-size:.95rem;color:var(--ink-soft)}
.piekey b{color:var(--ink);font-weight:600}
.piekey small{font-size:.8rem;margin-left:4px}
.piekey .tot{margin-bottom:2px}
.piekey .k::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:-1px;background:var(--c)}
@media (max-width:720px){.ledger{margin-right:0}}

.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ticons{display:flex;gap:4px;flex:none;margin:-6px -8px 0 0}
.icon{background:none;border:0;color:var(--ink-soft);width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.icon:hover{background:rgba(0,0,0,.08);color:var(--ink)}
.icon svg{width:18px;height:18px}
.dlg .actions.status2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{font:inherit;font-size:.95rem;padding:9px 12px;border-radius:6px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.tog[aria-pressed="true"]{background:var(--new);border-color:var(--new);color:#fff}
.tog.r[aria-pressed="true"]{background:var(--reading);border-color:var(--reading)}
.editf{display:grid;gap:10px;margin:0 0 18px}
.editf label{display:grid;gap:3px;font-size:.85rem;color:var(--ink-soft)}
.editf input,.editf select{font:inherit;font-size:.95rem;color:var(--ink);background:var(--kraft);border:1px solid var(--line);border-radius:6px;padding:6px 9px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.track{display:flex;gap:4px;margin:-6px 0 18px}
.track span{flex:1;height:8px;border-radius:999px;background:rgba(0,0,0,.1)}
.track span.on{background:var(--new)}

/* local version additions */
.addbook{margin-left:auto}
.cover.img{padding:0;background:#222}
.cover.img img{width:100%;height:100%;object-fit:cover;display:block}
.cover.img .t,.cover.img .a{display:none}
.dcover{width:86px;height:126px;object-fit:cover;border-radius:3px;float:right;margin:0 0 10px 14px;box-shadow:2px 3px 0 rgba(0,0,0,.2)}
.foot code{font-size:.9em}
#saveState{font-style:italic}
.danger{color:var(--reading);border-color:var(--reading)}
.errorbox{background:var(--paper);border:2px solid var(--reading);padding:18px 20px;border-radius:6px}

.startp{max-width:600px;margin:10vh auto 0}
.startp p{margin:0 0 16px}
#start{padding:28px 20px}

body.shared #addBook, body.shared [data-act=edit], body.shared .status2, body.shared .addroom, body.shared .foot, body.shared .nums label{display:none!important}
body.shared input[data-c], body.shared input[data-plan], body.shared input[data-goal]{pointer-events:none}
</style>
</head>
<body>
<div id="start"></div>
<div class="wrap hidden" id="app">
  <header>
    <h1>Bibliothèque</h1>
    <div class="ledger" id="ledger"></div>
  </header>

  <nav role="tablist" aria-label="Sections">
    <button role="tab" data-view="wall" aria-selected="true">Cover wall</button>
    <button role="tab" data-view="library" aria-selected="false">Library</button>
    <button role="tab" data-view="challenges" aria-selected="false">Challenges</button>
    <button role="tab" data-view="goal" aria-selected="false">2026</button>
  </nav>

  <div class="controls" id="filters">
    <div class="seg" role="group" aria-label="Status">
      <button data-status="unread" aria-pressed="true">To read</button>
      <button data-status="reading" aria-pressed="false">Reading</button>
      <button data-status="read" aria-pressed="false">Read</button>
    </div>
    <input type="search" id="q" placeholder="Search title, author, series" aria-label="Search">
    <div class="seg langseg" role="group" aria-label="Language">
      <button data-lang="French" aria-pressed="false" aria-label="French" title="French"><svg viewBox="0 0 30 20" aria-hidden="true"><rect width="10" height="20" fill="#0055A4"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#EF4135"/></svg></button>
      <button data-lang="English" aria-pressed="false" aria-label="English" title="English"><svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="ukc"><rect width="60" height="30"/></clipPath><g clip-path="url(#ukc)"><rect width="60" height="30" fill="#012169"/><path d="M0,0 60,30M60,0 0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 60,30M60,0 0,30" stroke="#C8102E" stroke-width="2.4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></g></svg></button>
    </div>
    <div class="seg formseg" role="group" aria-label="Format">
      <button data-form="prose" aria-pressed="false" title="Novels and non-fiction"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5C5.5 4 8.5 4 12 6c3.5-2 6.5-2 9-.5V19c-2.5-1.5-5.5-1.5-9 .5-3.5-2-6.5-2-9-.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 6v13.5" stroke="currentColor" stroke-width="1.8"/></svg><span>Prose</span></button>
      <button data-form="graphic" aria-pressed="false" title="Manga, comics and graphic novels"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="3" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13" width="18" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Graphic</span></button>
    </div>
    <select id="loc" aria-label="Location"></select>
    <select id="genre" aria-label="Genre"></select>
    <button class="btn addbook" id="addBook">+ Add a book</button>
    <div class="legend"><span style="--c:var(--new)">Acquired this year</span><span style="--c:var(--reading)">Reading now</span></div>
  </div>

  <section id="v-wall"></section>
  <section id="v-library" class="hidden"><div class="tablewrap"><table><thead><tr>
    <th data-sort="title">Title</th><th data-sort="author">Author</th><th data-sort="genre">Genre</th><th data-sort="owned">Where</th><th data-sort="lang">Language</th><th data-sort="pages" class="num">Pages</th><th>Status</th>
  </tr></thead><tbody id="tbody"></tbody></table></div></section>
  <section id="v-challenges" class="hidden"></section>
  <section id="v-goal" class="hidden"></section>

  <p class="foot">Your library lives in the <code>data</code> folder next to this page. Every change is saved there automatically. <span id="saveState"></span></p>
</div>


<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<datalist id="titles"></datalist>
<script>
/* Bibliothèque, local version.
   The page reads and writes the JSON files in the library folder you open (Chrome or Edge). */
(function () {
'use strict';

let books = [], challenges = [], goal = {}, year = {};
let byTitle = new Map();
const THIS_YEAR = new Date().getFullYear() === 2026 ? 2026 : new Date().getFullYear();

const GENRE_ORDER = ['Fantasy','Science Fiction','Fiction','Thriller/Polar','Classic','Mythology','History','Society','Philosophy','Science','Children','Graphic','Other'];
const GENRES = GENRE_ORDER.filter(g => g !== 'Graphic' && g !== 'Other');
const FORMATS = ['Fiction','Non-Fiction','Graphic'];
const GENRE_COL = {'Fantasy':[268,30],'Science Fiction':[200,36],'Fiction':[18,36],'Thriller/Polar':[0,8],'Classic':[82,26],'Mythology':[160,30],'History':[355,38],'Society':[32,48],'Philosophy':[245,16],'Science':[190,30],'Children':[38,56],'Other':[30,10]};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const slug = s => norm(s).replace(/[’']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 90) || 'book';
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const today = () => new Date().toISOString().slice(0, 10);

const isRead = b => !!b.read;
const isReading = b => !!b.reading && !b.read;
const isGraphic = b => b.format === 'Graphic';

/* ---------- loading & saving: the page reads and writes the JSON files in your library folder ---------- */
const FILES = {books: 'books.json', challenges: 'challenges.json', goal: 'goal.json', year: 'year-2026.json'};
let dirHandle = null, dataDir = null, coversDir = null, readOnly = false;
let coverURL = new Map();          // file name -> object URL

// remember the folder between visits (IndexedDB)
const idb = (mode, fn) => new Promise((res, rej) => {
  const open = indexedDB.open('bibliotheque', 1);
  open.onupgradeneeded = () => open.result.createObjectStore('kv');
  open.onsuccess = () => { const tx = open.result.transaction('kv', mode); const st = tx.objectStore('kv'); const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); };
  open.onerror = () => rej(open.error);
});
const rememberFolder = h => idb('readwrite', st => st.put(h, 'dir')).catch(() => {});
const recallFolder = () => idb('readonly', st => st.get('dir')).catch(() => null);

function startScreen(msg) {
  const canWrite = 'showDirectoryPicker' in window;
  $('#start').innerHTML = `<div class="panel startp"><h2>Open your library</h2>
    <p>${msg || 'Choose the <b>bibliotheque</b> folder (the one containing <code>index.html</code>, <code>data</code> and <code>covers</code>). Your browser will ask to let this page edit the files in it.'}</p>
    ${canWrite ? '<button class="btn" id="pick">Choose the library folder</button>'
      : `<p><b>This browser can't save to files.</b> Open this page in Chrome or Edge to edit your library. You can still browse it here: choose the folder below (read-only).</p>
         <input type="file" id="pickRO" webkitdirectory multiple>`}
  </div>`;
  $('#start').classList.remove('hidden'); $('#app').classList.add('hidden');
  const pick = $('#pick');
  if (pick) pick.onclick = async () => {
    try { const h = await window.showDirectoryPicker({id: 'bibliotheque', mode: 'readwrite'}); await rememberFolder(h); await openFolder(h); }
    catch (e) { if (e.name !== 'AbortError') startScreen('That folder could not be opened. Pick the <b>bibliotheque</b> folder that contains <code>data</code>.'); }
  };
  const ro = $('#pickRO');
  if (ro) ro.onchange = () => loadReadOnly([...ro.files]);
}

let shared = false;
async function tryShared() {
  // When the folder is put online (Netlify Drop, GitHub Pages…), load the JSON files directly: view-only for visitors.
  if (!/^https?:$/.test(location.protocol)) return false;
  try {
    const get = async n => { const r = await fetch('data/' + n, {cache: 'no-store'}); return r.ok ? r.json() : null; };
    const b = await get(FILES.books); if (!b) return false;
    const [c, g, y] = await Promise.all([get(FILES.challenges), get(FILES.goal), get(FILES.year)]);
    books = b; challenges = c || []; goal = g || null; year = y || null;
    readOnly = true; shared = true;
    document.body.classList.add('shared');
    launch(); return true;
  } catch (e) { return false; }
}
async function boot() {
  if (await tryShared()) return;
  if ('showDirectoryPicker' in window) {
    const h = await recallFolder();
    if (h) {
      const perm = await h.queryPermission({mode: 'readwrite'});
      if (perm === 'granted') return openFolder(h);
      $('#start').innerHTML = `<div class="panel startp"><h2>Welcome back</h2><p>Click to reopen <b>${esc(h.name)}</b>. Your browser asks for permission again each time you open the page.</p>
        <button class="btn" id="reopen">Open my library</button> <button class="btn ghost" id="other">Choose another folder</button></div>`;
      $('#reopen').onclick = async () => { if (await h.requestPermission({mode: 'readwrite'}) === 'granted') openFolder(h); };
      $('#other').onclick = () => startScreen();
      return;
    }
  }
  startScreen();
}

async function readJSON(dir, name) {
  try { const f = await (await dir.getFileHandle(name)).getFile(); return JSON.parse(await f.text()); }
  catch (e) { if (e.name === 'NotFoundError') return null; throw e; }
}

async function openFolder(h) {
  try {
    dirHandle = h;
    dataDir = await h.getDirectoryHandle('data');
    coversDir = await h.getDirectoryHandle('covers', {create: true});
    const [b, c, g, y] = await Promise.all(Object.values(FILES).map(n => readJSON(dataDir, n)));
    books = b || []; challenges = c || []; goal = g || {read_before_plan: 0, plan: []}; year = y || {months: []};
    coverURL = new Map();
    for await (const [name, fh] of coversDir.entries()) {
      if (fh.kind === 'file' && /\.(jpe?g|png|webp|gif)$/i.test(name)) coverURL.set(name, URL.createObjectURL(await fh.getFile()));
    }
  } catch (e) {
    startScreen(`Couldn't read the library in <b>${esc(h.name)}</b> (${esc(e.message)}). Make sure you picked the folder that contains <code>data</code>.`);
    return;
  }
  launch();
}

function loadReadOnly(files) {
  readOnly = true;
  const find = n => files.find(f => f.webkitRelativePath.split('/').slice(-2).join('/') === 'data/' + n);
  Promise.all(Object.values(FILES).map(n => find(n) ? find(n).text().then(JSON.parse) : null)).then(([b, c, g, y]) => {
    if (!b) { startScreen('No <code>data/books.json</code> found in that folder.'); return; }
    books = b; challenges = c || []; goal = g || {read_before_plan: 0, plan: []}; year = y || {months: []};
    files.filter(f => /\/covers\/[^/]+\.(jpe?g|png|webp|gif)$/i.test(f.webkitRelativePath)).forEach(f => coverURL.set(f.name, URL.createObjectURL(f)));
    launch();
  });
}

let launched = false;
function launch() {
  $('#start').classList.add('hidden'); $('#app').classList.remove('hidden');
  reindex();
  if (!goal) { goal = {read_before_plan: 0, plan: []}; document.querySelector('nav button[data-view=goal]').style.display = 'none'; }
  if (!year) year = {months: []};
  if (!launched) { initControls(); launched = true; }
  renderAll();
  const st = $('#saveState');
  if (st) st.textContent = shared ? '' : readOnly ? 'Read-only in this browser: open the page in Chrome or Edge to save changes.' : `Saving to the “${dirHandle.name}” folder.`;
}
function reindex() { byTitle = new Map(books.map(b => [b.title, b])); }

async function writeFile(dir, name, text) {
  const w = await (await dir.getFileHandle(name, {create: true})).createWritable();
  await w.write(text); await w.close();
}
async function dailyBackup() {
  const day = new Date().toISOString().slice(0, 10);
  const backups = await dataDir.getDirectoryHandle('backups', {create: true});
  try { await backups.getDirectoryHandle(day); return; } catch (e) {}
  const d = await backups.getDirectoryHandle(day, {create: true});
  for (const n of Object.values(FILES)) {
    try { const f = await (await dataDir.getFileHandle(n)).getFile(); await writeFile(d, n, await f.text()); } catch (e) {}
  }
}

let saveTimer = null;
function save() {
  const st = $('#saveState');
  if (readOnly) { if (st) st.textContent = 'Read-only: this change will not be saved. Use Chrome or Edge to edit.'; return; }
  if (st) st.textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await dailyBackup();
      await writeFile(dataDir, FILES.books, JSON.stringify(books, null, 1));
      await writeFile(dataDir, FILES.challenges, JSON.stringify(challenges, null, 1));
      await writeFile(dataDir, FILES.goal, JSON.stringify(goal, null, 1));
      if (st) st.textContent = 'All changes saved.';
    } catch (e) {
      if (st) st.textContent = 'Could not save (' + e.message + '). Reload the page and reopen the folder.';
    }
  }, 400);
}

/* ---------- covers ---------- */
function coverFile(b) {
  if (b.cover && /^https?:\/\//i.test(b.cover)) return b.cover;
  if (b.cover && coverURL.has(b.cover)) return coverURL.get(b.cover);
  const s = slug(b.title);
  for (const ext of ['.jpg', '.jpeg', '.png', '.webp']) if (coverURL.has(s + ext)) return coverURL.get(s + ext);
  return null;
}
function coverBg(b) {
  const [h, s] = GENRE_COL[b.genre] || GENRE_COL.Other;
  const k = hash(b.title);
  return `hsl(${h + ((k >> 4) % 16 - 8)} ${s}% ${24 + (k % 14)}%)`;
}

/* ---------- filters ---------- */
const F = {status: 'unread', loc: 'St Gallen', genre: '', lang: '', form: 'all', q: '', view: 'wall', sort: ['title', 1]};

function filtered() {
  const q = norm(F.q);
  return books.filter(b => {
    if (F.status === 'unread' && isRead(b)) return false;
    if (F.status === 'read' && !isRead(b)) return false;
    if (F.status === 'reading' && !isReading(b)) return false;
    if (F.loc && b.owned !== F.loc) return false;
    if (F.genre && b.genre !== F.genre) return false;
    if (F.lang && b.lang !== F.lang) return false;
    if (F.form === 'graphic' && !isGraphic(b)) return false;
    if (F.form === 'prose' && isGraphic(b)) return false;
    if (q && !norm(b.title + ' ' + b.author + ' ' + b.series).includes(q)) return false;
    return true;
  });
}
const locations = () => {
  const count = {};
  books.forEach(b => { if (b.owned) count[b.owned] = (count[b.owned] || 0) + 1; });
  return Object.keys(count).sort((a, b) => count[b] - count[a]);
};

function initControls() {
  const locSel = $('#loc');
  const fillLoc = () => { locSel.innerHTML = '<option value="">All places</option>' + locations().map(l => `<option ${l === F.loc ? 'selected' : ''}>${esc(l)}</option>`).join(''); };
  fillLoc();
  locSel.addEventListener('change', e => { F.loc = e.target.value; renderAll(); });
  const gSel = $('#genre');
  gSel.innerHTML = '<option value="">All genres</option>' + GENRES.map(g => `<option>${esc(g)}</option>`).join('');
  gSel.addEventListener('change', e => { F.genre = e.target.value; renderAll(); });
  $('#q').addEventListener('input', e => { F.q = e.target.value; renderAll(); });

  const toggleSeg = (sel, key, none) => document.querySelectorAll(sel + ' button').forEach(btn => btn.addEventListener('click', () => {
    const on = btn.getAttribute('aria-pressed') !== 'true';
    document.querySelectorAll(sel + ' button').forEach(b => b.setAttribute('aria-pressed', on && b === btn));
    F[key] = on ? btn.dataset[key] : none;
    renderAll();
  }));
  toggleSeg('.seg:not(.langseg):not(.formseg)', 'status', 'all');
  toggleSeg('.langseg', 'lang', '');
  toggleSeg('.formseg', 'form', 'all');

  document.querySelectorAll('nav button').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b === btn));
    F.view = btn.dataset.view; renderAll();
  }));
  document.querySelectorAll('th[data-sort]').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.sort; F.sort = [k, F.sort[0] === k ? -F.sort[1] : 1]; renderLibrary();
  }));
  $('#addBook').addEventListener('click', () => openBook(null, true));
  initDialog(fillLoc);
  initChallengeEvents();
}

/* ---------- header pie ---------- */
function ledger() {
  const read = books.filter(isRead).length, reading = books.filter(isReading).length, toread = books.length - read - reading;
  const parts = [[read, 'var(--readc)', 'read'], [reading, 'var(--reading)', 'reading now'], [toread, 'var(--ink)', 'to read']];
  const R = 50, C = 60; let a = -Math.PI / 2, slices = '';
  parts.forEach(([v, c, l]) => {
    if (!v || !books.length) return;
    const f = v / books.length, a2 = a + f * 2 * Math.PI;
    const x1 = C + R * Math.cos(a), y1 = C + R * Math.sin(a), x2 = C + R * Math.cos(a2), y2 = C + R * Math.sin(a2);
    const d = f >= 1 ? `M${C - R},${C}a${R},${R} 0 1,0 ${2 * R},0a${R},${R} 0 1,0 ${-2 * R},0`
      : `M${C},${C}L${x1.toFixed(2)},${y1.toFixed(2)}A${R},${R} 0 ${f > .5 ? 1 : 0},1 ${x2.toFixed(2)},${y2.toFixed(2)}Z`;
    slices += `<path d="${d}" fill="${c}" stroke="var(--kraft)" stroke-width="1.5"><title>${v} ${l}</title></path>`;
    a = a2;
  });
  const pct = v => books.length ? Math.round(v / books.length * 100) : 0;
  $('#ledger').innerHTML = `<svg class="pie" viewBox="0 0 120 120" role="img" aria-label="${books.length} books: ${read} read, ${reading} reading now, ${toread} to read">${slices}</svg>
    <div class="piekey"><span class="tot"><b>${books.length}</b> books</span>
    ${parts.map(([v, c, l]) => `<span class="k" style="--c:${c}"><b>${v}</b> ${l} <small>${pct(v)}%</small></span>`).join('')}</div>`;
}

/* ---------- cover wall ---------- */
/* Sort authors by surname: "Fonda Lee" -> "Lee Fonda"; first author only; "Collectif" stays as is */
function authorKey(s) {
  const first = String(s || '').split(/\s+(?:et|and|&)\s+|,|\/| - /)[0].trim();
  const w = first.split(/\s+/);
  return w.length > 1 ? w[w.length - 1] + ' ' + w.slice(0, -1).join(' ') : first;
}

function renderWall() {
  const list = filtered(), el = $('#v-wall');
  if (!list.length) { el.innerHTML = '<p class="empty">No books match these filters. Try another place or status.</p>'; return; }
  const groups = {};
  list.forEach(b => (groups[isGraphic(b) ? 'Graphic' : (b.genre || 'Other')] ??= []).push(b));
  const order = GENRE_ORDER.filter(g => groups[g]).concat(Object.keys(groups).filter(g => !GENRE_ORDER.includes(g)));
  el.innerHTML = order.map(g => {
    const cmp = (x, y) => String(x || '').localeCompare(String(y || ''), 'fr', {numeric: true, sensitivity: 'base'});
    const items = groups[g].sort((a, b) => cmp(authorKey(a.author), authorKey(b.author)) || cmp(a.author, b.author)
      || cmp(a.series || a.title, b.series || b.title) || cmp(a.title, b.title));
    return `<div class="shelf"><h2>${esc(g === 'Science Fiction' ? 'SF' : g === 'Thriller/Polar' ? 'Thriller' : g)}</h2>
      <div class="count">${items.length} ${items.length === 1 ? 'book' : 'books'}</div>
      <div class="covers">${items.map(b => {
        const cls = ['cover'];
        if (isReading(b)) cls.push('reading'); else if (b.year === THIS_YEAR) cls.push('new');
        if (isRead(b) && F.status === 'all') cls.push('read');
        const img = coverFile(b);
        if (img) cls.push('img');
        return `<button class="${cls.join(' ')}" data-id="${b.id}" style="background:${coverBg(b)}" aria-label="${esc(b.title)} by ${esc(b.author)}">${img ? `<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('img');this.remove()">` : ''}<span class="t">${esc(b.title)}</span><span class="a">${esc(b.author)}</span></button>`;
      }).join('')}</div></div>`;
  }).join('');
}

/* ---------- library table ---------- */
function renderLibrary() {
  const [key, dir] = F.sort;
  const list = filtered().sort((a, b) => {
    const x = a[key], y = b[key];
    if (x == null && y == null) return 0; if (x == null || x === '') return 1; if (y == null || y === '') return -1;
    return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'fr', {numeric: true})) * dir;
  });
  $('#tbody').innerHTML = list.map(b => {
    const st = isReading(b) ? '<span class="pill reading">Reading</span>' : isRead(b) ? '<span class="pill read">Read</span>' : '<span class="pill">To read</span>';
    return `<tr data-id="${b.id}"><td>${esc(b.title)}${b.series ? `<br><small style="color:var(--ink-soft)">${esc(b.series)}</small>` : ''}</td><td>${esc(b.author)}</td><td>${esc(b.genre)}</td><td>${esc(b.owned)}</td><td>${esc(b.lang)}</td><td class="num">${b.pages ?? ''}</td><td>${st}</td></tr>`;
  }).join('') || '<tr><td colspan="7" class="empty">No books match these filters.</td></tr>';
}

/* ---------- challenges ---------- */
function miniCover(title) {
  const b = byTitle.get(title);
  if (!title) return '<div class="vslot"></div>';
  if (!b) return `<div class="vslot filled" style="background:hsl(${hash(title) % 360} 20% 30%)"><span class="t">${esc(title)}</span></div>`;
  const img = coverFile(b);
  if (img) return `<div class="vslot filled" style="padding:0;overflow:hidden"><img src="${esc(img)}" referrerpolicy="no-referrer" onerror="this.remove()" alt="${esc(b.title)}" style="width:100%;height:100%;object-fit:cover"></div>`;
  return `<div class="vslot filled" style="background:${coverBg(b)}"><span class="t">${esc(b.title)}</span><span class="a">${esc(b.author)}</span></div>`;
}
function renderManor(c, ci) {
  const opened = c.rooms.filter(r => r.num), locked = c.rooms.filter(r => !r.num);
  const done = c.rooms.filter(r => r.done).length;
  const idx = r => c.rooms.indexOf(r);
  const row = r => { const ri = idx(r); return `<tr class="${r.done ? 'done' : ''} ${r.num ? '' : 'locked'}">
    <td class="vnum"><input type="text" inputmode="numeric" value="${esc(r.num)}" placeholder="🔒" data-c="${ci}" data-r="${ri}" data-k="num" aria-label="Numéro de ${esc(r.name)}"></td>
    <td><span class="vname">${esc(r.name)}</span><br><span class="vprompt">${esc(r.prompt)}</span></td>
    <td><input type="text" list="titles" value="${esc(r.book)}" placeholder="Choisir un livre" data-c="${ci}" data-r="${ri}" data-k="book" aria-label="Livre pour ${esc(r.name)}"></td>
    <td><input type="text" value="${esc(r.riddle || '')}" placeholder="Solution" data-c="${ci}" data-r="${ri}" data-k="riddle" aria-label="Solution de l’énigme, ${esc(r.name)}"></td>
    <td><label><input type="checkbox" ${r.done ? 'checked' : ''} data-c="${ci}" data-r="${ri}" data-k="done"> Lu</label></td></tr>`; };
  const byNum = [...opened].sort((a, b) => (parseInt(a.num) || 0) - (parseInt(b.num) || 0));
  return `<div class="manor"><h2>${esc(c.name)}</h2><p class="msub">${esc(c.sub)}. ${done} ${done === 1 ? 'pièce terminée' : 'pièces terminées'}, ${opened.length} ouvertes sur ${c.total_rooms || c.rooms.length}.</p>
    <h3>Pile à lire</h3>
    <div class="vpile">${c.rooms.filter(r => r.name !== 'Les Bains').map(r => `<div class="vcell ${r.done ? 'done' : ''}">${miniCover(r.book)}<span class="vlabel">${esc(r.name)}</span></div>`).join('')}</div>
    <h3>Feuille de route</h3>
    <div class="tablewrap vtable"><table><thead><tr><th>#</th><th>Pièce</th><th>Livre lu</th><th>Solution de l’énigme</th><th></th></tr></thead><tbody>
    ${byNum.map(row).join('')}${locked.map(row).join('')}</tbody></table></div>
    <p class="vhint">Tape le numéro d’une pièce quand elle s’ouvre sur le plan : elle remonte dans la feuille de route.</p>
    <div class="addroom room"><input type="text" placeholder="Nouvelle pièce" data-newname="${ci}" aria-label="Nouvelle pièce"><input type="text" placeholder="Consigne" data-newprompt="${ci}" aria-label="Consigne"><span></span><button class="btn ghost vbtn" data-add="${ci}">Ajouter la pièce</button></div>
  </div>`;
}
function renderPlain(c, ci) {
  const done = c.rooms.filter(r => r.done).length;
  return `<div class="panel"><h2>${esc(c.name)}</h2><p class="sub">${esc(c.sub)}. ${done} of ${c.rooms.length} done.</p>
    <div class="track" role="img" aria-label="${done} of ${c.rooms.length} done">${c.rooms.map(r => `<span class="${r.done ? 'on' : ''}" title="${esc(r.name)}"></span>`).join('')}</div>
    ${c.rooms.map((r, ri) => `<div class="room ${r.done ? 'done' : ''}">
      <span class="name">${esc(r.name)}</span><span class="prompt">${esc(r.prompt)}</span>
      <input type="text" list="titles" value="${esc(r.book)}" placeholder="Choose a book" data-c="${ci}" data-r="${ri}" data-k="book" aria-label="Book for ${esc(r.name)}">
      <label><input type="checkbox" ${r.done ? 'checked' : ''} data-c="${ci}" data-r="${ri}" data-k="done"> Done</label>
    </div>`).join('')}
    <div class="addroom room"><input type="text" placeholder="New subject" data-newname="${ci}" aria-label="New subject name"><input type="text" placeholder="Its prompt" data-newprompt="${ci}" aria-label="New subject prompt"><span></span><button class="btn ghost" data-add="${ci}">Add subject</button></div></div>`;
}
function renderChallenges() {
  $('#titles').innerHTML = books.filter(b => !b.read || b.date_finished).map(b => `<option value="${esc(b.title)}">`).join('');
  $('#v-challenges').innerHTML = challenges.map((c, ci) => c.style === 'manor' ? renderManor(c, ci) : renderPlain(c, ci)).join('');
}
function initChallengeEvents() {
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.newname != null || t.dataset.newprompt != null) return;
    if (t.dataset.c != null) {
      const r = challenges[+t.dataset.c].rooms[+t.dataset.r];
      const k = t.dataset.k;
      if (k === 'done') r.done = t.checked; else if (k === 'num') r.num = t.value.trim(); else r[k] = t.value;
      save(); renderChallenges(); return;
    }
    if (t.dataset.goal) { goal[t.dataset.goal] = Math.max(0, parseInt(t.value) || 0); save(); renderGoal(); return; }
    if (t.dataset.plan != null) {
      const b = byTitle.get(t.dataset.plan); if (!b) return;
      setRead(b, t.checked); save(); renderAll();
    }
  });
  document.addEventListener('click', e => {
    const add = e.target.closest('[data-add]');
    if (add) {
      const ci = +add.dataset.add;
      const name = (document.querySelector(`[data-newname="${ci}"]`).value || '').trim(); if (!name) return;
      const prompt = (document.querySelector(`[data-newprompt="${ci}"]`).value || '').trim();
      challenges[ci].rooms.push({name, prompt, book: '', done: false, num: '', riddle: ''});
      save(); renderChallenges(); return;
    }
    const c = e.target.closest('[data-id]');
    if (c && !$('#dlg').contains(c)) openBook(+c.dataset.id);
  });
}

/* ---------- 2026 goal & year ---------- */
function chartSVG() {
  const m = year.months || []; if (!m.length) return '';
  const W = 640, H = 210, pl = 26, pb = 26, pt = 10, max = Math.max(1, ...m.map(x => Math.max(x[1], x[2])));
  const top = Math.ceil(max / 4) * 4, gw = (W - pl) / m.length, bw = Math.min(18, gw / 3);
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Books bought and TBR books read, per month">`;
  for (let v = 0; v <= top; v += top / 4) s += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  m.forEach((r, i) => { const cx = pl + gw * i + gw / 2;
    s += `<rect x="${cx - bw - 1}" y="${y(r[1])}" width="${bw}" height="${y(0) - y(r[1])}" rx="2" fill="var(--ink-soft)"><title>${r[0]}: ${r[1]} new</title></rect>`;
    s += `<rect x="${cx + 1}" y="${y(r[2])}" width="${bw}" height="${y(0) - y(r[2])}" rx="2" fill="var(--new)"><title>${r[0]}: ${r[2]} TBR read</title></rect>`;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${r[0].slice(0, 3)}</text>`; });
  return s + '</svg>';
}
function renderGoal() {
  const plan = goal.plan || [];
  const planDone = plan.filter(p => { const b = byTitle.get(p.title); return b && b.read && b.date_finished; }).length;
  const thisYear = books.filter(b => b.year === THIS_YEAR);
  const bought = thisYear.filter(b => b.acquired_how === 'Bought new').length;
  const gifts = thisYear.filter(b => b.acquired_how === 'Gift').length;
  const second = thisYear.filter(b => b.acquired_how === 'Bought second-hand').length;
  const read = (goal.read_before_plan || 0) + planDone;
  const max = Math.max(read, bought, 1), gap = bought - read;
  const m = year.months || [], tot = i => m.reduce((a, r) => a + r[i], 0), spent = tot(5);
  $('#v-goal').innerHTML = `<div class="panel"><h2>Read what I buy</h2>
    <p class="sub">The goal for ${THIS_YEAR}: read at least as many books from the TBR as I bought this year.</p>
    <p class="big">${gap > 0 ? `<b>${gap}</b> more ${gap === 1 ? 'book' : 'books'} to break even.` : gap === 0 ? '<b>Even.</b> Every book bought this year is matched by one read.' : `<b>${-gap}</b> ahead. Nicely done.`}</p>
    <div class="scale"><span>Bought</span><div class="bar b"><i style="width:${bought / max * 100}%"></i></div><span>${bought}</span>
      <span>Read</span><div class="bar r"><i style="width:${read / max * 100}%"></i></div><span>${read}</span></div>
    <div class="nums"><span>Bought new this year: <b style="color:var(--ink)">${bought}</b>, counted from your books (${thisYear.length} acquired in ${THIS_YEAR}, including ${gifts} gifts and ${second} second-hand).</span>
      <label>Read before this plan <input type="number" min="0" value="${goal.read_before_plan || 0}" data-goal="read_before_plan"></label></div>
    <ul class="plan">${plan.map(p => { const b = byTitle.get(p.title); const d = b && b.read && b.date_finished;
      return `<li class="${d ? 'done' : ''}"><label><input type="checkbox" ${d ? 'checked' : ''} data-plan="${esc(p.title)}"><span><span class="title">${esc(p.title)}</span><br><span class="note">${esc(p.note)}</span></span></label></li>`; }).join('')}</ul></div>
  ${m.length ? `<div class="panel"><h2>Month by month</h2>
    <p class="sub">${tot(1)} new books and ${tot(2)} read from the TBR, plus ${tot(3)} gifts and ${tot(4)} older books. ${spent.toFixed(2)} spent, about ${(spent / m.length).toFixed(2)} a month so far.</p>
    <div class="key"><span style="--c:var(--ink-soft)">New books</span><span style="--c:var(--new)">TBR books read</span></div>
    ${chartSVG()}
    <div class="tablewrap" style="background:none;border:0"><table class="months"><thead><tr><th>Month</th><th>New</th><th>TBR read</th><th>Gifts</th><th>Older books</th><th>Spent</th></tr></thead><tbody>
    ${m.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5].toFixed(2)}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
  <div class="panel"><h2>Arrived this year</h2><ul class="acq">${
    ['Bought new', 'Gift', 'Bought second-hand'].map(k => { const l = thisYear.filter(b => b.acquired_how === k);
      return l.length ? `<li><h4>${k} (${l.length})</h4>${l.map(b => `<div>${esc(b.title)}</div>`).join('')}</li>` : ''; }).join('')}
    ${(year.unhauled || []).length ? `<li><h4>Unhauled</h4>${year.unhauled.map(([t, s]) => `<div>${esc(t)} <span class="src">${esc(s)}</span></div>`).join('')}</li>` : ''}</ul></div>
  <div class="two"><div class="panel"><h2>Borrowed</h2><ul class="simple">${(year.borrowed || []).map(([t, f]) => `<li>${esc(t)} <small>from ${esc(f)}</small></li>`).join('')}</ul></div>
  <div class="panel"><h2>Wishlist</h2><ul class="simple">${(year.wishlist || []).map(([t, a]) => `<li>${esc(t)} <small>${esc(a)}</small></li>`).join('')}</ul></div></div>`;
}

/* ---------- book card ---------- */
function setRead(b, now) {
  b.read = now;
  if (now) { b.reading = false; b.date_finished = b.date_finished || today(); }
  else b.date_finished = null;
}
const opts = (list, cur) => { const l = list.includes(cur) || !cur ? list : [cur, ...list]; return (cur ? '' : '<option value=""></option>') + l.map(v => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join(''); };
const PEN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14.5 6.5l3 3" stroke="currentColor" stroke-width="1.8"/></svg>';
const XX = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
let fillLocRef = () => {};

function openBook(id, editing) {
  const dlg = $('#dlg');
  const isNew = id == null;
  const b = isNew ? {id: null, title: '', author: '', series: '', genre: '', format: 'Fiction', owned: 'St Gallen', year: THIS_YEAR, pages: null, lang: 'French', read: false, reading: false, date_finished: null, acquired_how: 'Bought new', cover: null}
                  : books.find(x => x.id === id);
  if (!b) return;
  const img = !isNew && coverFile(b);
  const head = `<div class="dhead"><div><h3>${isNew ? 'New book' : esc(b.title)}</h3>${isNew ? '' : `<p class="by">${esc(b.author)}</p>`}</div>
    <div class="ticons">${editing ? '' : `<button class="icon" data-act="edit" aria-label="Edit this book" title="Edit">${PEN}</button>`}<button class="icon" data-act="close" aria-label="Close" title="Close">${XX}</button></div></div>`;
  let body;
  if (!editing) {
    body = `${img ? `<img class="dcover" src="${esc(img)}" referrerpolicy="no-referrer" onerror="this.remove()" alt="">` : ''}<dl>${b.series ? `<dt>Series</dt><dd>${esc(b.series)}</dd>` : ''}<dt>Genre</dt><dd>${esc(b.genre)}</dd>
      <dt>Format</dt><dd>${esc(b.format || 'Not set')}</dd><dt>Where</dt><dd>${esc(b.owned || 'Unknown')}</dd><dt>Language</dt><dd>${esc(b.lang || 'Not set')}</dd>
      <dt>Pages</dt><dd>${b.pages ?? 'Not set'}</dd><dt>Acquired</dt><dd>${b.year ?? 'Not set'}${b.acquired_how ? `, ${esc(b.acquired_how.toLowerCase())}` : ''}</dd>
      ${b.date_finished ? `<dt>Finished</dt><dd>${esc(b.date_finished)}</dd>` : ''}</dl>
      <div class="actions status2">
        <button class="tog" data-act="read" aria-pressed="${isRead(b)}">${isRead(b) ? '✓ ' : ''}Read</button>
        <button class="tog r" data-act="reading" aria-pressed="${isReading(b)}">${isReading(b) ? '● ' : ''}Currently reading</button></div>`;
  } else {
    body = `<form class="editf" onsubmit="return false">
      <label>Title<input name="title" value="${esc(b.title)}" required></label>
      <label>Author<input name="author" value="${esc(b.author)}"></label>
      <label>Series<input name="series" value="${esc(b.series)}"></label>
      <div class="row2"><label>Genre<select name="genre">${opts(GENRES, b.genre)}</select></label>
      <label>Format<select name="format">${opts(FORMATS, b.format)}</select></label></div>
      <div class="row2"><label>Where<input name="owned" list="places" value="${esc(b.owned)}"></label>
      <label>Language<select name="lang">${opts(['French', 'English'], b.lang)}</select></label></div>
      <div class="row2"><label>Pages<input name="pages" type="number" min="0" value="${b.pages ?? ''}"></label>
      <label>Acquired (year)<input name="year" type="number" min="1900" max="2100" value="${b.year ?? ''}"></label></div>
      <div class="row2"><label>How acquired<select name="acquired_how">${opts(['Bought new', 'Gift', 'Bought second-hand', 'Borrowed'], b.acquired_how || '')}</select></label>
      <label>Cover image file<input name="coverfile" type="file" accept="image/jpeg,image/png,image/webp"></label></div>
      <label>Cover link <small>(paste an image address, e.g. from Babelio: right-click the cover, "Copy image address")</small><input name="coverurl" type="url" placeholder="https://…" value="${esc(/^https?:/i.test(b.cover || '') ? b.cover : '')}"></label>
      <datalist id="places">${locations().map(l => `<option value="${esc(l)}">`).join('')}</datalist>
    </form>
    <div class="actions"><button class="btn" data-act="save">${isNew ? 'Add to library' : 'Save changes'}</button><button class="btn ghost" data-act="cancel">Cancel</button>
    ${isNew ? '' : '<button class="btn ghost danger" data-act="delete" style="margin-left:auto">Remove</button>'}</div>`;
  }
  $('#dlgBody').innerHTML = head + body;
  dlg.dataset.id = isNew ? '' : String(b.id);
  if (!dlg.open) dlg.showModal();
  if (editing) dlg.querySelector('input[name=title]').focus();
}

function initDialog(fillLoc) {
  fillLocRef = fillLoc;
  const dlg = $('#dlg');
  dlg.addEventListener('click', async e => {
    if (e.target === dlg) { dlg.close(); return; }
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    const act = btn.dataset.act;
    const id = dlg.dataset.id === '' ? null : +dlg.dataset.id;
    const b = id == null ? null : books.find(x => x.id === id);
    if (act === 'close') { dlg.close(); return; }
    if (act === 'edit') { openBook(id, true); return; }
    if (act === 'cancel') { if (id == null) dlg.close(); else openBook(id); return; }
    if (act === 'delete') {
      if (!confirm(`Remove “${b.title}” from your library?`)) return;
      books = books.filter(x => x.id !== id); reindex(); save(); renderAll(); dlg.close(); return;
    }
    if (act === 'save') {
      const f = dlg.querySelector('.editf');
      const title = f.elements.title.value.trim(); if (!title) { f.elements.title.focus(); return; }
      const target = b || {id: books.reduce((m, x) => Math.max(m, x.id), 0) + 1, read: false, reading: false, date_finished: null, cover: null};
      const oldTitle = b ? b.title : null;
      for (const k of ['title', 'author', 'series', 'genre', 'format', 'owned', 'lang', 'acquired_how']) target[k] = f.elements[k].value.trim();
      for (const k of ['pages', 'year']) { const v = f.elements[k].value.trim(); target[k] = v === '' ? null : parseInt(v); }
      const link = f.elements.coverurl.value.trim();
      if (link && /^https?:\/\//i.test(link)) target.cover = link;
      else if (!link && /^https?:/i.test(target.cover || '')) target.cover = null;
      const file = f.elements.coverfile.files[0];
      if (file) {
        const ext = ({'image/png': '.png', 'image/webp': '.webp'})[file.type] || '.jpg';
        const name = slug(title) + ext;
        if (readOnly) alert('Covers can only be added in Chrome or Edge.');
        else try {
          const w = await (await coversDir.getFileHandle(name, {create: true})).createWritable(); await w.write(file); await w.close();
          target.cover = name; if (coverURL.has(name)) URL.revokeObjectURL(coverURL.get(name)); coverURL.set(name, URL.createObjectURL(file));
        } catch (err) { alert('The cover could not be saved: ' + err.message); }
      }
      if (!b) books.push(target);
      if (oldTitle && oldTitle !== title) challenges.forEach(c => c.rooms.forEach(r => { if (r.book === oldTitle) r.book = title; }));
      reindex(); fillLocRef(); save(); renderAll(); openBook(target.id); return;
    }
    if (act === 'read') setRead(b, !isRead(b));
    if (act === 'reading') { if (isReading(b)) b.reading = false; else { b.reading = true; if (b.read) { b.read = false; b.date_finished = null; } } }
    save(); renderAll(); openBook(b.id);
  });
}

/* ---------- render ---------- */
function renderAll() {
  ledger();
  const v = F.view;
  $('#filters').classList.toggle('hidden', v === 'challenges' || v === 'goal');
  ['wall', 'library', 'challenges', 'goal'].forEach(k => $('#v-' + k).classList.toggle('hidden', k !== v));
  if (v === 'wall') renderWall();
  if (v === 'library') renderLibrary();
  if (v === 'challenges') renderChallenges();
  if (v === 'goal') renderGoal();
}

boot();
})();

</script>
