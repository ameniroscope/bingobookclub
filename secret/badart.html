<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Hall of Shame · Bingo Book Club</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧻</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Special+Elite&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper: #ece6d8;
    --paper-dark: #d8d0bc;
    --ink: #2a2a2a;
    --ink-faded: #6b6558;
    --tape: rgba(230, 220, 190, .55);
    --text: #ece6d8;
    --text-dim: #918a78;
    --elana:  #c9a84c;
    --lena:   #9caf88;
    --kathi:  #9b6fb0;
    --marine: #5a9bd4;
  }

  body {
    background-image: url("fanart/taggwall.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--text);
    font-family: 'Special Elite', 'Courier New', monospace;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 2.5rem 1rem 1.5rem;
  }
  header h1 {
    font-family: 'Permanent Marker', cursive;
    font-size: clamp(1.6rem, 4.2vw, 2.8rem);
    letter-spacing: .04em;
    color: #e8e0c8;
    text-shadow: 0 2px 0 #000, 0 4px 14px rgba(0,0,0,.6);
  }
  header p {
    margin-top: .5rem;
    color: var(--text-dim);
    font-size: 1rem;
    font-style: italic;
    font-family: 'Patrick Hand', serif;
  }

  .board-wrap {
  margin: 0 auto 2rem;
  max-width: 100%;
  padding: 0.5rem clamp(0.75rem, 5vw, 5rem);
}

 .board-wrap {
   margin: 0 auto 2rem;
   max-width: 100%;
   padding: 0.5rem clamp(0.75rem, 5vw, 5rem);
 }
 
 .board-frame {
   padding: 0;
 }
 
 .board {
   position: relative;
   min-height: 600px;
   overflow: hidden;
   padding: 24px;
 }

/* remove the old drip pseudo-elements since the real photo already has plenty of texture */
.board::before, .board::after {
  content: none;
}


  /* faint spray drips */
  .board::before, .board::after {
    content: '';
    position: absolute;
    pointer-events: none;
    opacity: .5;
  }
  .board::before {
    top: 6%; left: 10%;
    width: 3px; height: 90px;
    background: linear-gradient(rgba(226,80,60,.4), transparent);
    border-radius: 2px;
  }
  .board::after {
    top: 18%; right: 14%;
    width: 4px; height: 130px;
    background: linear-gradient(rgba(60,140,200,.35), transparent);
    border-radius: 2px;
  }

  .pin-item {
    position: absolute;
    cursor: pointer;
    transition: transform .2s;
  }
  .pin-item:hover { z-index: 100 !important; transform: scale(1.04) !important; }

  .poster-wrap {
    position: relative;
    background: var(--paper);
    padding: 12px 12px 40px;
    box-shadow: 3px 6px 16px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.15);
  }

  .poster-wrap img {
    display: block;
    width: 100%;
    object-fit: cover;
    filter: grayscale(.15) contrast(1.05);
  }

  .poster-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 40px;
    padding: 4px 10px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    overflow: hidden;
  }
  .poster-label .lbl-emoji { font-size: 1rem; flex-shrink: 0; }
  .poster-label .lbl-caption {
    font-size: .78rem;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: 'Special Elite', monospace;
  }

  /* tape corners instead of a nail/pin */
  .tape {
    position: absolute;
    width: 46px;
    height: 18px;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
    z-index: 2;
    opacity: .8;
  }
  .tape.tl { top: -8px; left: -6px; transform: rotate(-8deg); }
  .tape.tr { top: -8px; right: -6px; transform: rotate(8deg); }

  .empty-board {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 400px;
    color: #4a4a45;
    font-family: 'Patrick Hand', serif;
    font-style: italic;
    font-size: 1.15rem;
    text-shadow: 0 1px 2px rgba(255,255,255,.15);
  }

  .fab {
    position: fixed;
    bottom: 2rem; right: 2rem;
    z-index: 50;
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: .75rem 1.4rem;
    font-family: 'Permanent Marker', cursive;
    font-size: .8rem;
    letter-spacing: .03em;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,.6);
    transition: transform .15s, box-shadow .15s;
  }
  .fab:hover { transform: translateY(-2px) rotate(-1deg); box-shadow: 0 6px 28px rgba(0,0,0,.8); }

  /* MODAL */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    z-index: 200;
    background: rgba(0,0,0,.85);
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 6px;
    padding: 2rem;
    width: 100%;
    max-width: 460px;
    color: var(--ink);
  }
  .modal h2 {
    font-family: 'Permanent Marker', cursive;
    font-size: 1.15rem;
    letter-spacing: .03em;
    margin-bottom: 1.4rem;
    color: var(--ink);
    text-align: center;
  }

  label {
    display: block;
    font-size: .75rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--ink-faded);
    margin-bottom: .35rem;
    margin-top: 1rem;
    font-family: 'Special Elite', monospace;
  }
  label:first-of-type { margin-top: 0; }

  input[type="text"], textarea {
    width: 100%;
    background: #fbf8ef;
    border: 1px solid var(--ink-faded);
    border-radius: 3px;
    color: var(--ink);
    font-family: 'Special Elite', monospace;
    font-size: .95rem;
    padding: .55rem .75rem;
    outline: none;
    transition: border-color .15s;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--ink); }
  textarea { resize: vertical; min-height: 70px; }

  .player-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: .3rem;
  }
  .player-btn {
    background: #fbf8ef;
    border: 2px solid var(--ink-faded);
    border-radius: 6px;
    color: var(--ink);
    cursor: pointer;
    padding: .55rem .3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-family: 'Permanent Marker', cursive;
    font-size: .58rem;
    letter-spacing: .02em;
    transition: border-color .15s;
  }
  .player-btn .emoji { font-size: 1.4rem; }
  .player-btn[data-pid="elana"].selected  { border-color: var(--elana);  color: #7a5f10;  }
  .player-btn[data-pid="lena"].selected   { border-color: var(--lena);   color: #4c6438;  }
  .player-btn[data-pid="kathi"].selected  { border-color: var(--kathi);  color: #5f3d78;  }
  .player-btn[data-pid="marine"].selected { border-color: var(--marine); color: #2f5f8c; }

  #imgPreview {
    width: 100%; max-height: 180px;
    object-fit: contain;
    border-radius: 4px;
    margin-top: .5rem;
    display: none;
    background: #fbf8ef;
  }

  .modal-actions {
    display: flex; gap: .75rem;
    margin-top: 1.5rem;
    justify-content: flex-end;
  }
  .btn {
    font-family: 'Permanent Marker', cursive;
    font-size: .75rem;
    letter-spacing: .03em;
    padding: .6rem 1.2rem;
    border-radius: 4px;
    border: 2px solid var(--ink);
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .8; }
  .btn-cancel { background: transparent; color: var(--ink-faded); border-color: var(--ink-faded); }
  .btn-submit { background: var(--ink); color: var(--paper); }
  .btn-submit:disabled { opacity: .35; cursor: not-allowed; }
  .error-msg { color: #a83a2a; font-size: .85rem; margin-top: .4rem; font-style: italic; font-family: 'Patrick Hand', serif; }

  /* LIGHTBOX */
  .lightbox {
    display: none;
    position: fixed; inset: 0;
    z-index: 300;
    background: rgba(0,0,0,.95);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: .75rem;
    padding: 1.5rem;
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 100%; max-height: 75vh;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 8px 60px rgba(0,0,0,.8);
  }
  .lb-bottom {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-family: 'Patrick Hand', serif;
    font-size: 1.1rem;
    color: var(--text);
  }
</style>
</head>
<body>

<header>
  <a href="../index.html" class="home-btn"><span class="home-btn-icon">🏠</span> Home</a>
  <h1>🧻 The Hall of Shame 🧻</h1>
  <p>Some things cannot be unseen</p>
</header>

<div class="board-wrap">
  <div class="board-frame">
    <div class="board" id="board">
      <div class="empty-board" id="emptyState">No flyers yet — be the first to tape something up 🎨</div>
    </div>
  </div>
</div>

<button class="fab" id="openModal">📎 Tape One Up</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Add to the Wall</h2>
    <label>Who's posting?</label>
    <div class="player-grid">
      <button class="player-btn" data-pid="elana"  data-emoji="🐉"  data-name="Elana"><span class="emoji">🐉</span>Elana</button>
      <button class="player-btn" data-pid="lena"   data-emoji="🌙"  data-name="Lena"><span class="emoji">🌙</span>Lena</button>
      <button class="player-btn" data-pid="kathi"  data-emoji="🍄"  data-name="Kathi"><span class="emoji">🍄</span>Kathi</button>
      <button class="player-btn" data-pid="marine" data-emoji="🧜‍♀️" data-name="Marine"><span class="emoji">🧜‍♀️</span>Marine</button>
    </div>
    <label for="urlInput">Image URL</label>
    <input type="text" id="urlInput" placeholder="https://..." autocomplete="off">
    <div class="error-msg" id="urlError"></div>
    <img id="imgPreview" alt="preview">
    <label for="captionInput">Caption <span style="opacity:.6">(optional)</span></label>
    <textarea id="captionInput" placeholder="e.g. Violet's face just... isn't"></textarea>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="closeModal">Cancel</button>
      <button class="btn btn-submit" id="submitBtn" disabled>Tape to Wall</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <img id="lbImg" src="" alt="">
  <div class="lb-bottom" id="lbBottom">
    <span id="lbEmoji"></span>
    <span id="lbCaption"></span>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAIQTe-QGQmwqTVmIyJZZ_qlDNsD6GUskY",
  authDomain: "bingobookclub-2144e.firebaseapp.com",
  projectId: "bingobookclub-2144e",
  storageBucket: "bingobookclub-2144e.firebasestorage.app",
  messagingSenderId: "294177836341",
  appId: "1:294177836341:web:6d5f11e64737fbe3aad07c"
});
const db = getFirestore(app);

const PLAYERS = {
  elana:  { emoji:"🐉",  color:"#c9a84c" },
  lena:   { emoji:"🌙",  color:"#9caf88" },
  kathi:  { emoji:"🍄",  color:"#9b6fb0" },
  marine: { emoji:"🧜‍♀️", color:"#5a9bd4" },
};

function seededRand(seed) {
  let s = seed;
  return () => { s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; };
}

const board        = document.getElementById("board");
const overlay      = document.getElementById("overlay");
const urlInput     = document.getElementById("urlInput");
const urlError     = document.getElementById("urlError");
const imgPreview   = document.getElementById("imgPreview");
const captionInput = document.getElementById("captionInput");
const submitBtn    = document.getElementById("submitBtn");
const lightbox     = document.getElementById("lightbox");
const lbImg        = document.getElementById("lbImg");
const lbEmoji      = document.getElementById("lbEmoji");
const lbCaption    = document.getElementById("lbCaption");
const lbBottom     = document.getElementById("lbBottom");

let selectedPlayer = null, urlValid = false;
let allItems = [];

document.querySelectorAll(".player-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".player-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    selectedPlayer = btn.dataset.pid;
    checkSubmit();
  });
});

let previewTimer;
urlInput.addEventListener("input", () => {
  clearTimeout(previewTimer);
  urlError.textContent = "";
  urlValid = false;
  imgPreview.style.display = "none";
  checkSubmit();
  const val = urlInput.value.trim();
  if (!val) return;
  previewTimer = setTimeout(() => {
    imgPreview.style.display = "block";
    imgPreview.src = val;
    imgPreview.onload  = () => { urlValid = true;  urlError.textContent = ""; checkSubmit(); };
    imgPreview.onerror = () => { urlValid = false; imgPreview.style.display = "none"; urlError.textContent = "Image couldn't load — check the URL."; checkSubmit(); };
  }, 600);
});

function checkSubmit() { submitBtn.disabled = !(selectedPlayer && urlValid); }

document.getElementById("openModal").addEventListener("click", () => overlay.classList.add("open"));
document.getElementById("closeModal").addEventListener("click", closeModal);
overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });

function closeModal() {
  overlay.classList.remove("open");
  urlInput.value = ""; captionInput.value = "";
  urlError.textContent = "";
  imgPreview.style.display = "none"; imgPreview.src = "";
  urlValid = false; selectedPlayer = null;
  document.querySelectorAll(".player-btn").forEach(b => b.classList.remove("selected"));
  checkSubmit();
}

submitBtn.addEventListener("click", async () => {
  if (!selectedPlayer || !urlValid) return;
  submitBtn.disabled = true;
  submitBtn.textContent = "Taping up…";
  try {
    await addDoc(collection(db, "badart"), {
      pid:     selectedPlayer,
      url:     urlInput.value.trim(),
      caption: captionInput.value.trim(),
      ts:      serverTimestamp(),
    });
    closeModal();
  } catch(e) {
    console.error(e);
    urlError.textContent = "Firebase error — try again.";
    submitBtn.disabled = false;
  }
  submitBtn.textContent = "Tape to Wall";
});

onSnapshot(query(collection(db, "badart"), orderBy("ts", "asc")), snap => {
  allItems = [];
  snap.forEach(d => allItems.push({ id: d.id, ...d.data() }));
  renderBoard();
});

window.addEventListener("resize", renderBoard);

function renderBoard() {
  board.innerHTML = "";
  if (!allItems.length) {
    board.innerHTML = `<div class="empty-board">No flyers yet — be the first to tape something up 🎨</div>`;
    return;
  }

  const bw = board.offsetWidth || 900;
  const cols = Math.max(2, Math.floor(bw / 260));
  const sizes = [
    { w: 260, h: 220 },
    { w: 320, h: 280 },
    { w: 380, h: 320 },
    { w: 280, h: 360 },
    { w: 340, h: 240 },
  ];
  const cellW = bw / cols;
  const cellH = 360;
  const rows = Math.ceil(allItems.length / cols);
  const bh = Math.max(420, rows * cellH + 60);
  board.style.minHeight = bh + "px";

  allItems.forEach((item, i) => {
    const p = PLAYERS[item.pid] || { emoji:"🎨", color:"#fff" };
    const seed = item.id.split("").reduce((a,c) => a + c.charCodeAt(0), 0) + i;
    const rnd  = seededRand(seed);

    const sz  = sizes[Math.floor(rnd() * sizes.length)];
    const rot = (rnd() - 0.5) * 8;
    const col = i % cols;
    const row = Math.floor(i / cols);
    const jitterX = (rnd() - 0.5) * (cellW * 0.3);
    const jitterY = (rnd() - 0.5) * (cellH * 0.3);
    const x = Math.max(16, Math.min(bw - sz.w - 16, col * cellW + (cellW - sz.w) / 2 + jitterX));
    const y = Math.max(24, row * cellH + (cellH - sz.h) / 2 + jitterY + 24);
    const zBase = 10 + i;

    const el = document.createElement("div");
    el.className = "pin-item";
    el.style.cssText = `left:${x}px; top:${y}px; width:${sz.w}px; z-index:${zBase}; transform:rotate(${rot}deg);`;

    el.innerHTML = `
      <div class="tape tl" style="background:${p.color}"></div>
      <div class="tape tr" style="background:${p.color}"></div>
      <div class="poster-wrap">
        <img src="${item.url}" alt="" style="height:${sz.h}px" onerror="this.style.display='none'">
        <div class="poster-label">
          <span class="lbl-emoji">${p.emoji}</span>
          <span class="lbl-caption">${item.caption || ''}</span>
        </div>
      </div>`;

    el.addEventListener("click", () => {
      lbImg.src             = item.url;
      lbEmoji.textContent   = p.emoji;
      lbCaption.textContent = item.caption || "";
      lbBottom.style.display = "flex";
      lightbox.classList.add("open");
    });

    board.appendChild(el);
  });
}

lightbox.addEventListener("click", () => lightbox.classList.remove("open"));
document.addEventListener("keydown", e => { if (e.key === "Escape") lightbox.classList.remove("open"); });
</script>
</body>
</html>
