<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AVATAR the Last Airbender</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1410;
    padding: 20px;
    font-family: sans-serif;
  }

  /* ====== TUNE THESE TO MATCH YOUR IMAGE ====== */
  .tracker-wrap {
    position: relative;
    width: 100%;
    max-width: 1536px;
    aspect-ratio: 1536 / 1024;   /* match your actual image px dimensions */
    background-image: url('atla_tracker.png'); /* <-- swap in your file */
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;

    /* Column x-positions (as % of wrap width), one per season */
    --col1-x: 9.6%;
    --col2-x: 39.7%;
    --col3-x: 71.9%;

    /* Row start (as % of wrap height) and spacing between rows */
    --row-start-y: 47.6%;
    --row-height: 2.02%;

    --box-size: 1.1%; /* checkbox width/height relative to wrap width */
  }

  .ep-checkbox {
    position: absolute;
    width: var(--box-size);
    aspect-ratio: 1 / 1;
    appearance: none;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.001); /* invisible, sits over printed box */
    cursor: pointer;
    border: none;
  }

  .ep-checkbox:checked {
    background: rgba(120, 30, 20, 0.55); /* fills the printed box when checked */
    box-shadow: 0 0 4px rgba(0,0,0,0.4);
  }

  /* Small alignment helper: uncomment to see hitboxes while tuning */
  /* .ep-checkbox { background: rgba(255,0,0,0.3) !important; } */
</style>
</head>
<body>

<div class="tracker-wrap" id="wrap"></div>

<script>
  const seasons = [
    { col: '--col1-x', count: 20 },
    { col: '--col2-x', count: 20 },
    { col: '--col3-x', count: 19 }
  ];

  const wrap = document.getElementById('wrap');
  const STORAGE_KEY = 'atlaEpisodeTracker';
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

  seasons.forEach((season, sIdx) => {
    for (let i = 0; i < season.count; i++) {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'ep-checkbox';
      const id = `s${sIdx + 1}-ep${i + 1}`;
      cb.id = id;
      cb.style.left = `var(${season.col})`;
      cb.style.top = `calc(var(--row-start-y) + var(--row-height) * ${i})`;
      if (saved[id]) cb.checked = true;
      cb.addEventListener('change', () => {
        saved[id] = cb.checked;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
      });
      wrap.appendChild(cb);
    }
  });
</script>

</body>
</html>
