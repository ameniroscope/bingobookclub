<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1410;
    padding: 20px;
    font-family: sans-serif;
  }

  .tracker-wrap {
    position: relative;
    width: 100%;
    max-width: 1536px;
    aspect-ratio: 1536 / 1024; /* match your actual image px dimensions */
    background-image: url('atla_tracker.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    --box-size: 1.1%;
  }

  .ep-checkbox {
    position: absolute;
    width: var(--box-size);
    aspect-ratio: 1 / 1;
    cursor: pointer;
    transform: translate(-50%, -50%); /* coordinates are box centers */
  }

  .ep-checkbox::before,
  .ep-checkbox::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 140%;
    height: 2px;
    background: #7a1f1f;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .ep-checkbox::before { transform: translate(-50%, -50%) rotate(45deg); }
  .ep-checkbox::after  { transform: translate(-50%, -50%) rotate(-45deg); }

  .ep-checkbox.checked::before,
  .ep-checkbox.checked::after { opacity: 1; }

  /* .ep-checkbox { background: rgba(255,0,0,0.25); } */
