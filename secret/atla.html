<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AVATAR the Last Airbender</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1410;
    padding: 20px;
    font-family: sans-serif;
  }

  .tracker-wrap {
    position: relative;
    width: 100%;
    max-width: 1536px;
    aspect-ratio: 1536 / 1024; /* match your actual image px dimensions */
    background-image: url('atla_tracker.png'); /* same folder, as noted */
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;

    --col1-x: 9.6%;
    --col2-x: 39.7%;
    --col3-x: 71.9%;

    --row-start-y: 47.6%;
    --row-height: 2.02%;

    --box-size: 1.1%;
  }

  .ep-checkbox {
    position: absolute;
    width: var(--box-size);
    aspect-ratio: 1 / 1;
    cursor: pointer;
  }

  .ep-checkbox::before,
  .ep-checkbox::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 140%;
    height: 2px;
    background: #7a1f1f;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .ep-checkbox::before {
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .ep-checkbox::after {
    transform: translate(-50%, -50%) rotate(-45deg);
  }

  .ep-checkbox.checked::before,
  .ep-checkbox.checked::after {
    opacity: 1;
  }

  /* Uncomment to see hitboxes while aligning */
  /* .ep-checkbox { background: rgba(255,0,0,0.25); } */
</style>
</head>
<body>

<div class="tracker-wrap" id="wrap"></div>

<script>
  // ---- Firebase setup: paste your existing config here ----
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const DOC_REF = db.collection('atla_tracker').doc('shared');

  const seasons = [
    { col: '--col1-x', count: 20 },
    { col: '--col2-x', count: 20 },
    { col: '--col3-x', count: 19 }
  ];

  const wrap = document.getElementById('wrap');
  const checkboxEls = {};

  // Build the checkbox divs
  seasons.forEach((season, sIdx) => {
    for (let i = 0; i < season.count; i++) {
      const id = `s${sIdx + 1}-ep${i + 1}`;
      const box = document.createElement('div');
      box.className = 'ep-checkbox';
      box.dataset.id = id;
      box.style.left = `var(${season.col})`;
      box.style.top = `calc(var(--row-start-y) + var(--row-height) * ${i})`;
      box.addEventListener('click', () => toggle(id));
      wrap.appendChild(box);
      checkboxEls[id] = box;
    }
  });

  function toggle(id) {
    const isChecked = checkboxEls[id].classList.contains('checked');
    const newVal = !isChecked;
    checkboxEls[id].classList.toggle('checked', newVal);
    DOC_REF.set({ [id]: newVal }, { merge: true });
  }

  // Live sync: reflect Firestore state into the checkboxes
  DOC_REF.onSnapshot((doc) => {
    const data = doc.data() || {};
    Object.keys(checkboxEls).forEach((id) => {
      checkboxEls[id].classList.toggle('checked', !!data[id]);
    });
  });
</script>

 <script>
  // TEMPORARY — calibration mode. Remove once you're done picking positions.
  document.getElementById('wrap').addEventListener('click', (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(2);
    const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(2);
    console.log(`{ x:${x}, y:${y} }`);
  });
</script>
 
</body>
</html>
