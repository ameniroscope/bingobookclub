<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Five-Star Shelf · Bingo Book Club</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cork: #c8955a;
    --cork-dark: #a8743a;
    --cork-shadow: #7a5220;
    --frame: #5c3410;
    --text: #e8e0d0;
    --text-dim: #888;
    --elana:  #c9a84c;
    --lena:   #9caf88;
    --kathi:  #9b6fb0;
    --marine: #5a9bd4;
  }

  body {
    background: #1a1008;
    color: var(--text);
    font-family: 'Crimson Text', Georgia, serif;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 2.5rem 1rem 1.5rem;
  }
  header h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.4rem, 3.5vw, 2.4rem);
    letter-spacing: .12em;
    color: #e8d9b0;
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  header p {
    margin-top: .4rem;
    color: #a08060;
    font-size: 1rem;
    font-style: italic;
  }

  .board {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 1;
    pointer-events: none;   /* let the covers themselves catch clicks */
  }

  /* ── ROAMING BOOK COVERS ── */
  .float-book {
    position: absolute;
    top: 0; left: 0;
    width: 96px;
    cursor: pointer;
    z-index: 5;
    will-change: transform;
    pointer-events: auto;   /* clickable even though .board is click-through */
  }
  .float-book .fb-inner {
    background: #fff;
    padding: 5px 5px 6px;
    box-shadow: 2px 4px 12px rgba(0,0,0,.45), 1px 1px 0 rgba(0,0,0,.1);
    transition: transform .2s;
  }
  .float-book:hover { z-index: 100; }
  .float-book:hover .fb-inner { transform: scale(1.08); }
  .float-book img {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    background: #2a1a0c;
  }
  .fb-nocover {
    display: flex; align-items: center; justify-content: center;
    width: 100%; aspect-ratio: 2 / 3;
    font-size: 2rem; background: #2a1a0c; color: #c8955a;
  }
  .fb-star {
    position: absolute;
    top: -9px; right: -9px;
    font-size: 1rem;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
    z-index: 2;
  }
  .fb-caption {
    font-family: 'Crimson Text', serif;
    font-size: .72rem;
    color: #555;
    text-align: center;
    padding-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty-board {
    position: fixed; inset: 0;
    z-index: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    color: #6a5236;
    font-style: italic;
    font-size: 1.1rem;
    text-align: center; padding: 1rem;
  }

  .fab {
    position: fixed;
    bottom: 2rem; right: 2rem;
    z-index: 50;
    background: #e8d9b0;
    color: #2a1505;
    border: none;
    border-radius: 50px;
    padding: .75rem 1.4rem;
    font-family: 'Cinzel', serif;
    font-size: .82rem;
    letter-spacing: .08em;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,.6);
    transition: transform .15s, box-shadow .15s;
  }
  .fab:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(0,0,0,.8); }

  /* ── MODAL (add book) ── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    z-index: 200;
    background: rgba(0,0,0,.85);
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .overlay.open { display: flex; }

  .modal {
    background: #1e1208;
    border: 1px solid #3a2510;
    border-radius: 12px;
    padding: 2rem;
    width: 100%;
    max-width: 460px;
    max-height: 92vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    letter-spacing: .1em;
    margin-bottom: 1.4rem;
    color: #e8d9b0;
  }

  label {
    display: block;
    font-size: .75rem;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: #a08060;
    margin-bottom: .35rem;
    margin-top: 1rem;
  }
  label:first-of-type { margin-top: 0; }

  input[type="text"], textarea {
    width: 100%;
    background: #120c04;
    border: 1px solid #3a2510;
    border-radius: 6px;
    color: var(--text);
    font-family: 'Crimson Text', serif;
    font-size: 1rem;
    padding: .55rem .75rem;
    outline: none;
    transition: border-color .15s;
  }
  input[type="text"]:focus, textarea:focus { border-color: #a08060; }
  textarea { resize: vertical; min-height: 70px; }

  .player-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: .3rem;
  }
  .player-btn {
    background: #120c04;
    border: 2px solid #3a2510;
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    padding: .55rem .3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-family: 'Cinzel', serif;
    font-size: .65rem;
    letter-spacing: .04em;
    transition: border-color .15s;
  }
  .player-btn .emoji { font-size: 1.4rem; }
  .player-btn[data-pid="elana"].selected  { border-color: var(--elana);  color: var(--elana);  }
  .player-btn[data-pid="lena"].selected   { border-color: var(--lena);   color: var(--lena);   }
  .player-btn[data-pid="kathi"].selected  { border-color: var(--kathi);  color: var(--kathi);  }
  .player-btn[data-pid="marine"].selected { border-color: var(--marine); color: var(--marine); }

  #coverPreview {
    width: 90px; margin-top: .6rem;
    border-radius: 4px;
    display: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  .cover-hint { font-size: .78rem; color: #7a5f42; font-style: italic; margin-top: .4rem; min-height: 1.1rem; }

  .modal-actions {
    display: flex; gap: .75rem;
    margin-top: 1.5rem;
    justify-content: flex-end;
  }
  .btn {
    font-family: 'Cinzel', serif;
    font-size: .78rem;
    letter-spacing: .07em;
    padding: .6rem 1.2rem;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-cancel { background: #2a1a08; color: #a08060; }
  .btn-submit { background: #e8d9b0; color: #1a0c04; }
  .btn-submit:disabled { opacity: .35; cursor: not-allowed; }
  .error-msg { color: #e55; font-size: .85rem; margin-top: .4rem; font-style: italic; }

  /* ── DETAIL POPUP ── */
  .detail {
    display: none;
    position: fixed; inset: 0;
    z-index: 300;
    background: rgba(0,0,0,.9);
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
    overflow-y: auto;
  }
  .detail.open { display: flex; }
  .detail-card {
    background: #1e1208;
    border: 1px solid #3a2510;
    border-radius: 12px;
    width: 100%;
    max-width: 540px;
    padding: 1.75rem;
    position: relative;
  }
  .detail-close {
    position: absolute; top: .8rem; right: 1rem;
    background: none; border: none; color: #a08060;
    font-size: 1.4rem; cursor: pointer; line-height: 1;
  }
  .detail-close:hover { color: #e8d9b0; }
  .detail-top { display: flex; gap: 1.2rem; align-items: flex-start; }
  .detail-cover {
    width: 120px; min-width: 120px;
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,.6);
  }
  .detail-cover img { display: block; width: 100%; aspect-ratio: 2/3; object-fit: cover; }
  .detail-cover .fb-nocover { font-size: 2.4rem; }
  .detail-meta { flex: 1; min-width: 0; }
  .detail-title {
    font-family: 'Cinzel', serif; font-size: 1.15rem;
    color: #f0e6c8; letter-spacing: .03em; line-height: 1.25;
  }
  .detail-author { font-style: italic; color: #a08060; margin-top: .2rem; font-size: .95rem; }
  .detail-stars { color: #e8b84c; letter-spacing: .12em; margin-top: .5rem; font-size: .95rem; }
  .detail-recby {
    margin-top: .6rem; font-size: .82rem; color: var(--text-dim);
    display: flex; align-items: center; gap: .35rem;
  }
  .detail-note {
    margin-top: 1.1rem;
    font-size: 1rem; line-height: 1.6; color: var(--text);
    background: rgba(255,255,255,.03);
    border-left: 2px solid #3a2510;
    padding: .7rem .9rem; border-radius: 0 6px 6px 0;
    font-style: italic;
  }

  .detail-divider {
    height: 1px; margin: 1.4rem 0 1rem;
    background: linear-gradient(to right, transparent, #3a2510, transparent);
  }
  .comments-title {
    font-family: 'Cinzel', serif; font-size: .72rem;
    letter-spacing: .12em; text-transform: uppercase;
    color: #a08060; margin-bottom: .8rem;
  }
  .comment {
    display: flex; gap: .55rem; margin-bottom: .8rem;
    font-size: .92rem; line-height: 1.4;
  }
  .comment .c-emoji { font-size: 1.1rem; flex-shrink: 0; }
  .comment .c-body { min-width: 0; }
  .comment .c-name { font-family: 'Cinzel', serif; font-size: .68rem; letter-spacing: .05em; color: #c9a06a; }
  .comment .c-text { color: var(--text); }
  .no-comments { color: #6a5236; font-style: italic; font-size: .88rem; margin-bottom: .8rem; }

  .comment-form { margin-top: 1rem; }
  .mini-players { display: flex; gap: 6px; margin-bottom: .5rem; flex-wrap: wrap; }
  .mini-btn {
    background: #120c04; border: 2px solid #3a2510; border-radius: 20px;
    color: var(--text); cursor: pointer; padding: .25rem .6rem;
    display: inline-flex; align-items: center; gap: .3rem;
    font-family: 'Cinzel', serif; font-size: .6rem; letter-spacing: .04em;
    transition: border-color .15s;
  }
  .mini-btn .emoji { font-size: 1rem; }
  .mini-btn[data-pid="elana"].selected  { border-color: var(--elana);  color: var(--elana);  }
  .mini-btn[data-pid="lena"].selected   { border-color: var(--lena);   color: var(--lena);   }
  .mini-btn[data-pid="kathi"].selected  { border-color: var(--kathi);  color: var(--kathi);  }
  .mini-btn[data-pid="marine"].selected { border-color: var(--marine); color: var(--marine); }
  .comment-row { display: flex; gap: .5rem; align-items: flex-end; }
  .comment-row textarea { min-height: 44px; }
  .comment-post {
    background: #e8d9b0; color: #1a0c04; border: none; border-radius: 6px;
    font-family: 'Cinzel', serif; font-size: .68rem; letter-spacing: .05em;
    padding: .55rem .9rem; cursor: pointer; white-space: nowrap; transition: opacity .15s;
  }
  .comment-post:disabled { opacity: .35; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <a href="../index.html" class="home-btn">🏠 Home</a>
  <h1>✦ Five-Star Shelf ✦</h1>
  <p>The books we devoured outside the club, five stars, no notes</p>
  <p>Share them with the class, we all want to find are next fav book</p>
</header>

<div class="board" id="board"></div>
<div class="empty-board" id="emptyState">No five-star reads yet — add the first one ⭐</div>

<button class="fab" id="openModal">⭐ Add a Book</button>

<!-- ADD BOOK MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Add a Five-Star Read</h2>
    <label>Who are you?</label>
    <div class="player-grid">
      <button class="player-btn" data-pid="elana"  data-emoji="🐉"  data-name="Elana"><span class="emoji">🐉</span>Elana</button>
      <button class="player-btn" data-pid="lena"   data-emoji="🌙"  data-name="Lena"><span class="emoji">🌙</span>Lena</button>
      <button class="player-btn" data-pid="kathi"  data-emoji="🍄"  data-name="Kathi"><span class="emoji">🍄</span>Kathi</button>
      <button class="player-btn" data-pid="marine" data-emoji="🧜‍♀️" data-name="Marine"><span class="emoji">🧜‍♀️</span>Marine</button>
    </div>
    <label for="titleInput">Book title *</label>
    <input type="text" id="titleInput" placeholder="e.g. The Priory of the Orange Tree" autocomplete="off">
    <label for="authorInput">Author</label>
    <input type="text" id="authorInput" placeholder="e.g. Samantha Shannon" autocomplete="off">
    <div class="cover-hint" id="coverHint"></div>
    <img id="coverPreview" alt="cover preview">
    <label for="noteInput">Why did you love it?</label>
    <textarea id="noteInput" placeholder="Gush away — what made this one a five-star read…"></textarea>
    <div class="error-msg" id="formError"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="closeModal">Cancel</button>
      <button class="btn btn-submit" id="submitBtn" disabled>Add to Shelf</button>
    </div>
  </div>
</div>

<!-- DETAIL POPUP -->
<div class="detail" id="detail">
  <div class="detail-card">
    <button class="detail-close" id="detailClose">✕</button>
    <div class="detail-top">
      <div class="detail-cover" id="dCover"></div>
      <div class="detail-meta">
        <div class="detail-title" id="dTitle"></div>
        <div class="detail-author" id="dAuthor"></div>
        <div class="detail-stars">★★★★★</div>
        <div class="detail-recby" id="dRecby"></div>
      </div>
    </div>
    <div class="detail-note" id="dNote"></div>
    <div class="detail-divider"></div>
    <div class="comments-title">Comments</div>
    <div id="dComments"></div>
    <div class="comment-form">
      <div class="mini-players" id="miniPlayers">
        <button class="mini-btn" data-pid="elana"  data-emoji="🐉"  data-name="Elana"><span class="emoji">🐉</span>Elana</button>
        <button class="mini-btn" data-pid="lena"   data-emoji="🌙"  data-name="Lena"><span class="emoji">🌙</span>Lena</button>
        <button class="mini-btn" data-pid="kathi"  data-emoji="🍄"  data-name="Kathi"><span class="emoji">🍄</span>Kathi</button>
        <button class="mini-btn" data-pid="marine" data-emoji="🧜‍♀️" data-name="Marine"><span class="emoji">🧜‍♀️</span>Marine</button>
      </div>
      <div class="comment-row">
        <textarea id="commentInput" placeholder="Add a comment…"></textarea>
        <button class="comment-post" id="commentPost" disabled>Post</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, arrayUnion }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAIQTe-QGQmwqTVmIyJZZ_qlDNsD6GUskY",
  authDomain: "bingobookclub-2144e.firebaseapp.com",
  projectId: "bingobookclub-2144e",
  storageBucket: "bingobookclub-2144e.firebasestorage.app",
  messagingSenderId: "294177836341",
  appId: "1:294177836341:web:6d5f11e64737fbe3aad07c"
});
const db = getFirestore(app);
const col = collection(db, "fivestars");

const PLAYERS = {
  elana:  { emoji:"🐉",  name:"Elana",  color:"#c9a84c" },
  lena:   { emoji:"🌙",  name:"Lena",   color:"#9caf88" },
  kathi:  { emoji:"🍄",  name:"Kathi",  color:"#9b6fb0" },
  marine: { emoji:"🧜‍♀️", name:"Marine", color:"#5a9bd4" },
};

/* ── elements ── */
const board        = document.getElementById("board");
const overlay      = document.getElementById("overlay");
const titleInput   = document.getElementById("titleInput");
const authorInput  = document.getElementById("authorInput");
const noteInput    = document.getElementById("noteInput");
const coverHint    = document.getElementById("coverHint");
const coverPreview = document.getElementById("coverPreview");
const submitBtn    = document.getElementById("submitBtn");
const formError    = document.getElementById("formError");
const detail       = document.getElementById("detail");
const commentInput = document.getElementById("commentInput");
const commentPost  = document.getElementById("commentPost");

let selectedPlayer = sessionStorage.getItem("fiveStarPlayer") || null;
let commentPlayer  = selectedPlayer;
let allItems = [];
let openId = null;
let foundCover = "";

/* ── player selection (add modal) ── */
function paintPlayerBtns() {
  document.querySelectorAll(".player-btn").forEach(b =>
    b.classList.toggle("selected", b.dataset.pid === selectedPlayer));
  document.querySelectorAll(".mini-btn").forEach(b =>
    b.classList.toggle("selected", b.dataset.pid === commentPlayer));
}
document.querySelectorAll(".player-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    selectedPlayer = btn.dataset.pid;
    sessionStorage.setItem("fiveStarPlayer", selectedPlayer);
    if (!commentPlayer) commentPlayer = selectedPlayer;
    paintPlayerBtns();
    checkSubmit();
  });
});
document.querySelectorAll(".mini-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    commentPlayer = btn.dataset.pid;
    sessionStorage.setItem("fiveStarPlayer", commentPlayer);
    paintPlayerBtns();
    checkComment();
  });
});
paintPlayerBtns();

/* ── cover auto-fetch preview ── */
let coverTimer;
function scheduleCover() {
  clearTimeout(coverTimer);
  foundCover = "";
  coverPreview.style.display = "none";
  const title = titleInput.value.trim();
  if (!title) { coverHint.textContent = ""; return; }
  coverHint.textContent = "Looking for a cover…";
  coverTimer = setTimeout(async () => {
    const url = await fetchCover(title, authorInput.value.trim());
    if (url) {
      foundCover = url;
      coverPreview.src = url;
      coverPreview.style.display = "block";
      coverHint.textContent = "Found a cover ✦";
    } else {
      coverHint.textContent = "No cover found — we'll show a 📖 instead.";
    }
  }, 650);
}
titleInput.addEventListener("input", () => { scheduleCover(); checkSubmit(); });
authorInput.addEventListener("input", scheduleCover);

function checkSubmit() {
  submitBtn.disabled = !(selectedPlayer && titleInput.value.trim());
}

/* ── open / close add modal ── */
document.getElementById("openModal").addEventListener("click", () => { overlay.classList.add("open"); paintPlayerBtns(); });
document.getElementById("closeModal").addEventListener("click", closeAdd);
overlay.addEventListener("click", e => { if (e.target === overlay) closeAdd(); });

function closeAdd() {
  overlay.classList.remove("open");
  titleInput.value = ""; authorInput.value = ""; noteInput.value = "";
  coverHint.textContent = ""; formError.textContent = "";
  coverPreview.style.display = "none"; coverPreview.src = "";
  foundCover = "";
  checkSubmit();
}

/* ── submit new book ── */
submitBtn.addEventListener("click", async () => {
  const title = titleInput.value.trim();
  if (!selectedPlayer || !title) return;
  submitBtn.disabled = true;
  submitBtn.textContent = "Adding…";
  formError.textContent = "";
  try {
    const cover = foundCover || await fetchCover(title, authorInput.value.trim());
    const p = PLAYERS[selectedPlayer];
    await addDoc(col, {
      pid:     selectedPlayer,
      name:    p.name,
      emoji:   p.emoji,
      title,
      author:  authorInput.value.trim(),
      note:    noteInput.value.trim(),
      cover:   cover || "",
      comments: [],
      ts:      serverTimestamp(),
    });
    closeAdd();
  } catch(e) {
    console.error(e);
    formError.textContent = "Couldn't save — try again.";
  }
  submitBtn.textContent = "Add to Shelf";
  checkSubmit();
});

/* ── live data ── */
onSnapshot(query(col, orderBy("ts", "asc")), snap => {
  allItems = [];
  snap.forEach(d => allItems.push({ id: d.id, ...d.data() }));
  renderBoard();
  if (openId) {
    const it = allItems.find(x => x.id === openId);
    if (it) renderComments(it);
  }
});

/* ── roaming board ── */
let floaters = [];   // {el, x, y, vx, vy, w, h, paused}
let rafId = null;

function renderBoard() {
  if (rafId) cancelAnimationFrame(rafId);
  board.querySelectorAll(".float-book").forEach(e => e.remove());
  floaters = [];

  const empty = document.getElementById("emptyState");
  if (!allItems.length) {
    if (empty) empty.style.display = "flex";
    return;
  }
  if (empty) empty.style.display = "none";

  const bw = board.clientWidth  || 900;
  const bh = board.clientHeight || 620;

  allItems.forEach((item, i) => {
    const el = document.createElement("div");
    el.className = "float-book";
    const cover = coverUrlOf(item);
    el.innerHTML = `
      <span class="fb-star">⭐</span>
      <div class="fb-inner">
        ${cover
          ? `<img src="${cover}" alt="${escapeAttr(item.title)}" onerror="this.parentNode.innerHTML='<div class=&quot;fb-nocover&quot;>📖</div>'">`
          : `<div class="fb-nocover">📖</div>`}
        <div class="fb-caption">${escapeHtml(item.title)}</div>
      </div>`;
    el.addEventListener("click", () => openDetail(item.id));
    board.appendChild(el);

    const w = el.offsetWidth  || 96;
    const h = el.offsetHeight || 150;
    const seed = hashId(item.id) + i;
    const rnd = seededRand(seed);
    const f = {
      el, w, h,
      x: 20 + rnd() * Math.max(1, bw - w - 40),
      y: 20 + rnd() * Math.max(1, bh - h - 40),
      vx: (0.25 + rnd() * 0.35) * (rnd() < 0.5 ? 1 : -1),
      vy: (0.25 + rnd() * 0.35) * (rnd() < 0.5 ? 1 : -1),
      paused: false,
    };
    el.addEventListener("mouseenter", () => f.paused = true);
    el.addEventListener("mouseleave", () => f.paused = false);
    floaters.push(f);
    place(f);
  });

  animate();
}

function place(f) { f.el.style.transform = `translate(${f.x}px, ${f.y}px)`; }

function animate() {
  const bw = board.clientWidth  || 900;
  const bh = board.clientHeight || 620;
  floaters.forEach(f => {
    if (!f.paused) {
      f.x += f.vx; f.y += f.vy;
      if (f.x <= 0)            { f.x = 0;            f.vx = Math.abs(f.vx); }
      if (f.x >= bw - f.w)     { f.x = bw - f.w;     f.vx = -Math.abs(f.vx); }
      if (f.y <= 0)            { f.y = 0;            f.vy = Math.abs(f.vy); }
      if (f.y >= bh - f.h)     { f.y = bh - f.h;     f.vy = -Math.abs(f.vy); }
      place(f);
    }
  });
  rafId = requestAnimationFrame(animate);
}

window.addEventListener("resize", () => {
  const bw = board.clientWidth, bh = board.clientHeight;
  floaters.forEach(f => {
    f.x = Math.min(f.x, Math.max(0, bw - f.w));
    f.y = Math.min(f.y, Math.max(0, bh - f.h));
    place(f);
  });
});

/* ── detail popup ── */
function openDetail(id) {
  const item = allItems.find(x => x.id === id);
  if (!item) return;
  openId = id;
  const cover = coverUrlOf(item);
  document.getElementById("dCover").innerHTML = cover
    ? `<img src="${cover}" alt="${escapeAttr(item.title)}" onerror="this.parentNode.innerHTML='<div class=&quot;fb-nocover&quot;>📖</div>'">`
    : `<div class="fb-nocover">📖</div>`;
  document.getElementById("dTitle").textContent  = item.title || "";
  document.getElementById("dAuthor").textContent = item.author ? "by " + item.author : "";
  document.getElementById("dRecby").innerHTML =
    `<span>${item.emoji || "✨"}</span><span>Loved by ${escapeHtml(item.name || "someone")}</span>`;
  const note = document.getElementById("dNote");
  if (item.note) { note.style.display = "block"; note.textContent = `"${item.note}"`; }
  else { note.style.display = "none"; }
  renderComments(item);
  commentInput.value = "";
  paintPlayerBtns();
  checkComment();
  detail.classList.add("open");
}

function renderComments(item) {
  const box = document.getElementById("dComments");
  const comments = (item.comments || []).slice().sort((a,b) => (a.ts||0) - (b.ts||0));
  if (!comments.length) {
    box.innerHTML = `<div class="no-comments">No comments yet — start the conversation.</div>`;
    return;
  }
  box.innerHTML = comments.map(c => `
    <div class="comment">
      <span class="c-emoji">${c.emoji || "✨"}</span>
      <div class="c-body">
        <div class="c-name">${escapeHtml(c.name || "")}</div>
        <div class="c-text">${escapeHtml(c.text || "")}</div>
      </div>
    </div>`).join("");
}

function checkComment() {
  commentPost.disabled = !(commentPlayer && commentInput.value.trim() && openId);
}
commentInput.addEventListener("input", checkComment);

commentPost.addEventListener("click", async () => {
  const text = commentInput.value.trim();
  if (!commentPlayer || !text || !openId) return;
  commentPost.disabled = true;
  const p = PLAYERS[commentPlayer];
  try {
    await updateDoc(doc(db, "fivestars", openId), {
      comments: arrayUnion({ pid: commentPlayer, name: p.name, emoji: p.emoji, text, ts: Date.now() })
    });
    commentInput.value = "";
  } catch(e) {
    console.error(e);
  }
  checkComment();
});

document.getElementById("detailClose").addEventListener("click", closeDetail);
detail.addEventListener("click", e => { if (e.target === detail) closeDetail(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeDetail(); closeAdd(); } });
function closeDetail() { detail.classList.remove("open"); openId = null; }

/* ── helpers ── */
function coverUrlOf(item) { return typeof item.cover === "string" ? item.cover : ""; }
function hashId(id) { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function seededRand(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function escapeHtml(str) { return String(str).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function escapeAttr(str) { return escapeHtml(str); }

async function fetchCover(title, author) {
  const q = `intitle:${title}` + (author ? `+inauthor:${author}` : "");
  try {
    const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=5&printType=books&fields=items(volumeInfo(imageLinks))`);
    const d = await r.json();
    const links = d?.items?.find(it => it.volumeInfo?.imageLinks)?.volumeInfo?.imageLinks;
    const url = (links?.thumbnail || links?.smallThumbnail || "").replace("http://","https://").replace("&edge=curl","");
    if (url) return url;
  } catch {}
  try {
    const r = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(title)}${author ? `&author=${encodeURIComponent(author)}` : ""}&limit=5`);
    const d = await r.json();
    const coverId = d?.docs?.find(doc => doc.cover_i)?.cover_i;
    if (coverId) return `https://covers.openlibrary.org/b/id/${coverId}-M.jpg`;
  } catch {}
  return "";
}
