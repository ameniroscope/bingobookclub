<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Cosmere series</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0c1a29;
    --night-2:#13283c;
    --ink:#17324b;
    --paper:#e6f0f2;
    --paper-2:#d3e3e8;
    --gold:#c9a24a;
    --gold-d:#8a6a22;
    --red:#8c2226;
    --serif:'Cormorant', Georgia, serif;
    --fell:'IM Fell English', Georgia, serif;
    --tint:#3b7a93;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(ellipse at 30% 0%, #1c3a55 0%, transparent 60%),
      var(--night);
    color:var(--paper);
    font-family:var(--serif); font-size:1.15rem; line-height:1.55;
  }
  header.top{max-width:900px; margin:0 auto; padding:2rem 1.25rem 1rem}
  .pagenav{display:flex; flex-wrap:wrap; gap:.4rem 1.4rem; margin:0 0 1.4rem}
  .pagenav a{
    font-family:var(--fell); font-style:italic; font-size:1.05rem;
    color:#c8b072; text-decoration:none; border-bottom:1px solid transparent;
  }
  .pagenav a:hover{color:#f3d98a; border-bottom-color:#8a6a22}

  .titlerow{display:flex; align-items:center; gap:1rem}
  .disc{
    flex:0 0 auto; display:grid; place-items:center; width:64px; height:64px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--tint-hi), var(--tint) 62%, var(--tint-lo));
    box-shadow:0 0 0 2px #14293e, 0 0 0 4.5px #dbe9ed, 0 0 0 6px #14293e, 0 3px 8px 4px rgba(10,25,40,.35);
  }
  .disc svg{width:58%; height:58%; fill:none; stroke:#f6efd9; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
  header.top h1{
    margin:0; font-family:var(--fell); font-style:italic; font-weight:400;
    font-size:clamp(1.9rem,5vw,3rem); color:var(--gold); letter-spacing:.03em; line-height:1.05;
  }
  .subline{margin:.3rem 0 0; color:#b9cdd6; font-style:italic}
  .subline b{color:#d7e6ec; font-weight:600; font-style:normal}

  main{max-width:900px; margin:0 auto; padding:0 1.25rem 3rem}
  .panel{
    background:linear-gradient(180deg,#e9f2f4,#d6e6ea); color:var(--ink);
    border:2px solid var(--gold); outline:1px solid #6d5320; outline-offset:-7px;
    border-radius:4px; padding:1.6rem 1.5rem; margin-top:1.5rem;
  }
  .panel h2{margin:0 0 .6rem; font-family:var(--fell); font-style:italic; font-weight:400; font-size:1.5rem; color:var(--red); line-height:1.1}
  .panel p{margin:.5rem 0}
  .lede{font-size:1.2rem}

  ol.books{margin:.6rem 0 0; padding-left:1.4rem}
  ol.books li{margin:.7rem 0; display:flex; gap:.8rem; align-items:flex-start}
  ol.books .bookcover{flex:0 0 auto; width:56px; display:flex; justify-content:center}
  ol.books .bookcover img{width:56px; height:auto; border-radius:2px; box-shadow:0 3px 8px rgba(10,25,40,.4); display:block}
  ol.books .disc.mini{
    display:grid; place-items:center; width:46px; height:46px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--tint-hi), var(--tint) 62%, var(--tint-lo));
    box-shadow:0 0 0 2px #14293e, 0 0 0 3.5px #dbe9ed, 0 0 0 5px #14293e;
  }
  ol.books .disc.mini svg{width:56%; height:56%; fill:none; stroke:#f6efd9; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
  ol.books .bookmeta{padding-top:.15rem}
  ol.books .yr{color:#40607a; font-style:italic; font-size:.95rem}
  ol.books .note{display:block; color:#4a6478; font-style:italic; font-size:.95rem}

  .actions{display:flex; flex-wrap:wrap; gap:.7rem; margin-top:1.3rem}
  .btn{
    font:inherit; font-size:1.05rem; cursor:pointer; padding:.45rem 1.1rem; border-radius:3px;
    border:1px solid var(--ink); background:var(--ink); color:#eaf3f5; text-decoration:none; display:inline-block;
  }
  .btn.ghost{background:transparent; color:var(--ink)}
  .btn:hover{filter:brightness(1.15)}
  .btn:focus-visible{outline:3px solid #f3d98a; outline-offset:2px}

  .spoiler{margin-top:1.4rem; padding-top:1rem; border-top:1px solid #9bb7c3}
  .spoiler h2{margin:0 0 .5rem}
  .spoiler .reveal{
    background:repeating-linear-gradient(135deg,#b7cdd6 0 6px,#c6d9df 6px 12px);
    color:transparent; user-select:none; border-radius:3px; display:block; padding:.15rem .4rem;
  }
  .spoiler.open .reveal{background:none; color:var(--ink); padding:0; user-select:auto}

  .credit{margin-top:2rem; font-size:.98rem; color:#8ea8b6}
  .credit a{color:#c8b072}
  .missing{text-align:center; padding:3rem 1rem}
  .missing a{color:#c8b072}
</style>
</head>
<body>

<header class="top">
  <nav class="pagenav" aria-label="Cosmere pages">
    <a href="cosmere.html">&larr; The Cosmere</a>
    <a href="cosmere.html#chart-section">The star chart</a>
    <a href="../index.html">The book club</a>
  </nav>
  <div id="head"></div>
</header>

<main id="main"></main>

<script src="cosmere-data.js"></script>
<script>
const id = new URLSearchParams(location.search).get('s');
const s  = id && SERIES[id];
const world = s && WORLDS.find(w => w.id === s.world);

const head = document.getElementById('head');
const main = document.getElementById('main');

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16); const f=v=>Math.max(0,Math.min(255,Math.round(v+amt)));
  return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;
}
function el(tag,cls,text){const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e;}
function glyphDisc(){
  const g = (world && GLYPHS[world.glyph]) || '';
  return '<span class="disc mini"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+g+'"/></svg></span>';
}

if(!s){
  document.title = 'Cosmere series not found';
  main.innerHTML =
    '<div class="missing"><p>Sorry, we could not find that series.</p>' +
    '<p><a href="cosmere.html">Back to the Cosmere hub</a> or the ' +
    '<a href="cosmere_map.html">star chart</a>.</p></div>';
} else {
  document.title = s.title + ' – the Cosmere';

  // tint the page from the matching world
  const tint = (world && world.tint) || '#3b7a93';
  document.documentElement.style.setProperty('--tint', tint);
  document.documentElement.style.setProperty('--tint-hi', shade(tint,60));
  document.documentElement.style.setProperty('--tint-lo', shade(tint,-45));

  // header: glyph disc + title + planet / magic line
  const row = el('div','titlerow');
  if(world && GLYPHS[world.glyph]){
    const disc = el('span','disc');
    disc.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${GLYPHS[world.glyph]}"/></svg>`;
    row.appendChild(disc);
  }
  const titleWrap = el('div');
  titleWrap.appendChild(el('h1',null,s.title));
  const sub = el('p','subline');
  sub.innerHTML = 'Set on <b>' + s.planet + '</b> &middot; ' + (s.magic || 'No named magic system');
  titleWrap.appendChild(sub);
  row.appendChild(titleWrap);
  head.appendChild(row);

  // spoiler-free panel
  const intro = el('section','panel');
  intro.appendChild(el('p','lede', s.blurb));

  intro.appendChild(el('h2',null,'The books, in order'));
  const ol = el('ol','books');
  s.books.forEach(b=>{
    const li = el('li');
    // cover thumbnail (falls back to the world glyph if Open Library has none)
    const cov = el('span','bookcover');
    const url = coverUrl(b,'M');
    if(url){
      const img = el('img'); img.loading='lazy'; img.alt = 'Cover of ' + b.title; img.src = url;
      img.addEventListener('error',()=>{ cov.innerHTML = glyphDisc(); });
      cov.appendChild(img);
    } else {
      cov.innerHTML = glyphDisc();
    }
    li.appendChild(cov);
    const meta = el('span','bookmeta');
    const t = el('span','t'); t.textContent = b.title + ' ';
    if(b.year) t.appendChild(el('span','yr','(' + b.year + ')'));
    meta.appendChild(t);
    if(b.note) meta.appendChild(el('span','note', b.note));
    li.appendChild(meta);
    ol.appendChild(li);
  });
  intro.appendChild(ol);

  const actions = el('div','actions');
  const toMap = el('a','btn ghost','See it on the star chart'); toMap.href = 'cosmere.html#chart-section'; actions.appendChild(toMap);
  const toHub = el('a','btn ghost','More Cosmere basics'); toHub.href = 'cosmere.html'; actions.appendChild(toHub);
  intro.appendChild(actions);
  main.appendChild(intro);

  // deeper stuff, hidden behind a toggle (like the Shards panel on the map)
  if(s.spoiler){
    const sp = el('section','panel spoiler');
    sp.appendChild(el('h2',null,'Deeper: how it ties into the Cosmere'));
    const val = el('p'); const reveal = el('span','reveal', s.spoiler); val.appendChild(reveal); sp.appendChild(val);
    const tog = el('button','btn ghost','Show (spoilers)'); tog.type='button'; tog.style.marginTop='.7rem';
    tog.addEventListener('click',()=>{ const open=sp.classList.toggle('open'); tog.textContent = open?'Hide':'Show (spoilers)'; });
    sp.appendChild(tog);
    main.appendChild(sp);
  }

  const credit = el('p','credit');
  credit.innerHTML =
    'Our own spoiler-free paraphrase for the book club. For canonical, spoiler-heavy detail see the ' +
    '<a href="https://coppermind.net/wiki/Cosmere" target="_blank" rel="noopener">Coppermind</a> and ' +
    '<a href="https://www.brandonsanderson.com/pages/what-is-the-cosmere" target="_blank" rel="noopener">Brandon’s own page</a>.';
  main.appendChild(credit);
}
</script>
</body>
</html>
