<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Challenges — The Bingo Book Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0a0e;
    --card-bg:#1a1418;
    --gold:#c9a84c;
    --cream:#f0e6c8;
    --text:#e8ddc4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Crimson Text', serif;
    padding:2rem 1rem 4rem;
  }
  h1{
    font-family:'Cinzel', serif;
    text-align:center;
    color:var(--gold);
    font-weight:600;
    letter-spacing:0.04em;
    font-size:2rem;
    margin-bottom:2.5rem;
  }
  .wrapper{
    display:grid;
    grid-template-columns: 1fr 1.25fr 1fr;
    gap:2.5rem;
    max-width:1400px;
    margin:0 auto;
    align-items:start;
  }
  .col-side{
    display:flex;
    flex-direction:column;
    gap:2.5rem;
  }
  .col-center{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.25rem;
    position:sticky;
    top:2rem;
  }
  .center-img{
    width:100%;
    max-width:480px;
    border-radius:10px;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,0.55));
  }
  .caption-box{
    width:100%;
    max-width:480px;
    background:var(--card-bg);
    border:1px solid rgba(201,168,76,0.35);
    border-radius:10px;
    padding:1rem 1.25rem;
  }
  .caption-box textarea{
    width:100%;
    min-height:70px;
    resize:vertical;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'Crimson Text', serif;
    font-style:italic;
    font-size:1.05rem;
    line-height:1.4;
  }
  .caption-save{
    display:block;
    margin:0.5rem 0 0 auto;
    background:rgba(201,168,76,0.15);
    border:1px solid var(--gold);
    color:var(--gold);
    font-family:'Cinzel', serif;
    font-size:0.75rem;
    letter-spacing:0.05em;
    padding:0.35rem 0.9rem;
    border-radius:6px;
    cursor:pointer;
    transition:all 0.2s;
  }
  .caption-save:hover{ background:rgba(201,168,76,0.3); transform:translateY(-1px); }

  .board{
    background:var(--card-bg);
    border:1px solid rgba(201,168,76,0.25);
    border-radius:12px;
    padding:1rem;
  }
  .board-head{
    display:flex;
    align-items:center;
    gap:0.6rem;
    margin-bottom:0.75rem;
  }
  .lock-icon{
    cursor:pointer;
    font-size:1.1rem;
    user-select:none;
    flex-shrink:0;
    filter:drop-shadow(0 0 4px rgba(201,168,76,0.3));
  }
  .title-input{
    flex:1;
    background:transparent;
    border:none;
    border-bottom:1px solid rgba(201,168,76,0.3);
    color:var(--gold);
    font-family:'Cinzel', serif;
    font-size:0.95rem;
    padding:0.3rem 0.2rem;
    outline:none;
  }
  .title-input::placeholder{ color:rgba(201,168,76,0.4); }
  .title-input:disabled{ cursor:not-allowed; }

  .card-wrap{
    position:relative;
    width:100%;
  }
  .card-img{
    width:100%;
    display:block;
    border-radius:6px;
  }
  .grid-overlay{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:37.5%;
    width:77%;
    height:39%;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);
  }
  .cell{
    cursor:pointer;
    transition:background 0.15s;
    border-radius:2px;
  }
  .cell.locked{ cursor:not-allowed; }
  .cell.marked{
    background:var(--pcolor, rgba(201,168,76,0.55));
  }

  /* password modal */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--card-bg);
    border:1px solid var(--gold);
    box-shadow:0 0 20px rgba(201,168,76,0.25);
    border-radius:12px;
    padding:1.75rem;
    width:90%;
    max-width:320px;
    text-align:center;
  }
  .modal-box h3{
    font-family:'Cinzel', serif;
    color:var(--gold);
    margin:0 0 1rem;
    font-size:1.1rem;
  }
  .modal-box input{
    width:100%;
    padding:0.6rem 0.75rem;
    background:#0d0a0e;
    border:1px solid rgba(201,168,76,0.4);
    border-radius:6px;
    color:var(--text);
    font-family:'Crimson Text', serif;
    font-size:1rem;
    margin-bottom:0.9rem;
    outline:none;
  }
  .modal-btns{ display:flex; gap:0.6rem; justify-content:center; }
  .modal-btns button{
    font-family:'Cinzel', serif;
    font-size:0.8rem;
    padding:0.5rem 1.1rem;
    border-radius:6px;
    cursor:pointer;
    border:1px solid var(--gold);
    background:rgba(201,168,76,0.15);
    color:var(--gold);
    transition:all 0.2s;
  }
  .modal-btns button:hover{ background:rgba(201,168,76,0.3); transform:translateY(-1px); }
  .modal-msg{ font-size:0.85rem; min-height:1.2em; margin-bottom:0.6rem; color:#e08a8a; }

  @media (max-width:900px){
    .wrapper{ grid-template-columns:1fr; }
    .col-center{ position:static; order:-1; }
    .center-img{ max-width:320px; margin:0 auto; }
    .caption-box{ max-width:320px; }
  }
</style>
</head>
<body>

<h1>✦ Personal Challenges ✦</h1>

<div class="wrapper">
  <div class="col-side" id="colLeft"></div>

  <div class="col-center">
    <img class="center-img" src="BingoPicture.png" alt="Personal challenges">
    <div class="caption-box">
      <textarea id="captionText" placeholder="outside of our shared reads, why not make more challenges?"></textarea>
      <button class="caption-save" id="captionSave">Save</button>
    </div>
  </div>

  <div class="col-side" id="colRight"></div>
</div>

<div class="modal-overlay" id="pwModal">
  <div class="modal-box">
    <h3>Enter your code</h3>
    <div class="modal-msg" id="pwMsg"></div>
    <input type="text" id="pwInput" placeholder="access code" autocomplete="off">
    <div class="modal-btns">
      <button id="pwConfirm">Unlock</button>
      <button id="pwCancel">Cancel</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// TODO: paste your real firebaseConfig from another page in the site
const firebaseConfig = {
  apiKey: "AIzaSyAIQTe-QGQmwqTVmIyJZZ_qlDNsD6GUskY",
  authDomain: "bingobookclub-2144e.firebaseapp.com",
  projectId: "bingobookclub-2144e",
  storageBucket: "bingobookclub-2144e.firebasestorage.app",
  messagingSenderId: "294177836341",
  appId: "1:294177836341:web:6d5f11e64737fbe3aad07c"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const PLAYERS = {
  elana:  { emoji:"🐉", color:"#c9a84c", name:"Elana",  img:"perso_bingo_elana.png"  },
  lena:   { emoji:"🌙", color:"#9caf88", name:"Lena",   img:"perso_bingo_lena.png"   },
  kathi:  { emoji:"🍄", color:"#9b6fb0", name:"Kathi",  img:"perso_bingo_kathi.png"  },
  marine: { emoji:"🧜‍♀️", color:"#5a9bd4", name:"Marine", img:"perso_bingo_marine.png" }
};
const LEFT_COL  = ["elana","lena"];
const RIGHT_COL = ["kathi","marine"];

const state = {};   // per-pid: { marked:[25 bools], title:"", unlocked:false }
let pendingUnlockPid = null;

function buildBoard(pid){
  const p = PLAYERS[pid];
  state[pid] = { marked:new Array(25).fill(false), title:"", unlocked:false };

  const board = document.createElement('div');
  board.className = 'board';
  board.innerHTML = `
    <div class="board-head">
      <span class="lock-icon" data-pid="${pid}">🔒</span>
      <input class="title-input" data-pid="${pid}" placeholder="${p.name}'s challenge title..." disabled>
    </div>
    <div class="card-wrap">
      <img class="card-img" src="${p.img}" alt="${p.name}'s bingo card">
      <div class="grid-overlay" data-pid="${pid}"></div>
    </div>
  `;

  const overlay = board.querySelector('.grid-overlay');
  for(let i=0;i<25;i++){
    const cell = document.createElement('div');
    cell.className = 'cell locked';
    cell.dataset.index = i;
    cell.style.setProperty('--pcolor', hexToRgba(p.color, 0.55));
    cell.addEventListener('click', ()=>onCellClick(pid, i, cell));
    overlay.appendChild(cell);
  }

  board.querySelector('.lock-icon').addEventListener('click', ()=>openLockModal(pid, board));
  board.querySelector('.title-input').addEventListener('change', (e)=>saveTitle(pid, e.target.value));

  return board;
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function onCellClick(pid, index, cellEl){
  if(!state[pid].unlocked) return;
  state[pid].marked[index] = !state[pid].marked[index];
  cellEl.classList.toggle('marked', state[pid].marked[index]);
  setDoc(doc(db, "perso_bingo", pid), { marked: state[pid].marked, title: state[pid].title }, { merge:true });
}

function saveTitle(pid, value){
  state[pid].title = value;
  setDoc(doc(db, "perso_bingo", pid), { title: value, marked: state[pid].marked }, { merge:true });
}

function openLockModal(pid, boardEl){
  pendingUnlockPid = { pid, boardEl };
  document.getElementById('pwMsg').textContent = '';
  document.getElementById('pwInput').value = '';
  document.getElementById('pwModal').classList.add('open');
}

async function confirmUnlock(){
  const code = document.getElementById('pwInput').value.trim();
  const msgEl = document.getElementById('pwMsg');
  if(!code || !pendingUnlockPid) return;

  const snap = await getDoc(doc(db, "accessCodes", code));
  if(!snap.exists() || snap.data().name !== PLAYERS[pendingUnlockPid.pid].name){
    msgEl.textContent = "Incorrect code.";
    return;
  }

  const { pid, boardEl } = pendingUnlockPid;
  state[pid].unlocked = true;
  boardEl.querySelectorAll('.cell').forEach(c=>c.classList.remove('locked'));
  boardEl.querySelector('.lock-icon').textContent = '🔓';
  boardEl.querySelector('.title-input').disabled = false;

  document.getElementById('pwModal').classList.remove('open');
  pendingUnlockPid = null;
}

document.getElementById('pwConfirm').addEventListener('click', confirmUnlock);
document.getElementById('pwCancel').addEventListener('click', ()=>{
  document.getElementById('pwModal').classList.remove('open');
  pendingUnlockPid = null;
});

// build columns
const colLeft = document.getElementById('colLeft');
const colRight = document.getElementById('colRight');
LEFT_COL.forEach(pid => colLeft.appendChild(buildBoard(pid)));
RIGHT_COL.forEach(pid => colRight.appendChild(buildBoard(pid)));

// live sync from Firestore for all boards
Object.keys(PLAYERS).forEach(pid=>{
  onSnapshot(doc(db, "perso_bingo", pid), (snap)=>{
    if(!snap.exists()) return;
    const data = snap.data();
    if(Array.isArray(data.marked)){
      state[pid].marked = data.marked;
      document.querySelectorAll(`.grid-overlay[data-pid="${pid}"] .cell`).forEach((cell,i)=>{
        cell.classList.toggle('marked', !!data.marked[i]);
      });
    }
    if(typeof data.title === 'string'){
      state[pid].title = data.title;
      const input = document.querySelector(`.title-input[data-pid="${pid}"]`);
      if(input && document.activeElement !== input) input.value = data.title;
    }
  });
});

// caption (shared, lives in same 'perso_bingo' collection so it matches your security rules)
const captionRef = doc(db, "perso_bingo", "meta");
onSnapshot(captionRef, (snap)=>{
  const ta = document.getElementById('captionText');
  if(snap.exists() && document.activeElement !== ta){
    ta.value = snap.data().text || '';
  }
});
document.getElementById('captionSave').addEventListener('click', ()=>{
  setDoc(captionRef, { text: document.getElementById('captionText').value }, { merge:true });
});
</script>
</body>
</html>
