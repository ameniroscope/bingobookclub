<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Endless War</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗡️</text></svg>">
<link rel="stylesheet" href="../style.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap');
@font-face{font-family:'Hakan';src:url('../fonts/Hakan.otf') format('opentype'),url('../fonts/Hakan.ttf') format('truetype');font-weight:400;font-display:swap;}
:root{
  --accent:#b4531b;--accent-lt:#e0913f;--accent-deep:#7c360f;
  --ink:#4a2410;--ink-faded:#835227;
  --sand-lt:#f3e4c6;--sand:#e7cfa0;--sand-dk:#d9b877;
  --display:'Hakan',serif;
}
html,body{background:var(--sand-lt);color:var(--ink);font-family:'Hakan',serif;overflow-x:hidden;}
/* Script font — keep letters joined by removing the wide tracking used for serif type */
.players-title,.map-hint,.y-label,.x-label,.rank-name,.footer{letter-spacing:normal!important;}
#bg-rune{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--sand-lt) url('background.png') center/cover no-repeat;}
#bg-rune::after{content:'';position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(243,228,198,0.30) 0%,rgba(243,228,198,0.05) 42%,rgba(217,184,119,0.16) 100%);}
.home-layout{position:relative;z-index:2;min-height:100vh;display:grid;grid-template-columns:0.85fr 1fr;gap:32px;align-items:center;justify-content:center;padding:40px 50px;max-width:1440px;margin:0 auto;}
@media(max-width:1100px){.home-layout{grid-template-columns:1fr;gap:32px;padding:35px 20px 48px;}}
/* ── CHAPTER MAP ── */
.map-section{display:flex;flex-direction:column;align-items:center;gap:0.6rem;}
.map-wrap{position:relative;width:100%;max-width:420px;}
.map-wrap img{display:block;width:100%;border-radius:6px;box-shadow:0 8px 22px rgba(124,54,15,0.28);}
.map-hint{font-family:'Hakan',serif;font-size:0.9rem;color:var(--accent-deep);letter-spacing:1px;font-style:italic;text-align:center;text-shadow:0 1px 2px rgba(255,247,230,0.6);}
.map-marker{position:absolute;transform:translate(-50%,-50%);font-size:1.4rem;line-height:1;z-index:5;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,0.55));transition:left 0.25s ease,top 0.25s ease;
  cursor:grab;touch-action:none;}
.map-marker.dragging{cursor:grabbing;transition:none;z-index:6;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.7));}
.map-tooltip{position:absolute;z-index:30;background:var(--accent-deep);color:#fff5ec;
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600;font-size:0.8rem;letter-spacing:0.3px;
  padding:0.22rem 0.55rem;border-radius:5px;border:1px solid var(--accent-lt);pointer-events:none;white-space:nowrap;
  transform:translate(-50%,-165%);opacity:0;transition:opacity 0.12s;box-shadow:0 2px 8px rgba(74,36,16,0.45);}
.map-tooltip.show{opacity:1;}
/* ── MOBILE: tap the map to enlarge, then drag your emoji ── */
.map-backdrop{position:fixed;inset:0;background:rgba(74,36,16,0.82);z-index:1000;}
body.map-modal-open{overflow:hidden;}
.map-close{position:fixed;top:14px;right:16px;z-index:1002;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#4a2410;color:#f3e4c6;border:1px solid rgba(243,228,198,0.5);font-size:1.3rem;line-height:1;cursor:pointer;padding:0;}
@media(max-width:900px){
  .map-wrap.map-open{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:94vw;max-width:500px;height:auto;margin:0;z-index:1001;touch-action:none;}
  .map-wrap.map-open img{width:100%;height:auto;max-width:none;max-height:none;touch-action:none;}
}
/* ── PLAYERS / RANK GRID ── */
.players-section{text-align:center;width:100%;}
.players-title{font-family:var(--display);font-size:3.4rem;letter-spacing:1px;margin-top:0;margin-bottom:24px;color:var(--accent);
  text-shadow:0 1px 2px rgba(255,247,230,0.65),0 2px 10px rgba(124,54,15,0.2);}
.rank-frame{position:relative;display:grid;grid-template-columns:70px 1fr;grid-template-rows:auto 56px;gap:10px;max-width:620px;margin:0 auto;padding:8px;}
.y-axis{grid-column:1;grid-row:1;position:relative;display:flex;align-items:center;justify-content:center;}
.y-arrow{width:auto;height:300px;flex-shrink:0;filter:url(#tintArrow);}
.y-label{position:absolute;top:50%;left:-15%;transform:translate(-50%,-50%) rotate(180deg);z-index:1;
  font-family:'Hakan',serif;font-size:clamp(13px,1.8vw,20px);font-weight:400;letter-spacing:2px;
  writing-mode:vertical-rl;color: var(--accent-deep);white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px rgba(255,247,230,0.6);}
.x-axis{grid-column:2;grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.x-arrow-wrap{position:relative;width:100%;}
.x-arrow{position:absolute;top:50%;left:50%;filter:url(#tintArrow);transform:translate(-50%,-50%) rotate(90deg);}
.x-label{font-family:'Hakan',serif;font-size:clamp(13px,1.8vw,20px);font-weight:400;letter-spacing:2px;
  color: var(--accent-deep);white-space:nowrap;pointer-events:none;}
.rank-grid{grid-column:2;grid-row:1;position:relative;aspect-ratio:1/1;width:100%;margin:10px;}
.rank-avatar{position:absolute;text-decoration:none;color:var(--accent);font-family:'Hakan',serif;
  display:flex;flex-direction:column;align-items:center;gap:4px;transform:translate(-50%,-50%);
  transition:left 0.5s ease,top 0.5s ease,transform 0.3s ease;z-index:5;}
.rank-avatar:hover{transform:translate(-50%,-50%) scale(1.08);z-index:6;}
.rank-img-frame{position:relative;width:120px;height:120px;}
.rank-img-frame::before{content:'';position:absolute;inset:-10px;border-radius:50%;
  background:radial-gradient(circle,var(--pc-glow,var(--accent)) 0%,var(--pc-glow,var(--accent)) 40%,transparent 75%);
  opacity:var(--pc-glow-op,0.4);filter:blur(8px);z-index:0;}
.rank-img-frame::after{content:'';position:absolute;inset:-2px;border-radius:50%;background:var(--sand-lt);z-index:1;opacity:0;}
.rank-img-frame img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover;border-radius:50%;border:2px solid var(--accent);box-shadow:0 2px 10px rgba(124,54,15,0.3);}
.rank-avatar:hover .rank-img-frame img{border-color:var(--pc,var(--accent));}
.rank-badge{position:absolute;top:-4px;right:-4px;z-index:10;
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#4a2410;border:2px solid var(--pc,var(--accent));
  font-family:'Hakan',serif;font-size:0.85rem;font-weight:700;
  color:#f3e4c6;text-shadow:0 0 6px rgba(0,0,0,0.6);filter:drop-shadow(0 1px 2px rgba(124,54,15,0.4));}
.rank-name{font-size:1.5rem;letter-spacing:1px;color:var(--accent);text-shadow:0 1px 2px rgba(255,247,230,0.6);}
@media(max-width:800px){
  .players-title{font-size:1.6rem;margin-bottom:24px;}
  .rank-img-frame{width:64px;height:64px;}
  .rank-name{font-size:1.1rem;}
  .rank-frame{grid-template-columns:46px 1fr;grid-template-rows:auto 44px;}
}
/* ── KATHI'S OASIS ── she "read too fast" again, so instead of jail she's
   benched from the ranking quadrant and lounging in an oasis tucked into the
   bottom-right corner of the layout. ── */
.oasis-section{display:flex;justify-content:center;padding:0 20px 6px;}
.oasis-corner{width:min(300px,84vw);
  display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;}
@media(min-width:1101px){
  .oasis-section{padding:0;}
  .oasis-corner{position:fixed;right:-34px;bottom:0;z-index:5;width:300px;}
}
/* Kathi's speech bubble — anchored above her avatar, tail pointing down at her */
.oasis-bubble{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%);
  width:180px;background:rgba(255,253,247,0.82);color:#0b4f48;
  font-family:'Cormorant',Georgia,serif;font-weight:600;font-size:0.92rem;line-height:1.24;letter-spacing:0.2px;
  text-align:center;padding:8px 13px;border:1px solid #0f6d63;border-radius:16px;
  box-shadow:0 4px 12px rgba(11,79,72,0.22);z-index:6;}
.oasis-bubble::before{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border-left:9px solid transparent;border-right:9px solid transparent;border-top:13px solid #0f6d63;}
.oasis-bubble::after{content:'';position:absolute;top:calc(100% - 1px);left:50%;transform:translateX(-50%);
  border-left:8px solid transparent;border-right:8px solid transparent;border-top:13px solid rgba(255,253,247,0.82);}
.oasis-scene{position:relative;width:100%;}
.oasis-scene .oasis-bg{display:block;width:100%;height:auto;border-top-left-radius:5px;
  box-shadow:-4px -4px 20px rgba(124,54,15,0.28);}
.oasis-figure{position:absolute;left:55%;top:70%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform 0.25s ease;}
.oasis-corner:hover .oasis-figure{transform:translate(-50%,-50%) scale(1.06);}
.oasis-figure .photo{width:100px;height:100px;object-fit:cover;border-radius:50%;
  border:3px solid #0f6d63;box-shadow:0 3px 10px rgba(0,0,0,0.35);}
.oasis-name{font-family:'Hakan',serif;font-size:1.15rem;letter-spacing:1px;color:#0b4f48;
  text-shadow:0 1px 2px rgba(255,255,255,0.65);}
@media(max-width:1100px){
  .oasis-corner{width:min(220px,72vw);}
}
.footer-section{position:relative;z-index:2;text-align:center;padding:1.5rem 1rem 3rem;}
.footer-section .footer{color:var(--accent-deep);}
.rune-ornament{display:flex;align-items:center;gap:0.6rem;width:100%;max-width:18rem;margin:1rem auto;}
.rune-ornament .line{flex:1;height:1px;background:linear-gradient(to right,transparent,var(--accent-deep),transparent);}
.rune-ornament .gem{color:var(--accent-deep);font-size:0.7rem;}
</style>
</head>
<body>
<div id="bg-rune"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

</main>

</section>
<section class="footer-section">

  <a class="home-btn" href="../index.html"><span class="home-btn-icon">🏠</span> Home</a>
  <div class="footer">◈ &nbsp; The Bingo Book Club &nbsp; ◈</div>
</section>

  {left:16.91,top:53.70}, {left:25.96,top:53.70}, {left:34.77,top:53.70}, {left:43.82,top:53.70}, // 25–28
  {left:51.91,top:53.70}, {left:60.24,top:53.70}, {left:68.58,top:53.70}, {left:76.43,top:53.70}, // 29–32
  {left:16.91,top:59.57}, {left:25.96,top:59.57}, {left:34.77,top:59.57}, {left:43.82,top:59.57}, // 33–36

  {left:51.91,top:76.07}, {left:60.24,top:76.07}, {left:68.58,top:76.07}, {left:76.43,top:76.07}, // 61–64

];
const MAP_END_IDX = CHAPTER_POS.length-1;
const mapWrap=document.getElementById('mapWrap');
const mapImg=mapWrap.querySelector('img');
const mapTooltip=document.getElementById('mapTooltip');
window.findMapPosition = function () {
  mapImg.style.cursor = "crosshair";
  console.clear();
  console.log("Position finder ON. Click the map to print left/top percentages.");
  mapImg.addEventListener("click", function finderClick(e) {
    const rect = mapImg.getBoundingClientRect();
    const left = ((e.clientX - rect.left) / rect.width  * 100).toFixed(2);
    const top  = ((e.clientY - rect.top)  / rect.height * 100).toFixed(2);

    const dot = document.createElement("div");
    dot.style.cssText = `position:absolute;left:${left}%;top:${top}%;width:10px;height:10px;background:red;
      border:2px solid white;border-radius:50%;transform:translate(-50%,-50%);z-index:99999;pointer-events:none;`;
    mapWrap.appendChild(dot);
  });
};
const MARKER_OFFSET={elana:{x:2,y:-2},lena:{x:2,y:2},kathi:{x:-2,y:2},marine:{x:-2,y:-2}};
function clampIdx(i){return Math.max(0,Math.min(MAP_END_IDX,i));}
function renderMapMarkers(){
  Object.keys(PLAYERS).forEach(pid=>{
    if(dragging&&dragPid===pid)return;
    const p=PLAYERS[pid];
    let m=document.getElementById('mapmarker-'+pid);
    if(!m){
      m=document.createElement('div');
      m.id='mapmarker-'+pid;
      m.className='map-marker';
      m.textContent=p.emoji;
      mapWrap.appendChild(m);
    }
    const idx=clampIdx(stats[pid].mapPos??0);
    const pos=CHAPTER_POS[idx];

    m.style.left=(pos.left+off.x)+'%';

let dragging=false,dragPid=null;
function tryStartDrag(cx,cy){
  for(const pid of Object.keys(PLAYERS)){
    const m=document.getElementById('mapmarker-'+pid); if(!m) continue;
    const r=m.getBoundingClientRect();
    if(Math.hypot(cx-(r.left+r.width/2),cy-(r.top+r.height/2))<24){

const mapCloseBtn=document.createElement('button');mapCloseBtn.type='button';mapCloseBtn.className='map-close';mapCloseBtn.setAttribute('aria-label','Close map');mapCloseBtn.textContent='✕';
let mapHome=null;

function nearestIdx(cx,cy){
  const rect=mapImg.getBoundingClientRect();
  const xp=(cx-rect.left)/rect.width*100, yp=(cy-rect.top)/rect.height*100;
  let best=0,bestD=Infinity;
  CHAPTER_POS.forEach((p,i)=>{
    const d=Math.hypot(xp-p.left,yp-p.top);
    if(d<=bestD){bestD=d;best=i;}
  });
  return best;
}
function onMove(cx,cy){
  if(!dragging||!dragPid)return;
  const m=document.getElementById('mapmarker-'+dragPid); if(!m)return;
  const rect=mapImg.getBoundingClientRect();
  const xp=Math.min(Math.max((cx-rect.left)/rect.width*100,2),98);
  const yp=Math.min(Math.max((cy-rect.top)/rect.height*100,2),98);
  m.style.left=xp+'%';m.style.top=yp+'%';
  const idx=nearestIdx(cx,cy);
  mapTooltip.textContent = idx===0 ? 'Start' : idx===MAP_END_IDX ? 'End' : 'Chapter '+idx;
  mapTooltip.style.left=xp+'%';
  mapTooltip.style.top=yp+'%';
  mapTooltip.classList.add('show');
}
window.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
window.addEventListener('touchmove',e=>onMove(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
async function endDrag(cx,cy){
  if(!dragging)return;
  const pid=dragPid;
  dragging=false;dragPid=null;
  mapTooltip.classList.remove('show');
  const m=document.getElementById('mapmarker-'+pid);
  if(m){m.style.transition='';m.classList.remove('dragging');}
  const idx=nearestIdx(cx,cy);
  const tileChanged=curPos[pid]==null||Number(curPos[pid])!==Number(idx);
  stats[pid].mapPos=idx;
  curPos[pid]=idx;
  if(tileChanged)arriveAt[pid]=Date.now();
  renderMapMarkers();
  render();
  const progress=Math.min(idx,TOTAL_CHAPTERS);
  const payload={mapPos:idx,chapterProgress:progress};
  if(tileChanged)payload.mapPosAt=arriveAt[pid];
  try{await setDoc(doc(db,BINGO_COL,pid),payload,{merge:true});}catch(err){console.error(err);}
}
window.addEventListener('mouseup',e=>endDrag(e.clientX,e.clientY));
window.addEventListener('touchend',e=>endDrag(e.changedTouches[0].clientX,e.changedTouches[0].clientY));
/* ── RANK GRID (best guesser / fastest reader) ── */
const rankGrid=document.getElementById('rankGrid');
const stats={};
Object.keys(PLAYERS).forEach(p=>stats[p]={chapterProgress:0,points:0,mapPos:0});
/* ── ARRIVAL ORDER: first reader to reach a tile ranks ahead as faster ── */
const arriveAt={};   // pid -> timestamp they reached their current tile
const curPos={};     // pid -> current tile
function computeRanks(metric,tieMetric){
  const ids=RANKED_IDS.slice();
  ids.sort((a,b)=>{
    if(stats[a][metric]!==stats[b][metric]) return stats[a][metric]-stats[b][metric];
    if(metric==='chapterProgress'){                           // same tile → first to arrive is faster
      const ta=arriveAt[a]??0,tb=arriveAt[b]??0;
      if(ta!==tb) return tb-ta;                               // earlier arrival → higher rank
    }
    if(stats[a][tieMetric]!==stats[b][tieMetric]) return stats[a][tieMetric]-stats[b][tieMetric];
    const ta=arriveAt[a]??0,tb=arriveAt[b]??0;return tb-ta;   // stable fallback: earlier arrival ahead
  });
  const ranks={};
  ids.forEach((id,i)=>ranks[id]=i+1);
  return ranks;
}
function render(){
  const xRank=computeRanks('chapterProgress','points');
  const yRank=computeRanks('points','chapterProgress');
  RANKED_IDS.forEach(pid=>{
    const p=PLAYERS[pid];
    let a=document.getElementById('rank-'+pid);
    if(!a){
      a=document.createElement('a');
      a.id='rank-'+pid;
      a.className='rank-avatar';
      a.href=p.href;
      a.style.setProperty('--ring',hexA(p.color,0.25));
      a.style.setProperty('--ring-bright',hexA(p.color,0.7));
      a.style.setProperty('--pc',p.color);
      a.style.setProperty('--pc-glow',p.color);
      a.style.setProperty('--pc-glow-op',pid==='elana'?0.4:0.65);
      a.innerHTML=`<div class="rank-img-frame"><img src="${p.img}" alt="${p.name}"><div class="rank-badge" id="badge-${pid}"></div></div><div class="rank-name">${p.name}</div>`;
      rankGrid.appendChild(a);
    }
    const badge=document.getElementById('badge-'+pid);
    if(badge) badge.textContent = stats[pid].points;
    const col=xRank[pid];
    const row=yRank[pid];
    const leftPct=(col-0.5)/RANKED_IDS.length*100;
    const topPct=(RANKED_IDS.length-row+0.5)/RANKED_IDS.length*100;
    a.style.left=leftPct+'%';
    a.style.top=topPct+'%';
  });
}
onSnapshot(collection(db,BINGO_COL),snap=>{
  snap.forEach(d=>{
    if(!PLAYERS[d.id]) return;
    const data=d.data();
    const chapterProgress=Number(data.chapterProgress||0);
    const mapPos=(data.mapPos!=null)?Number(data.mapPos):chapterProgress;
    stats[d.id]={ chapterProgress, points:Number(data.points||0), mapPos };
    if(!(dragging&&dragPid===d.id)){
      curPos[d.id]=mapPos;
      arriveAt[d.id]=(data.mapPosAt!=null)?Number(data.mapPosAt):0;
    }
  });
  render();
  renderMapMarkers();
},err=>console.error(err));
render();
renderMapMarkers();
/* ── AXIS ARROWS: size to actually match the rank-grid's rendered dimensions ── */
const yArrow=document.querySelector('.y-arrow'), xArrow=document.querySelector('.x-arrow'),
      xArrowWrap=document.getElementById('xArrowWrap');
function sizeArrow(img,targetLong){
  const ratio=(img.naturalWidth&&img.naturalHeight)?(img.naturalWidth/img.naturalHeight):0.34;
  img.style.height=Math.round(targetLong)+'px';
  img.style.width=Math.round(targetLong*ratio)+'px';
  return Math.round(targetLong*ratio);
}
function syncAxisArrows(){
  const r=rankGrid.getBoundingClientRect();
  if(r.height>0)sizeArrow(yArrow,r.height*0.92);
  if(r.width>0){
    const thickness=sizeArrow(xArrow,r.width*0.92);
    xArrowWrap.style.height=thickness+'px';
  }
}
function syncAxisArrowsWhenReady(){
  const ready=img=>img.complete?Promise.resolve():new Promise(res=>img.addEventListener('load',res,{once:true}));
  Promise.all([ready(yArrow),ready(xArrow)]).then(syncAxisArrows);
}
syncAxisArrowsWhenReady();
window.addEventListener('resize',syncAxisArrows);
new ResizeObserver(syncAxisArrows).observe(rankGrid);
</script>
</body>
