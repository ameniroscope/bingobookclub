<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yesteryear</title>
<link rel="stylesheet" href="../style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Yesteryear&display=swap" rel="stylesheet">
<style>
:root{
  /* text */
  --ink:#5a4a32;         /* body text */
  --ink-faded:#a89a7c;   /* muted / captions */

  /* surfaces */
  --bg-mid:#f7edc9;      /* page background */
  --bg-deep:#fdf6e3;
  --bone:#fffaf0;        /* cards, buttons */

  /* teal accent */
  --accent:#396765;      /* names, links */
  --accent-lt:#b8d1a3;
  --accent-dim:#c8942f;  /* gold — home btn */

  /* warm neutrals */
  --stone:#e6a822;       /* amber — map border */
  --stone-dk:#e0d0a6;    /* subtle borders */
  --stone-lt:#f5ecd2;    /* pale cream */

  /* coral highlight */
  --pink:#eb7357;        /* side-image borders, ornament lines */

  --num-font:'Courier Prime','Courier New',Courier,monospace;
}
*{font-family:var(--num-font)!important;}
.home-btn,.home-btn *{font-family:'Cinzel',serif!important;}
.pname{font-family:'Yesteryear',cursive!important;}
html,body{background:var(--bg-mid);color:var(--ink);font-family:var(--num-font);}
#bg-rune{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg-mid) url('yesteryear_back.png') center/cover no-repeat;}

.home-layout{position:relative;z-index:2;display:grid;grid-template-columns:0.7fr 1fr 0.7fr;gap:28px;align-items:center;justify-content:center;padding:40px 50px;max-width:1280px;margin:0 auto;}
@media(max-width:900px){.home-layout{grid-template-columns:1fr;gap:32px;padding:35px 20px;}}

/* ── CHAPTER MAP ── */
.map-section{display:flex;flex-direction:column;align-items:center;gap:0.6rem;}
.map-wrap{position:relative;width:100%;max-width:420px;}
.map-wrap img{
  display:block;
  width:100%;
  border:3px double var(--stone);
  filter:drop-shadow(0 8px 12px rgba(200,148,47,0.35));
}
.map-hint{font-family:'fredoka',cursive;font-size:0.7rem;color:var(--accent);letter-spacing:0.5px;font-style:italic;text-align:center;}
.map-marker{position:absolute;transform:translate(-50%,-50%);font-size:1.4rem;line-height:1;z-index:5;
  filter:drop-shadow(0 1px 3px rgba(90,74,50,0.5));transition:left 0.25s ease,top 0.25s ease;
  cursor:grab;touch-action:none;}
.map-marker.dragging{cursor:grabbing;transition:none;z-index:6;filter:drop-shadow(0 2px 6px rgba(90,74,50,0.6));}

.drag-tooltip{
  position:absolute;
  transform:translate(-50%,-140%);
  background:var(--stone);
  color:var(--bone);
  font-family:'Fredoka',sans-serif;
  font-weight:600;
  font-size:0.85rem;
  padding:4px 10px;
  border-radius:12px;
  white-space:nowrap;
  pointer-events:none;
  z-index:20;
  box-shadow:0 2px 6px rgba(90,74,50,0.3);
}

/* ── side (decorative) images: smaller, no marker layer ── */
.map-side .map-wrap{max-width:300px;}
.map-side .map-wrap img{
  display:block;
  width:100%;
  border-color:var(--pink);
  filter:drop-shadow(0 8px 12px rgba(200,148,47,0.35));
}
@media(max-width:900px){
  .map-side .map-wrap{max-width:160px;}
}

/* ── PLAYER BADGES ── */
.players{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:1.5rem;}
.player-btns{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1.5rem 2rem;justify-content:center;max-width:640px;}
@media(max-width:700px){.player-btns{grid-template-columns:1fr 1fr;max-width:340px;}}
.player-btn{display:flex;flex-direction:column;align-items:center;gap:0;text-decoration:none;
  color:var(--accent);font-family:'Yesteryear',sans-serif;letter-spacing:0.5px;transition:transform 0.3s ease;}
.player-btn:hover{transform:translateY(-4px);}
.player-img-frame{position:relative;width:150px;height:150px;margin:0 auto;}
.player-img-frame::before{content:'';position:absolute;inset:-6px;border-radius:50%;
  background:radial-gradient(circle,var(--pc-glow,var(--accent)) 0%,transparent 70%);
  opacity:0.4;filter:blur(6px);z-index:0;}
.player-img-frame .avatar{position:relative;z-index:2;width:100%;height:100%;object-fit:cover;
  border-radius:50%;border:5px solid var(--bone);}
.player-btn:hover .avatar{border-color:var(--pc,var(--accent));}
.player-badge{position:absolute;top:-3px;right:-3px;z-index:10;
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--bone);border:3.5px solid var(--pc,var(--accent));
  font-family: Courrier Prime;font-size:1.1rem;font-weight:700;color:var(--ink);}
.player-btn .pname{display:block;margin-top:10px;font-size:2rem;color:var(--accent);}

.footer-section{position:relative;z-index:2;text-align:center;padding:1.5rem 1rem 3rem;}
.rune-ornament{display:flex;align-items:center;gap:0.6rem;width:100%;max-width:18rem;margin:1rem auto;}
.rune-ornament .line{flex:1;height:1px;background:linear-gradient(to right,transparent,var(--pink),transparent);}
.rune-ornament .gem{font-size:2rem;}
.footer{font-family:'fredoka',cursive;color:var(--ink);}
.home-btn{font-family:'Cinzel',sans-serif;color:var(--accent-dim);}
</style>
</head>
<body>

<div id="bg-rune"></div>

<main class="home-layout">

  <section class="map-section map-side">
    <div class="map-wrap" id="mapWrapA">
      <img src="yesteryearA.png">
    </div>
  </section>

  <section class="map-section">
    <div class="map-wrap" id="mapWrap">
      <img src="yesteryear_map.png" alt="Yesteryear chapter map">
    </div>
    <div class="map-hint">🐄 Drag your emoji across the map to mark your progress 🐄</div>
  </section>

  <section class="map-section map-side">
    <div class="map-wrap" id="mapWrapB">
      <img src="yesteryearB.png">
    </div>
  </section>

  <section class="players">
    <div class="rune-ornament"><div class="line"></div><div class="gem">🐄</div><div class="line"></div></div>
    <div class="player-btns">
      <a class="player-btn" href="yesteryear_player.html?p=elana" style="--pc:#e9d7a0;--pc-glow:#e9d7a0;">
        <div class="player-img-frame">
          <img class="avatar" src="../pdp_elana.png" alt="Elana">
          <div class="player-badge" id="badge-elana"></div>
        </div>
        <span class="pname">Elana</span>
      </a>
      <a class="player-btn" href="yesteryear_player.html?p=lena" style="--pc:#ced8c1;--pc-glow:#ced8c1;">
        <div class="player-img-frame">
          <img class="avatar" src="../pdp_lena.png" alt="Lena">
          <div class="player-badge" id="badge-lena"></div>
        </div>
        <span class="pname">Lena</span>
      </a>
      <a class="player-btn" href="yesteryear_player.html?p=kathi" style="--pc:#d0bada;--pc-glow:#d0bada;">
        <div class="player-img-frame">
          <img class="avatar" src="../pdp_kathi.png" alt="Kathi">
          <div class="player-badge" id="badge-kathi"></div>
        </div>
        <span class="pname">Kathi</span>
      </a>
      <a class="player-btn" href="yesteryear_player.html?p=marine" style="--pc:#b2ceeb;--pc-glow:#b2ceeb;">
        <div class="player-img-frame">
          <img class="avatar" src="../pdp_marine.png" alt="Marine">
          <div class="player-badge" id="badge-marine"></div>
        </div>
        <span class="pname">Marine</span>
      </a>
    </div>
  </section>

</main>

<section class="footer-section">
  <a class="home-btn" href="../index.html"><span class="home-btn-icon">🏠</span> Home</a>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAIQTe-QGQmwqTVmIyJZZ_qlDNsD6GUskY",
  authDomain: "bingobookclub-2144e.firebaseapp.com",
  projectId: "bingobookclub-2144e",
  storageBucket: "bingobookclub-2144e.firebasestorage.app",
  messagingSenderId: "294177836341",
  appId: "1:294177836341:web:6d5f11e64737fbe3aad07c"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const BINGO_COL = 'yesteryear_bingo';

const PLAYERS = {
  elana:  { emoji:"🐉",   color:"#c9a84c", name:"Elana"  },
  lena:   { emoji:"🌙",   color:"#1f3a36", name:"Lena"   },
  kathi:  { emoji:"🍄",   color:"#24152b", name:"Kathi"  },
  marine: { emoji:"🧜‍♀️", color:"#172838", name:"Marine" },
};

const TOTAL_CHAPTERS = 62;
const CHAPTER_POS = [
  {left:8.67,top:39.50},   // Start
  {left:17.85,top:39.50}, {left:26.94,top:39.50}, {left:36.21,top:39.50}, {left:45.29,top:39.50},
  {left:54.30,top:39.50}, {left:63.48,top:39.50}, {left:72.65,top:39.50}, {left:81.31,top:39.50}, {left:89.97,top:39.50}, // 1-9
  {left:8.67,top:46.50},  {left:17.85,top:46.50}, {left:26.94,top:46.50}, {left:36.21,top:46.50}, {left:45.29,top:46.50},
  {left:54.30,top:46.50}, {left:63.48,top:46.50}, {left:72.65,top:46.50}, {left:81.31,top:46.50}, {left:89.97,top:46.50}, // 10-19
  {left:8.67,top:53.50},  {left:17.85,top:53.50}, {left:26.94,top:53.50}, {left:36.21,top:53.50}, {left:45.29,top:53.50},
  {left:54.30,top:53.50}, {left:63.48,top:53.50}, {left:72.65,top:53.50}, {left:81.31,top:53.50}, {left:89.97,top:53.50}, // 20-29
  {left:8.67,top:60.50},  {left:17.85,top:60.50}, {left:26.94,top:60.50}, {left:36.21,top:60.50}, {left:45.29,top:60.50},
  {left:54.30,top:60.50}, {left:63.48,top:60.50}, {left:72.65,top:60.50}, {left:81.31,top:60.50}, {left:89.97,top:60.50}, // 30-39
  {left:8.67,top:67.50},  {left:17.85,top:67.50}, {left:26.94,top:67.50}, {left:36.21,top:67.50}, {left:45.29,top:67.50},
  {left:54.30,top:67.50}, {left:63.48,top:67.50}, {left:72.65,top:67.50}, {left:81.31,top:67.50}, {left:89.97,top:67.50}, // 40-49
  {left:8.67,top:74.50},  {left:17.85,top:74.50}, {left:26.94,top:74.50}, {left:36.21,top:74.50}, {left:45.29,top:74.50},
  {left:54.30,top:74.50}, {left:63.48,top:74.50}, {left:72.65,top:74.50}, {left:81.31,top:74.50}, {left:89.97,top:74.50}, // 50-59
  {left:36.21,top:84.60}, {left:45.29,top:84.60}, {left:54.30,top:84.60}, // 60, 61, 62
  {left:63.48,top:84.60}, // End
];
const MAP_END_IDX = CHAPTER_POS.length-1; // 63

const mapWrap=document.getElementById('mapWrap');
const mapImg=mapWrap.querySelector('img');

window.findMapPosition = function () {
  mapImg.style.cursor = "crosshair";
  console.clear();
  console.log("Position finder ON. Click the map to print left/top percentages.");
  mapImg.addEventListener("click", function finderClick(e) {
    const rect = mapImg.getBoundingClientRect();
    const left = ((e.clientX - rect.left) / rect.width  * 100).toFixed(2);
    const top  = ((e.clientY - rect.top)  / rect.height * 100).toFixed(2);
    console.log(`{left:${left},top:${top}},`);
    const dot = document.createElement("div");
    dot.style.cssText = `position:absolute;left:${left}%;top:${top}%;width:10px;height:10px;background:red;
      border:2px solid white;border-radius:50%;transform:translate(-50%,-50%);z-index:99999;pointer-events:none;`;
    mapWrap.appendChild(dot);
  });
};

const MARKER_OFFSET={elana:{x:2,y:-2},lena:{x:2,y:2},kathi:{x:-2,y:2},marine:{x:-2,y:-2}};

const stats={};
Object.keys(PLAYERS).forEach(p=>stats[p]={chapterProgress:0,mapPos:0});

const arriveAt={};   // pid -> timestamp they reached their current tile
const curPos={};     // pid -> current tile

function clampIdx(i){return Math.max(0,Math.min(MAP_END_IDX,i));}

function renderMapMarkers(){
  Object.keys(PLAYERS).forEach(pid=>{
    if(dragging&&dragPid===pid)return;
    const p=PLAYERS[pid];
    let m=document.getElementById('mapmarker-'+pid);
    if(!m){
      m=document.createElement('div');
      m.id='mapmarker-'+pid;
      m.className='map-marker';
      m.textContent=p.emoji;
      mapWrap.appendChild(m);
    }
    const idx=clampIdx(stats[pid].mapPos??0);
    const pos=CHAPTER_POS[idx];
    const off=MARKER_OFFSET[pid]||{x:0,y:0};
    m.style.left=(pos.left+off.x)+'%';
    m.style.top=(pos.top+off.y)+'%';
  });
}

let dragging=false,dragPid=null;
function tryStartDrag(cx,cy){
  for(const pid of Object.keys(PLAYERS)){
    const m=document.getElementById('mapmarker-'+pid); if(!m) continue;
    const r=m.getBoundingClientRect();
    if(Math.hypot(cx-(r.left+r.width/2),cy-(r.top+r.height/2))<24){
      dragging=true;dragPid=pid;m.classList.add('dragging');m.style.transition='none';return;
    }
  }
}
mapWrap.addEventListener('mousedown',e=>tryStartDrag(e.clientX,e.clientY));
mapWrap.addEventListener('touchstart',e=>tryStartDrag(e.touches[0].clientX,e.touches[0].clientY),{passive:true});

function nearestIdx(cx,cy){
  const rect=mapImg.getBoundingClientRect();
  const xp=(cx-rect.left)/rect.width*100, yp=(cy-rect.top)/rect.height*100;
  let best=0,bestD=Infinity;
  CHAPTER_POS.forEach((p,i)=>{
    const d=Math.hypot(xp-p.left,yp-p.top);
    if(d<=bestD){bestD=d;best=i;}
  });
  return best;
}

function labelForIdx(idx){
  if(idx===0) return "Start";
  if(idx===MAP_END_IDX) return "End";
  return "Chapter "+idx;
}

function onMove(cx,cy){
  if(!dragging||!dragPid)return;
  const m=document.getElementById('mapmarker-'+dragPid); if(!m)return;
  const rect=mapImg.getBoundingClientRect();
  const xp=Math.min(Math.max((cx-rect.left)/rect.width*100,2),98);
  const yp=Math.min(Math.max((cy-rect.top)/rect.height*100,2),98);
  m.style.left=xp+'%';m.style.top=yp+'%';

  const idx=nearestIdx(cx,cy);
  let tip=document.getElementById('drag-tooltip');
  if(!tip){
    tip=document.createElement('div');
    tip.id='drag-tooltip';
    tip.className='drag-tooltip';
    mapWrap.appendChild(tip);
  }
  tip.textContent=labelForIdx(idx);
  tip.style.left=xp+'%';
  tip.style.top=yp+'%';
}

window.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
window.addEventListener('touchmove',e=>onMove(e.touches[0].clientX,e.touches[0].clientY),{passive:true});

async function endDrag(cx,cy){
  if(!dragging)return;
  const pid=dragPid;
  dragging=false;dragPid=null;
  const tip=document.getElementById('drag-tooltip');
  if(tip) tip.remove();
  const idx=nearestIdx(cx,cy);
  const tileChanged=curPos[pid]==null||Number(curPos[pid])!==Number(idx);
  stats[pid].mapPos=idx;
  curPos[pid]=idx;
  if(tileChanged)arriveAt[pid]=Date.now();
  renderMapMarkers();
  const payload={mapPos:idx};
  if(tileChanged)payload.mapPosAt=arriveAt[pid];
  try{await setDoc(doc(db,BINGO_COL,pid),payload,{merge:true});}catch(err){console.error(err);}
}
window.addEventListener('mouseup',e=>endDrag(e.clientX,e.clientY));
window.addEventListener('touchend',e=>endDrag(e.changedTouches[0].clientX,e.changedTouches[0].clientY));

onSnapshot(collection(db,BINGO_COL),snap=>{
  snap.forEach(d=>{
    if(!PLAYERS[d.id]) return;
    const data=d.data();
    const chapterProgress=Number(data.chapterProgress||0);
    const mapPos=(data.mapPos!=null)?Number(data.mapPos):chapterProgress;
    stats[d.id]={ chapterProgress, mapPos };
    if(!(dragging&&dragPid===d.id)){
      curPos[d.id]=mapPos;
      arriveAt[d.id]=(data.mapPosAt!=null)?Number(data.mapPosAt):0;
    }
    const badge=document.getElementById('badge-'+d.id);
    if(badge) badge.textContent = data.points ?? 0;
  });
  renderMapMarkers();
},err=>console.error(err));

renderMapMarkers();
</script>

</body>
</html>
