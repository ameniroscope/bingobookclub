<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Yesteryear&display=swap" rel="stylesheet">
<style>
:root{
  /* text */
  --ink:#5a4a32;         /* body text */
  --ink-faded:#a89a7c;   /* muted / captions */

  /* surfaces */
  --bg-mid:#f7edc9;      /* page background */
  --bg-deep:#fdf6e3;
  --bone:#fffaf0;        /* cards, modals, buttons */

  /* teal accent */
  --accent:#396765;      /* marks, unread dot */
  --accent-lt:#b8d1a3;
  --accent-dim:#c8942f;  /* gold — buttons, titles, room borders */

  /* warm neutrals */
  --stone:#e6a822;       /* amber */
  --stone-dk:#e0d0a6;    /* subtle borders */
  --stone-lt:#f5ecd2;    /* pale — panel / bubble backgrounds */

  /* coral highlight */
  --pink:#eb7357;        /* avatar ring */

  /* per-player (overridden by JS from Firebase) */
  --player:#c9a84c;
  --player-glow:rgba(201,168,76,0.25);

  --num-font:'Courier Prime','Courier New',Courier,monospace;
}
body{background:var(--bg-mid)!important;}
*{font-family:var(--num-font)!important;}
.home-btn,.home-btn *{font-family:'Cinzel',serif!important;}
html,body{color:var(--ink);font-family:var(--num-font);}
#bg-rune{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg-mid) url('yesteryear_back.png') center/cover no-repeat;filter:saturate(0.7);}
.stars{display:none;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* ── TOP-RIGHT: back to Yesteryear main page ── */
.players-btn{background:var(--bone);color:var(--accent-dim);border:1px solid var(--stone-dk);box-shadow:0 2px 10px rgba(200,148,47,0.15);
  font-family:'Yesteryear',cursive!important;text-transform:none;font-size:1.2rem;letter-spacing:0.5px;}
.players-btn:hover{border-color:var(--accent-dim);background:var(--bone);box-shadow:0 2px 14px rgba(200,148,47,0.25);}

.player-header{display:flex;flex-direction:column;align-items:center;gap:0.6rem;position:relative;z-index:1;padding:2.2rem 1rem 0.5rem;}
.img-frame{position:relative;width:110px;height:110px;}
.img-frame img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid var(--pink);}
.player-name{font-family:'Yesteryear',cursive!important;font-size:2.7rem;font-weight:400;color:var(--accent);letter-spacing:0.5px;line-height:1.1;}

/* 2/3 bingo — 1/3 rooms on desktop */
.wrap{position:relative;z-index:1;max-width:1300px;margin:0 auto;padding:1.5rem 2rem 4rem;
  display:grid;grid-template-columns:2fr 1fr;gap:3rem;align-items:start;}
@media(max-width:860px){.wrap{grid-template-columns:1fr;gap:2.5rem;padding:1.5rem 1.2rem 3rem;}}

.section-title{font-family:'Yesteryear',sans-serif!important;font-weight:600;font-size:2.5rem;letter-spacing:2px;color:var(--accent-dim);text-align:center;margin-bottom:1rem;}

.points-line{display:flex;flex-direction:column;align-items:flex-start;gap:0.1rem;width:100%;max-width:620px;margin:0.1rem auto 0.9rem;padding-left:5px;
  font-family:'Yesteryear',sans-serif;letter-spacing:0.5px;color:var(--ink);}
.points-line .pts-row{display:flex;align-items:baseline;gap:0.4rem;}
.points-line .pts-total{font-family:var(--num-font);font-size:1.6rem;font-weight:700;color:var(--accent-dim);}
.points-line .pts-label{font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--ink-faded);}
.points-line .pts-break{display:block;width:100%;font-size:0.85rem;color:var(--ink-faded);font-style:italic;font-family:'Yesteryear',cursive;letter-spacing:0;}

.bingo-controls{position:absolute;left:-52px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:0.5rem;z-index:3;}
.bingo-lock-btn{background:var(--bone);border:1px solid var(--stone-dk);border-radius:50%;width:38px;height:38px;cursor:pointer;
  font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s;padding:0;}
.bingo-lock-btn:hover{border-color:var(--accent-dim);}
.bingo-lock-btn.unlocked{border-color:var(--accent-dim);background:rgba(200,148,47,0.08);}

.bingo-card-wrap{position:relative;width:100%;max-width:620px;margin:0 auto;aspect-ratio:2046/3074;
  background-image:url('yesteryear_bingo.png');background-size:contain;background-repeat:no-repeat;
  background-position:center top;box-shadow:0 8px 24px rgba(200,148,47,0.2);border:3px double var(--pink);border-radius:0;}
.bingo-card-wrap>*{position:absolute;}
.bingo-grid{position:absolute; left: 50%; top: 29.4%; width: 79%;;aspect-ratio:1/1;transform:translateX(-50%);display:grid;
  grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);}
.bingo-cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:clamp(7px,1.3vw,13px);
  line-height:1.2;text-align:center;padding:2px;overflow:hidden;cursor:pointer;transition:background 0.15s;border-radius:6px;}
.bingo-cell.marked{background:rgba(235,115,87,0.18);box-shadow:inset 0 0 0 1px rgba(235,115,87,0.4);}
.bingo-cell.free{font-weight:600;color:var(--accent-dim);cursor:default;}
.cell-text{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:'Yesteryear',cursive;font-size:inherit;line-height:1.2;color:var(--pink);padding:2px;overflow-wrap:break-word;word-break:break-word;}
.bingo-cell textarea{width:100%;height:100%;border:none;background:rgba(57,103,101,0.1);outline:none;resize:none;
  text-align:center;font-family:'Yesteryear',cursive;font-size:inherit;line-height:1.2;color:var(--ink);padding:2px;overflow:hidden;overflow-wrap:break-word;word-break:break-word;}
.bingo-hint{font-size:0.95rem;color:var(--ink-faded);margin-top:8px;font-style:italic;text-align:center;}
.bingo-status{font-size:0.85rem;color:var(--ink-faded);font-style:italic;text-align:center;margin-top:4px;min-height:1em;}

/* ── ROOMS ── */
.rooms-col{display:flex;flex-direction:column;justify-content:center;align-self:center;}
.legend{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;color:var(--ink-faded);font-size:0.85rem;margin-bottom:1rem;}
.legend span{display:flex;align-items:center;gap:0.35rem;}
.legend .dot{width:11px;height:11px;border-radius:50%;display:inline-block;}
.legend .dot.unlocked{background:rgba(200,148,47,0.15);border:1px solid var(--accent-dim);}
.legend .dot.locked{background:var(--stone-lt);border:1px solid var(--stone-dk);}
.rooms-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.room-btn{position:relative;height:58px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all 0.2s;font-family:'Yesteryear',sans-serif;font-size:1rem;letter-spacing:0.3px;text-align:center;padding:0 0.5rem;}
.room-btn:hover{transform:translateY(-2px);}
.room-btn.unlocked{background:rgba(200,148,47,0.1);border: 3px double var(--pink);}
.room-btn.unlocked:hover{background:rgba(200,148,47,0.18);}
.room-btn.locked{background:var(--stone-lt);border: 3px double var(--pink);}
.room-btn.locked:hover{border-color:var(--pink);}
.room-btn .lock-ico{position:absolute;top:6px;right:6px;font-size:1rem;opacity:0.5;}
.room-btn .unread-dot{position:absolute;top:6px;left:8px;width:8px;height:8px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 6px rgba(57,103,101,0.7);display:none;}
.room-btn.has-unread .unread-dot{display:block;}

/* ── CHAT MODAL ── */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(90,74,50,0.55);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  padding:1rem;padding-bottom:max(1rem,env(safe-area-inset-bottom));
  opacity:0;pointer-events:none;transition:opacity 0.2s;}
.overlay.open{opacity:1;pointer-events:all;}
.chat-modal{background:var(--bone);border:3px double var(--pink);border-radius:0;width:100%;max-width:600px;
  height:80vh;height:80dvh;max-height:80vh;max-height:80dvh;
  display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(90,74,50,0.3);
  transform:translateY(12px);transition:transform 0.2s;overflow:hidden;}
.overlay.open .chat-modal{transform:translateY(0);}
.chat-hdr{flex-shrink:0;padding:1rem 1.25rem;border-bottom:1px solid var(--stone-lt);
  display:flex;align-items:flex-start;justify-content:space-between;gap:0.5rem;}
.chat-room-label{font-family:'Yesteryear',sans-serif;font-size:0.68rem;letter-spacing:1.5px;color:var(--ink-faded);text-transform:uppercase;}
.chat-title{font-family:'Yesteryear',sans-serif;font-size:1.2rem;font-weight:600;color:var(--ink);letter-spacing:0.5px;}
.chat-status{display:inline-block;margin-top:5px;font-family:'Yesteryear',sans-serif;font-size:0.6rem;letter-spacing:1px;padding:0.22rem 0.6rem;border-radius:6px;text-transform:uppercase;}
.chat-status.unlocked{background:rgba(235,115,87,0.15);color:var(--pink);border:1px solid var(--pink);}
.chat-status.locked{background:rgba(235,115,87,0.12);color:var(--pink);border:1px solid var(--pink);}
.close-btn{background:none;border:none;cursor:pointer;color:var(--ink-faded);font-size:1.5rem;line-height:1;padding:0.1rem;transition:color 0.15s;flex-shrink:0;}
.close-btn:hover{color:var(--ink);}
.messages{flex:1;min-height:0;overflow-y:auto;padding:1rem 1.2rem;display:flex;flex-direction:column;gap:0.7rem;}
.empty-msg,.write-note{font-size:1rem;color:var(--ink-faded);font-style:italic;text-align:center;margin:auto;line-height:1.8;}
.write-note strong{display:block;font-family:'Yesteryear',sans-serif;font-size:0.85rem;font-style:normal;letter-spacing:1px;margin-bottom:0.3rem;color:var(--ink);text-transform:uppercase;}
.msg{display:flex;flex-direction:column;gap:0.15rem;align-items:flex-start;}
.msg.mine{align-items:flex-end;}
.msg-name{display:block;font-family:'Yesteryear',sans-serif;font-size:0.75rem;letter-spacing:0.5px;color:var(--ink-faded);}
.msg-text{display:block;font-family:'Yesteryear',cursive;font-size:1.05rem;color:#fffaf0;line-height:1.5;
  max-width:min(85%,420px);background:var(--stone-lt);border:1px solid var(--stone-dk);
  padding:0.5rem 0.75rem;border-radius:12px;word-break:break-word;}
.msg.mine .msg-text{background:var(--player);border-color:var(--player);color:var(--bone);}
.compose{flex-shrink:0;border-top:1px solid var(--stone-lt);padding:0.7rem 1rem;
  padding-bottom:max(0.7rem,env(safe-area-inset-bottom));display:flex;gap:0.5rem;align-items:flex-end;}
.compose textarea{flex:1;resize:none;min-height:42px;max-height:110px;background:var(--stone-lt);border:1px solid var(--stone-dk);
  border-radius:10px;padding:0.5rem 0.7rem;font-family:'Yesteryear',cursive;font-size:1rem;color:var(--ink);line-height:1.5;}
.compose textarea::placeholder{color:var(--ink-faded);font-style:italic;}
.compose textarea:focus{outline:none;border-color:var(--pink);}
.send-btn{height:42px;padding:0 1.1rem;background:var(--pink);border:1px solid var(--pink);border-radius:10px;color:var(--bone);
  font-family:'Yesteryear',sans-serif;font-size:0.7rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;white-space:nowrap;flex-shrink:0;}
.send-btn:hover{opacity:0.85;}

/* ── PASSWORD MODAL ── */
.lock-modal-wrap{display:none;position:fixed;inset:0;z-index:400;background:transparent;align-items:center;justify-content:center;flex-direction:column;padding:2rem;text-align:center;}
.lock-modal-wrap.open{display:flex;}
.lock-club{font-family:'Yesteryear',sans-serif;font-size:0.7rem;letter-spacing:4px;color:var(--ink-faded);text-transform:uppercase;margin-bottom:0.4rem;}
.lock-title{font-family:'Yesteryear',sans-serif!important;font-size:clamp(1.6rem,5vw,2.4rem);font-weight:700;color:var(--accent);letter-spacing:0.5px;margin-bottom:1.6rem;}
.lock-modal-wrap input{width:min(320px,90vw);height:52px;text-align:center;font-family:'Yesteryear',sans-serif;font-size:1rem;letter-spacing:1px;
  background:var(--bone);border:1px solid var(--stone-dk);border-radius:10px;color:var(--ink);margin-bottom:1rem;}
.lock-modal-wrap input:focus{outline:none;border-color:var(--accent-dim);}
.lock-modal-wrap button{width:min(320px,90vw);height:52px;cursor:pointer;font-family:'Yesteryear',sans-serif; font-size: 1.3rem;text-transform:uppercase;letter-spacing:2px;
  background:var(--accent-dim);border:1px solid var(--accent-dim);border-radius:10px;color:var(--bone);transition:all 0.25s ease;}
.lock-modal-wrap button:hover{opacity:0.85;}
.lock-error{color:#c0504a;font-size:0.9rem;min-height:1.2rem;margin-top:0.8rem;letter-spacing:0.5px;}

/* ── UNKNOWN PLAYER ── */
.unknown-wrap{display:none;position:fixed;inset:0;z-index:400;background:transparent;align-items:center;justify-content:center;flex-direction:column;gap:1rem;padding:2rem;text-align:center;}
.unknown-wrap.open{display:flex;}

@media(max-width:860px){
  .home-btn{top:1rem;left:1rem;bottom:auto;font-size:0.62rem;padding:0.5rem 0.8rem;}
  .rooms-grid{grid-template-columns:repeat(2,1fr);}
  .bingo-controls{position:static;flex-direction:row;left:auto;top:auto;transform:none;justify-content:center;margin-bottom:0.7rem;}
}
@media(max-width:600px){
  .overlay{padding:0;align-items:flex-end;}
  .chat-modal{height:92vh;height:92dvh;max-height:92vh;max-height:92dvh;border-radius:0;}
  .msg-text{max-width:90%;}
}
</style>
</head>
<body>

<div id="bg-rune"></div>

<!-- UNKNOWN PLAYER FALLBACK -->
<div class="unknown-wrap" id="unknownWrap">
  <div style="font-family:'Yesteryear',sans-serif;font-size:1.2rem;color:var(--accent-dim);">Who goes there? 🌾</div>
  <div style="color:var(--ink-faded);font-size:0.95rem;">No player found. Go back and choose your avatar.</div>
  <a href="yesteryear.html" style="margin-top:1rem;font-family:'Yesteryear',sans-serif;font-size:0.85rem;letter-spacing:1px;color:var(--accent-dim);text-decoration:none;border:1px solid var(--accent-dim);padding:0.6rem 1.2rem;border-radius:8px;">← Back</a>
</div>

<!-- PASSWORD MODAL -->
<div class="lock-modal-wrap open" id="initialLockModal">
  <div class="lock-club">The Bingo Book Club</div>
  <div class="lock-title" id="lockTitle">Enter Your Code</div>
  <input type="text" id="initialPasswordInput" placeholder="password" autocomplete="off">
  <button id="initialUnlockSubmit" type="button">Enter</button>
  <div class="lock-error" id="initialLockError"></div>
</div>

<div id="mainContent" style="display:none;">

  <!-- TOP-RIGHT: back to Yesteryear main page -->
  <a href="yesteryear.html" class="players-btn">🐄 Yesteryear</a>

  <!-- BOTTOM-LEFT: home -->
  <a href="../index.html" class="home-btn">🏠 Home</a>

<div class="player-header">
  <div class="img-frame"><img id="playerPhoto" src="" alt="Player Photo"></div>
  <div class="player-name" id="playerHeaderName"></div>
</div>

<div class="wrap">
  <div class="bingo-section">
    <div class="points-line">
      <div class="pts-row"><span class="pts-total" id="ptsTotal">0</span><span class="pts-label">pts</span></div>
      <span class="pts-break" id="ptsBreak"></span>
    </div>
    <div class="bingo-card-wrap">
      <div class="bingo-controls">
        <button class="bingo-lock-btn unlocked" id="bingoEditBtn" title="Toggle edit mode">✏️</button>
      </div>
      <div class="bingo-grid" id="bingoGrid"></div>
    </div>
    <div class="bingo-hint" id="bingoHint">Click squares to mark them</div>
    <div class="bingo-status" id="bingoStatus"></div>
  </div>

  <div class="rooms-col">
    <div class="section-title">Chapter Rooms</div>
    <div class="legend">
      <span><i class="dot locked"></i> Locked : post only, no spoilers !</span>
      <span><i class="dot unlocked"></i> Unlocked : read &amp; post</span>
    </div>
    <div class="rooms-grid" id="roomsGrid"></div>
  </div>
</div>
</div>

<!-- CHAT MODAL -->
<div class="overlay" id="overlay">
  <div class="chat-modal">
    <div class="chat-hdr">
      <div>
        <div class="chat-room-label" id="chatRoomLabel"></div>
        <div class="chat-title" id="chatTitle"></div>
        <span class="chat-status" id="chatStatus"></span>
      </div>
      <button class="close-btn" id="chatClose">✕</button>
    </div>
    <div class="messages" id="chatMessages"></div>
    <div class="compose">
      <textarea id="chatTA" rows="1" placeholder="Leave a thought…"></textarea>
      <button class="send-btn" id="chatSend">Post</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, onSnapshot, doc, setDoc, getDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const CHAPTER_GROUPS = [
  { label:"Ch 1 – 8",   first:1,  last:8,  unlock:8  },
  { label:"Ch 9 – 16",  first:9,  last:16, unlock:16 },
  { label:"Ch 17 – 24", first:17, last:24, unlock:24 },
  { label:"Ch 25 – 32", first:25, last:32, unlock:32 },
  { label:"Ch 33 – 40", first:33, last:40, unlock:40 },
  { label:"Ch 41 – 48", first:41, last:48, unlock:48 },
  { label:"Ch 49 – 56", first:49, last:56, unlock:56 },
  { label:"Ch 57 – 62", first:57, last:62, unlock:62 },
];

const POINTS_PER_CELL = 1;
const POINTS_PER_LINE = 5;

const fb = initializeApp({
  apiKey:"AIzaSyAIQTe-QGQmwqTVmIyJZZ_qlDNsD6GUskY",
  authDomain:"bingobookclub-2144e.firebaseapp.com",
  projectId:"bingobookclub-2144e",
  storageBucket:"bingobookclub-2144e.firebasestorage.app",
  messagingSenderId:"294177836341",
  appId:"1:294177836341:web:6d5f11e64737fbe3aad07c"
});
const db = getFirestore(fb);

/* ════════ ALL PLAYER CONFIGS (Firestore: accessCodes collection, doc id = pid) ════════ */
const PLAYERS = {};
try {
  const accessSnap = await getDocs(collection(db,'accessCodes'));
  accessSnap.forEach(d => PLAYERS[d.id] = d.data());
} catch (e) {
  console.error(e);
  document.getElementById('initialLockError').textContent = 'Connection error — please refresh the page';
  throw e;
}
/* ═══════════════════════════════════════════════════════════════════════════════════ */

/* ── RESOLVE PLAYER FROM URL ── */
const params = new URLSearchParams(window.location.search);
const PID = params.get('p') || '';
const PCFG = PLAYERS[PID];

if(!PCFG){
  document.getElementById('initialLockModal').classList.remove('open');
  document.getElementById('unknownWrap').classList.add('open');
  throw new Error('Unknown player: '+PID);
}

const { name:PNAME, emoji:PEMOJI, color:PCOLOR, password:PASSWORD } = PCFG;

function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}
document.documentElement.style.setProperty('--player',PCOLOR);
document.documentElement.style.setProperty('--player-glow',hexA(PCOLOR,0.25));
const frame=document.querySelector('.img-frame');
if(frame){frame.style.setProperty('--ring',hexA(PCOLOR,0.2));frame.style.setProperty('--ring-bright',hexA(PCOLOR,0.55));}

document.title=`${PNAME} – Yesteryear`;
document.getElementById('playerHeaderName').textContent=PNAME;
document.getElementById('playerPhoto').src='../pdp_'+PID+'.png';
document.getElementById('lockTitle').textContent=`Enter Your Code, ${PNAME}`;

/* ── PASSWORD GATE ── */
const initialLockModal=document.getElementById('initialLockModal');
const initialPasswordInput=document.getElementById('initialPasswordInput');
const initialUnlockSubmit=document.getElementById('initialUnlockSubmit');
const initialLockError=document.getElementById('initialLockError');
const mainContent=document.getElementById('mainContent');

function checkInitialPassword(){
  if(initialPasswordInput.value.trim()===PASSWORD){
    initialLockModal.classList.remove('open');
    mainContent.style.display='block';
    init();
  }else{
    initialLockError.textContent='Incorrect password';
    initialPasswordInput.value='';initialPasswordInput.focus();
  }
}
initialUnlockSubmit.addEventListener('click',checkInitialPassword);
initialPasswordInput.addEventListener('keydown',e=>{if(e.key==='Enter')checkInitialPassword();});

/* ── BINGO ── */
const GRID_SIZE=25;
let cells=Array(GRID_SIZE).fill('');
let markedSet=new Set([12]);
let isEditMode=false,isSaving=false;

const bingoGrid=document.getElementById('bingoGrid'),
      bingoHint=document.getElementById('bingoHint'),
      bingoStatus=document.getElementById('bingoStatus'),
      editBtn=document.getElementById('bingoEditBtn');

editBtn.addEventListener('click',()=>{
  isEditMode=!isEditMode;
  editBtn.textContent=isEditMode?'👁️':'✏️';
  editBtn.title=isEditMode?'Switch to play mode':'Switch to edit mode';
  bingoHint.textContent=isEditMode?'Edit mode — type in squares':'Click squares to mark them';
  renderBingo();
});

function countLines(){
  let lines=0;
  for(let r=0;r<5;r++)if([0,1,2,3,4].every(c=>markedSet.has(r*5+c)))lines++;
  for(let c=0;c<5;c++)if([0,1,2,3,4].every(r=>markedSet.has(r*5+c)))lines++;
  if([0,1,2,3,4].every(i=>markedSet.has(i*5+i)))lines++;
  if([0,1,2,3,4].every(i=>markedSet.has(i*5+(4-i))))lines++;
  return lines;
}
function calcPoints(){
  let cellCount=0;
  markedSet.forEach(i=>{if(i!==12)cellCount++;});
  return cellCount*POINTS_PER_CELL+countLines()*POINTS_PER_LINE;
}
function renderPoints(){
  let cellCount=0;
  markedSet.forEach(i=>{if(i!==12)cellCount++;});
  const lines=countLines();
  document.getElementById('ptsTotal').textContent=calcPoints();
  document.getElementById('ptsBreak').textContent=
    `${cellCount} cell${cellCount===1?'':'s'} + ${lines} line${lines===1?'':'s'}`;
}
function renderBingo(){
  bingoGrid.innerHTML='';
  for(let i=0;i<GRID_SIZE;i++){
    const isFree=i===12;
    const cell=document.createElement('div');
    cell.className='bingo-cell'+(isFree?' free':markedSet.has(i)?' marked':'');
    if(isFree){cell.style.cursor='default';}
    else if(isEditMode){
      const ta=document.createElement('textarea');
      ta.value=cells[i];
      ta.addEventListener('input',e=>{cells[i]=e.target.value;});
      ta.addEventListener('blur',saveBingo);
      cell.appendChild(ta);
    }else{
      const txt=document.createElement('div');txt.className='cell-text';txt.textContent=cells[i];cell.appendChild(txt);
      cell.style.cursor='pointer';
      cell.addEventListener('click',async()=>{
        markedSet.has(i)?markedSet.delete(i):markedSet.add(i);
        renderBingo();await saveBingo();
      });
    }
    bingoGrid.appendChild(cell);
  }
  renderPoints();
}
async function saveBingo(){
  if(isSaving)return;isSaving=true;bingoStatus.textContent='Saving…';
  try{
    await setDoc(doc(db,'yesteryear_bingo',PID),{
      cells,marked:[...markedSet],points:calcPoints(),lines:countLines(),name:PNAME,emoji:PEMOJI
    },{merge:true});
    bingoStatus.textContent='Saved ✓';
  }catch(e){console.error(e);bingoStatus.textContent='Save failed';}
  finally{isSaving=false;setTimeout(()=>{bingoStatus.textContent='';},2000);}
}
async function loadBingo(){
  bingoStatus.textContent='Loading…';
  try{
    const d=await getDoc(doc(db,'yesteryear_bingo',PID));
    if(d.exists()){
      const data=d.data();
      if(Array.isArray(data.cells))cells=data.cells;
      if(Array.isArray(data.marked)){
        markedSet=new Set(data.marked.filter(v=>typeof v==='number'&&Number.isInteger(v)&&v>=0&&v<=24));
        markedSet.add(12);
      }
    }
  }catch(e){console.error(e);}
  renderBingo();bingoStatus.textContent='';
}

/* ── PROGRESS + ROOMS ── */
let myProgress=0,activeRoom=null,activeUnsub=null;

const STORAGE_KEY=`yy_lastread_${PID}`;
function getLastRead(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');}catch{return {};}}
function setLastRead(groupFirst){
  const lr=getLastRead();
  lr[groupFirst]=Math.floor(Date.now()/1000);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(lr));
}

const unreadGroups=new Set();

function init(){
  loadBingo();
  onSnapshot(doc(db,'yesteryear_bingo',PID),d=>{
    if(d.exists()){const dd=d.data();myProgress=Number(dd.mapPos??dd.chapterProgress??0);}
    renderRooms();
  },err=>console.error(err));

  onSnapshot(collection(db,'yesteryear_messages'),snap=>{
    const lr=getLastRead();
    unreadGroups.clear();
    snap.forEach(d=>{
      const m=d.data();
      if(!m.ts||!m.ts.seconds)return;
      const ch=Number(String(m.chapter).replace(/chapter-?/i,'').replace(/chap/i,'').trim());
      const grp=CHAPTER_GROUPS.find(g=>ch>=g.first&&ch<=g.last);
      if(!grp)return;
      if(myProgress<grp.unlock)return;
      const lastSeen=lr[grp.first]||0;
      if(m.ts.seconds>lastSeen&&m.name!==PNAME&&m.name!==PID){
        unreadGroups.add(grp.first);
      }
    });
    renderRooms();
  },err=>console.error(err));
}

const roomsGrid=document.getElementById('roomsGrid');
function renderRooms(){
  roomsGrid.innerHTML='';
  CHAPTER_GROUPS.forEach(grp=>{
    const unlocked=myProgress>=grp.unlock;
    const hasUnread=unlocked&&unreadGroups.has(grp.first);
    const btn=document.createElement('div');
    btn.className='room-btn '+(unlocked?'unlocked':'locked')+(hasUnread?' has-unread':'');
    btn.innerHTML=`<span class="unread-dot"></span>`
      +(unlocked?'':'<span class="lock-ico">🔒</span>')
      +grp.label;
    btn.addEventListener('click',()=>openChat(grp));
    roomsGrid.appendChild(btn);
  });
}

/* ── CHAT ── */
const overlay=document.getElementById('overlay'),
      chatClose=document.getElementById('chatClose'),
      chatTA=document.getElementById('chatTA'),
      chatSend=document.getElementById('chatSend');

function openChat(grp){
  activeRoom=grp;
  const canRead=myProgress>=grp.unlock;
  document.getElementById('chatRoomLabel').textContent='Chapter Room';
  document.getElementById('chatTitle').textContent=grp.label;
  const st=document.getElementById('chatStatus');
  st.className='chat-status '+(canRead?'unlocked':'locked');
  st.textContent=canRead?'Unlocked — all messages visible':'Write only';
  overlay.classList.add('open');document.body.style.overflow='hidden';
  chatTA.value='';chatTA.style.height='auto';
  setLastRead(grp.first);
  unreadGroups.delete(grp.first);
  renderRooms();
  subscribeChat(grp);
}
function closeChat(){
  overlay.classList.remove('open');document.body.style.overflow='';
  if(activeUnsub){activeUnsub();activeUnsub=null;}activeRoom=null;
}
chatClose.addEventListener('click',closeChat);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeChat();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closeChat();});
chatTA.addEventListener('input',()=>{chatTA.style.height='auto';chatTA.style.height=chatTA.scrollHeight+'px';});
chatTA.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
chatSend.addEventListener('click',sendMsg);

function msgInGroup(m,grp){
  const n=Number(String(m.chapter).replace(/chapter-?/i,'').replace(/chap/i,'').trim());
  return n>=grp.first&&n<=grp.last;
}

function subscribeChat(grp){
  if(activeUnsub)activeUnsub();
  const msgDiv=document.getElementById('chatMessages');
  msgDiv.innerHTML='<span class="empty-msg">Loading…</span>';
  activeUnsub=onSnapshot(collection(db,'yesteryear_messages'),snap=>{
    const canRead=myProgress>=grp.unlock;
    let msgs=[];
    snap.forEach(d=>{const m=d.data();if(msgInGroup(m,grp))msgs.push(m);});
    msgs.sort((a,b)=>(a.ts?.seconds||0)-(b.ts?.seconds||0));
    if(!canRead)msgs=msgs.filter(m=>m.name===PNAME||m.name===PID);
    msgDiv.innerHTML='';
    if(msgs.length===0){
      msgDiv.innerHTML=(!canRead)
        ?`<div class="write-note"><strong>Write mode</strong>Post freely — you'll see everyone's thoughts once you reach chapter ${grp.unlock}.</div>`
        :`<span class="empty-msg">No thoughts yet. Be the first!</span>`;
      return;
    }
    msgs.forEach(m=>{
      const isMine=m.name===PNAME||m.name===PID;
      const pid=Object.keys(PLAYERS).find(k=>PLAYERS[k].name===m.name||k===m.name);
      const info=pid?PLAYERS[pid]:null;
      const emoji=info?info.emoji:'✦';
      const name=info?info.name:String(m.name||'?');
      const color=info?info.color:'#e0d0a6';
      const el=document.createElement('div');
      el.className='msg'+(isMine?' mine':'');
      el.innerHTML=`<span class="msg-name">${emoji} ${esc(name)}</span>`
        +`<span class="msg-text" style="${isMine?`background:${PCOLOR};border-color:${PCOLOR};color:#fffaf0`:`background:${color};border-color:${color}44`}">${esc(String(m.text||''))}</span>`;
      msgDiv.appendChild(el);
    });
    msgDiv.scrollTop=msgDiv.scrollHeight;
  },err=>{
    msgDiv.innerHTML=`<span class="empty-msg">Could not load messages: ${esc(err.message)}</span>`;
  });
}

async function sendMsg(){
  const text=chatTA.value.trim();
  if(!text||activeRoom===null)return;
  try{
    await addDoc(collection(db,'yesteryear_messages'),{
      chapter:activeRoom.first,name:PNAME,text,ts:serverTimestamp()
    });
    chatTA.value='';chatTA.style.height='auto';
    setLastRead(activeRoom.first);
  }catch(e){console.error(e);}
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
</script>
