:root{
  --bg:#0e0b10; --bg-2:#1a141d; --card:#221a26; --ink:#e9dfd0; --ink-soft:#a99aa6;
  --blood:#8b1a2b; --blood-hi:#b3263c; --gold:#c9a45c; --line:rgba(201,164,92,.25);
  --black:'Cattedrale','Old English Text MT',Georgia,serif;
  --body:'Metamorphous',Georgia,serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; min-height:100vh; color:var(--ink); font-family:var(--body); font-size:.8rem; line-height:1.5;
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(139,26,43,.35), transparent 60%),
    radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.8), transparent 60%);
  background-attachment:fixed;
}
.wrap{max-width:1100px;margin:0 auto;padding:36px 16px 70px}
header{text-align:center;position:relative}
h1{font-family:var(--black);font-weight:400;font-size:clamp(2.8rem,9vw,5rem);line-height:1;margin:0;color:var(--ink);
   text-shadow:0 0 18px rgba(179,38,60,.55), 0 2px 0 #000}
.here{position:absolute;top:4px;right:6%;display:flex;flex-direction:column;align-items:center;text-align:center}
.here .me{font-size:2.8rem;line-height:1;width:64px;height:64px;display:grid;place-items:center;border-radius:50%;
          background:var(--card);border:1px solid var(--gold);box-shadow:0 0 16px rgba(139,26,43,.55)}
.here button{background:none;border:0;color:var(--ink-soft);font:inherit;font-size:.8rem;font-style:italic;text-decoration:underline;cursor:pointer;padding:0;margin-top:4px}
.here button:hover{color:var(--gold)}
@media (max-width:600px){.here{position:static;margin-top:12px}.here .me{width:48px;height:48px;font-size:2rem}}
.whos{text-align:center;margin:50px 0}
.whos h2{font-family:var(--body);font-weight:400;font-size:1.6rem;color:var(--gold);margin:0 0 26px}
.pick{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
.pick button{font:inherit;font-size:.8rem;color:var(--ink);cursor:pointer;width:160px;padding:22px 10px 16px;border-radius:4px;
             background:var(--card);border:1px solid var(--line);box-shadow:0 6px 16px rgba(0,0,0,.6)}
.pick button span{display:block;font-size:3.6rem;line-height:1.1;margin-bottom:6px}
.pick button:hover{border-color:var(--gold);box-shadow:0 0 18px rgba(139,26,43,.6)}
.flourish{color:var(--gold);letter-spacing:.6em;margin:10px 0 0;font-size:.95rem}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:30px 0 26px}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;border-bottom:1px solid var(--line);width:100%;padding-bottom:0;margin-bottom:6px}
.tabs button{font:inherit;font-size:.8rem;background:none;border:0;color:var(--ink-soft);padding:6px 14px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
.tabs small{opacity:.7;font-size:.8rem;margin-left:3px}
.btn{font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;border-radius:3px;padding:8px 20px;
     background:var(--blood);color:var(--ink);border:1px solid var(--blood-hi);box-shadow:0 0 14px rgba(139,26,43,.45)}
.btn:hover{background:var(--blood-hi)}
.btn.ghost{background:none;border-color:var(--line);box-shadow:none;color:var(--ink-soft);font-weight:400}
.btn.ghost:hover{color:var(--ink);border-color:var(--gold)}
input[type=search],input[type=text]{font:inherit;color:var(--ink);background:var(--bg-2);border:1px solid var(--line);border-radius:3px;padding:7px 12px;width:100%}
input[type=search]{max-width:260px}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:26px 18px;align-items:start}
.book{display:block;width:100%;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit;font:inherit}
.frame{position:relative}
.cover{aspect-ratio:2/3;width:100%;border-radius:2px;overflow:hidden;position:relative;
       background:linear-gradient(160deg,#2d2030,#140f17);border:1px solid var(--line);
       box-shadow:0 6px 16px rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:center;padding:12px;text-align:center}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:-11px;z-index:1;width:30px;height:30px;display:grid;place-items:center;font-size:1.05rem;
       border-radius:50%;background:rgba(14,11,16,.82);border:1px solid var(--gold);box-shadow:0 2px 6px rgba(0,0,0,.6)}
.badge.kathi{left:-9px}.badge.lukas{right:-9px}
.cover .ct{font-family:var(--black);font-size:1.15rem;line-height:1.15;color:var(--gold)}
.cover .ca{font-style:italic;font-size:.8rem;color:var(--ink-soft);margin-top:8px}
.book:hover .cover{border-color:var(--gold)}
.book:hover .frame{transform:translateY(-3px)}
@media (prefers-reduced-motion:no-preference){.frame{transition:transform .15s}.cover{transition:border-color .15s}}
.meta{margin-top:8px;font-size:.8rem;line-height:1.2}
.meta b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta i{display:block;color:var(--ink-soft);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--ink-soft);padding:0 6px;border-radius:2px}
.tag.read{border-color:var(--gold);color:var(--gold)}
.tag.wishlist{border-color:var(--blood-hi);color:#e58a98}
.empty{text-align:center;color:var(--ink-soft);font-style:italic;padding:60px 0;grid-column:1/-1}

dialog{background:var(--card);color:var(--ink);border:1px solid var(--gold);border-radius:4px;padding:0;width:min(440px,calc(100vw - 32px));
       box-shadow:0 0 40px rgba(139,26,43,.5)}
dialog form{padding:26px 24px}
dialog::backdrop{background:rgba(5,3,6,.75)}
dialog h2{font-family:var(--black);font-weight:400;font-size:2.1rem;margin:0 0 16px;text-align:center;color:var(--gold)}
label{display:block;margin-bottom:14px;color:var(--ink-soft);font-size:.8rem}
label input{margin-top:4px}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{color:var(--ink-soft);font-size:.8rem;margin-bottom:6px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-size:.8rem;cursor:pointer;background:var(--bg-2);color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:4px 14px}
.chips button[aria-pressed="true"]{background:var(--blood);color:var(--ink);border-color:var(--blood-hi)}
.others{margin:-4px 0 14px;font-size:.8rem;color:var(--ink-soft);font-style:italic}
.top{display:flex;gap:16px;align-items:flex-start}
.fields{flex:1;min-width:0}
.preview{width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px;text-align:center}
#previewImg:empty{display:none}
.preview img{width:80px;aspect-ratio:2/3;object-fit:cover;border:1px solid var(--line)}
.preview .btn.small{padding:3px 8px;white-space:nowrap}
.preview span{color:var(--ink-soft);font-style:italic;font-size:.8rem}
#previewImg{display:flex}
.preview #previewNote:empty{display:none}
.btn.small{font-size:.8rem;padding:4px 14px}
.actions{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:10px}
.actions .btn{min-width:150px}
.danger{background:none;border:0;color:#e58a98;font:inherit;cursor:pointer;text-decoration:underline;padding:0}
footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--line);text-align:center;color:var(--ink-soft);font-size:.8rem}
footer button{background:none;border:0;color:var(--ink-soft);font:inherit;text-decoration:underline;cursor:pointer;margin:0 6px}
footer button:hover{color:var(--gold)}
@media (max-width:520px){.grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:24px 20px}.badge{width:26px;height:26px;font-size:.9rem;top:-9px}.badge.kathi{left:-7px}.badge.lukas{right:-7px}.cover .ct{font-size:.95rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lukathi's books</h1>
    <p class="flourish">✦ ✦ ✦</p>
    <p class="here" id="here" hidden></p>
  </header>

  <section class="whos" id="whos" hidden>
    <h2>Who's here?</h2>
    <div class="pick" id="pick"></div>
  </section>

  <main id="app" hidden>
  <div class="bar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <button class="btn" id="addBtn">+ Add book</button>
    <input type="search" id="search" placeholder="Search title or author…" aria-label="Search">
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <button id="exportBtn">Save a backup</button>·<button id="importBtn">Restore a backup</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </footer>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle">A new tome</h2>
    <div class="top">
      <div class="fields">
        <label>Title<input type="text" id="fTitle" required autocomplete="off"></label>
        <label>Author<input type="text" id="fAuthor" autocomplete="off"></label>
      </div>
      <div class="preview">
        <span id="previewImg"></span>
        <button type="button" class="btn ghost small" id="coverBtn">Change cover</button>
        <span id="previewNote"></span>
      </div>
    </div>
    <fieldset>
      <legend id="fLegend">Shelves</legend>
      <div class="chips" id="fChips"></div>
    </fieldset>
    <p class="others" id="others"></p>
    <label id="coverField" hidden>Image link (right-click a cover online › “Copy image address”)
      <input type="text" id="fCover" placeholder="https://…" autocomplete="off"></label>
    <div class="actions">
      <button type="submit" class="btn" id="saveBtn">Save</button>
      <button type="button" class="danger" id="delBtn">Delete</button>
    </div>
  </form>
</dialog>

<script>
const KEY = 'kathi-library-v1';
const SHELVES = [['read','Read'],['toread','To read'],['owned','Owned'],['wishlist','Wishlist']];
// Read/To read exclude each other, and so do Owned/Wishlist.
const OPPOSITE = {read:'toread', toread:'read', owned:'wishlist', wishlist:'owned'};
const PEOPLE = {kathi: {name: 'Kathi', emoji: '🍄'}, lukas: {name: 'Lukas', emoji: '🐷'}};

let who = (() => { try { const w = localStorage.getItem('sribibike-who'); return PEOPLE[w] ? w : null; } catch { return null; } })();
let tab = 'all';
let editing = null;      // id of the book being edited, or null when adding
let picked = new Set();

// Each book keeps its shelves per person: {people: {kathi: ['read','owned'], lukas: ['toread']}}.
// Books from before there were two people have a single `shelves` list, which was Kathi's.
const fromOld = (b, owner) => b.people ? b : (({shelves, ...rest}) => ({...rest, people: {[owner]: shelves || []}}))(b);
const mine = b => b.people?.[who] || [];
// Who has this book on shelf k; with k = 'all', who has it on any shelf.
const holders = (b, k) => Object.keys(PEOPLE).filter(p => k === 'all' ? b.people?.[p]?.length : (b.people?.[p] || []).includes(k));
const shelfNames = list => SHELVES.filter(([k]) => list.includes(k)).map(([, l]) => l).join(' · ');

function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch {}
  return (raw ? JSON.parse(raw) : []).map(b => fromOld(b, 'kathi'));
}
let books = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(books)); } catch {} }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

/* ---------- covers: Open Library first, then Google Books ---------- */
async function findCover(title, author){
  try {
    const q = new URLSearchParams({title, limit: 5, fields: 'cover_i'});
    if (author) q.set('author', author);
    const r = await fetch('https://openlibrary.org/search.json?' + q);
    const d = await r.json();
    const hit = (d.docs || []).find(x => x.cover_i);
    if (hit) return `https://covers.openlibrary.org/b/id/${hit.cover_i}-L.jpg`;
  } catch {}
  try {
    const q = `intitle:${title}` + (author ? ` inauthor:${author}` : '');
    const r = await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=5&q=' + encodeURIComponent(q));
    const d = await r.json();
    for (const it of d.items || []) {
      const l = it.volumeInfo?.imageLinks;
      const u = l?.thumbnail || l?.smallThumbnail;
      if (u) return u.replace(/^http:/, 'https:').replace('&edge=curl', '');
    }
  } catch {}
  return '';
}

/* ---------- render ---------- */
function render(){
  const n = k => books.filter(b => holders(b, k).length).length;
  $('tabs').innerHTML = [['all','All']].concat(SHELVES).map(([k, label]) =>
    `<button role="tab" data-k="${k}" aria-selected="${tab === k}">${label}<small>${k === 'all' ? books.length : n(k)}</small></button>`).join('');

  const q = $('search').value.trim().toLowerCase();
  const list = books
    .filter(b => tab === 'all' || holders(b, tab).length)
    .filter(b => !q || (b.title + ' ' + b.author).toLowerCase().includes(q))
    .sort((a, b) => (a.author || '').localeCompare(b.author || '') || a.title.localeCompare(b.title));

  $('grid').innerHTML = list.length ? list.map(b => `
    <button class="book" data-id="${b.id}">
      <div class="frame">
        <div class="cover">
          <div class="ct">${esc(b.title)}</div><div class="ca">${esc(b.author)}</div>
          ${b.cover ? `<img src="${esc(b.cover)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
        </div>
        ${holders(b, tab).map(p => `<span class="badge ${p}" title="${PEOPLE[p].name}">${PEOPLE[p].emoji}</span>`).join('')}
      </div>
      <div class="meta"><b>${esc(b.title)}</b><i>${esc(b.author)}</i></div>
    </button>`).join('')
    : `<p class="empty">${books.length ? 'Nothing on this shelf… yet.' : 'Click “+ Add book” to summon your first one.'}</p>`;
}

/* ---------- who's here ---------- */
function renderWho(){
  const p = PEOPLE[who];
  $('here').hidden = !p;
  if (p) $('here').innerHTML = `<span class="me" title="${p.name} is here">${p.emoji}</span><button id="switchBtn">not you?</button>`;
  $('pick').innerHTML = Object.entries(PEOPLE).map(([k, {name, emoji}]) => `<button data-p="${k}"><span>${emoji}</span>${name}</button>`).join('');
}
function setWho(k){
  who = k;
  try { k ? localStorage.setItem('sribibike-who', k) : localStorage.removeItem('sribibike-who'); } catch {}
  show();
}
$('pick').addEventListener('click', e => { const k = e.target.closest('button')?.dataset.p; if (k) setWho(k); });
$('here').addEventListener('click', e => { if (e.target.id === 'switchBtn') setWho(null); });

/* ---------- dialog ---------- */
function renderChips(){
  $('fChips').innerHTML = SHELVES.map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${picked.has(k)}">${l}</button>`).join('');
}
function showPreview(url){
  $('previewNote').textContent = '';
  $('previewImg').innerHTML = url ? `<img src="${esc(url)}" alt="" onerror="document.getElementById('previewNote').textContent='That link doesn’t show an image.';this.remove()">` : '';
}
function openDialog(b){
  editing = b ? b.id : null;
  $('dlgTitle').textContent = b ? 'Edit tome' : 'A new tome';
  $('fTitle').value = b?.title || '';
  $('fAuthor').value = b?.author || '';
  picked = new Set(b ? mine(b) : (tab !== 'all' ? [tab] : ['toread']));
  $('fLegend').textContent = `${PEOPLE[who].emoji} ${PEOPLE[who].name}'s shelves`;
  $('others').innerHTML = b ? Object.entries(PEOPLE).filter(([p]) => p !== who && b.people?.[p]?.length)
    .map(([p, {name, emoji}]) => `${emoji} ${name}: ${shelfNames(b.people[p])}`).join('<br>') : '';
  renderChips();
  showPreview(b?.cover);
  $('fCover').value = '';
  $('coverField').hidden = true;
  $('coverBtn').hidden = false;
  $('delBtn').hidden = !b;
  $('saveBtn').disabled = false; $('saveBtn').textContent = 'Save';
  $('dlg').showModal();
  $('fTitle').focus();
}

$('fChips').addEventListener('click', e => {
  const k = e.target.dataset.k; if (!k) return;
  if (picked.has(k)) picked.delete(k); else { picked.add(k); picked.delete(OPPOSITE[k]); }
  renderChips();
});

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const title = $('fTitle').value.trim(), author = $('fAuthor').value.trim();
  if (!title) return;
  const old = books.find(b => b.id === editing);
  const link = $('fCover').value.trim();
  let cover = link || old?.cover || '';
  // Only look a cover up when the book has none: an existing cover is kept until "Change cover" replaces it.
  if (!cover) {
    $('saveBtn').disabled = true; $('saveBtn').textContent = 'Summoning cover…';
    cover = await findCover(title, author);
  }
  const shelves = SHELVES.map(([k]) => k).filter(k => picked.has(k));
  const book = {id: old?.id || Date.now().toString(36), title, author, cover, people: {...old?.people, [who]: shelves}};
  books = old ? books.map(b => b.id === old.id ? book : b) : [...books, book];
  save(); render();
  $('dlg').close();
});

$('coverBtn').addEventListener('click', () => {
  $('coverBtn').hidden = true; $('coverField').hidden = false; $('fCover').focus();
});
$('fCover').addEventListener('input', () => {
  const u = $('fCover').value.trim();
  if (/^https?:\/\/\S+$/.test(u)) showPreview(u);
});

$('delBtn').addEventListener('click', () => {
  const b = books.find(x => x.id === editing);
  if (b && confirm(`Banish “${b.title}” from the library?`)) {
    books = books.filter(x => x.id !== editing); save(); render(); $('dlg').close();
  }
});
// Clicking outside the window closes it without saving (the form fills the dialog, so only the backdrop targets it).
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });
$('addBtn').addEventListener('click', () => openDialog(null));
$('grid').addEventListener('click', e => {
  const el = e.target.closest('.book'); if (el) openDialog(books.find(b => b.id === el.dataset.id));
});
$('tabs').addEventListener('click', e => {
  const k = e.target.closest('button')?.dataset.k; if (k) { tab = k; render(); }
});
$('search').addEventListener('input', render);

/* ---------- backup ---------- */
$('exportBtn').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(books, null, 2)], {type: 'application/json'}));
  a.download = `sribibike-books-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
});
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw 0;
    if (confirm(`Replace the library with the ${data.length} books in this backup?`)) { books = data.map(b => fromOld(b, who)); save(); render(); }
  } catch { alert('That file is not a library backup.'); }
  e.target.value = '';
});

function show(){
  renderWho();
  $('whos').hidden = !!who; $('app').hidden = !who;
  if (who) render();
}
show();
</script>
</body>
</html>
